<title>TAG Trauma Handbook</title>
<meta name="description" content="Searchable handbook of the Royal London Trauma Anaesthesia Group clinical practice guidelines (2025).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap">
<style>
:root{
  --page:#FBFAF6; --surface:#FFFFFF; --ink:#111111; --ink-2:#3F3F3F; --muted:#5A5A5A;
  --line:#CFCBBF; --line-strong:#111111; --bar:#111111; --bar-ink:#FBFAF6;
  --key:#FFE14D; --key-ink:#111111; --link:#0B4F8A; --focus:#FFB81C;
  --mark:#FFE14D; --mark-ink:#111111; --tint:#F1EFE7;
  --scale:1;
  color-scheme:light;
  --f:"Lexend","Atkinson Hyperlegible",Arial,Helvetica,sans-serif;
}
html{font-size:calc(100% * var(--scale));scroll-padding-top:9rem}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font:400 1.125rem/1.6 var(--f);letter-spacing:.005em;-webkit-text-size-adjust:100%}
a{color:var(--link);text-underline-offset:3px;text-decoration-thickness:1.5px}
b,strong{font-weight:700}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--page);border-bottom:3px solid var(--line-strong)}
.bar-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center}
.brand{font-weight:700;font-size:1.05rem;color:var(--ink);text-decoration:none;flex:none;line-height:1.15}
.brand small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;height:2.9rem;border:2px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:0 2.6rem 0 2.6rem;font:400 1.05rem var(--f)}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:3px solid var(--focus);outline-offset:1px}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink);pointer-events:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:2.2rem;height:2.2rem;border-radius:50%;cursor:pointer;font-size:1.5rem;line-height:1}
.tsize{flex:none;border:2px solid var(--line-strong);background:var(--surface);border-radius:999px;height:2.9rem;min-width:2.9rem;padding:0 .7rem;cursor:pointer;font-weight:700;display:flex;align-items:baseline;justify-content:center;gap:1px}
.tsize small{font-size:.75rem}
@media (max-width:640px){.brand{display:none}}

main{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:22px 64px}

/* home */
.intro{max-width:44rem;margin-bottom:18px}
.intro h1{font-size:clamp(2rem,6vw,2.75rem);line-height:1.05;margin:0 0 10px;font-weight:700;text-wrap:balance}
.intro p{margin:0;color:var(--ink-2)}
.notice a{color:var(--ink);font-weight:700;overflow-wrap:anywhere}
.notice{max-width:44rem;border:2px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:12px 16px;font-size:1rem;margin-bottom:10px}
.recent{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 0}
.recent .lbl{font-weight:700;font-size:1rem;margin-right:4px}
.pill{display:inline-flex;align-items:center;border:2px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 14px;font-size:1rem;text-decoration:none;color:var(--ink)}
.pill:hover{background:var(--tint)}
.pill.off{border-style:dashed;border-color:var(--line);color:var(--muted);cursor:help}
.group{margin-top:30px}
.bar-h{background:var(--bar);color:var(--bar-ink);font-size:1.3rem;font-weight:700;margin:0 0 12px;padding:8px 16px;border-radius:8px;line-height:1.3}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:8px}
.quicks{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:8px}
.quick{display:flex;align-items:center;min-height:3.6rem;background:var(--key);color:var(--key-ink);border-radius:12px;padding:10px 14px;font-weight:700;font-size:1.05rem;line-height:1.25;text-decoration:none}
.quick:hover{outline:2px solid var(--line-strong)}
.group.emerg{margin-top:22px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;text-decoration:none;color:var(--ink)}
.item:hover{border-color:var(--line-strong)}
.item h3{margin:0;font-size:1.2rem;line-height:1.25;font-weight:700}
.item p{grid-column:1;margin:0;color:var(--muted);font-size:.95rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .chev{grid-column:2;font-size:1.6rem;line-height:1}
.foot{margin-top:28px;color:var(--muted);font-size:.95rem;max-width:44rem}

/* results */
.res-h{font-weight:700;font-size:1.1rem;margin:0 0 14px}
.res-grp{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.res-grp > a.res-t{display:block;background:var(--bar);color:var(--bar-ink);padding:8px 16px;font-weight:700;font-size:1.15rem;text-decoration:none}
.res-grp > a.res-t span{font-weight:400;font-size:.9rem;opacity:.85;margin-left:8px}
.hit-row{display:block;padding:12px 16px;text-decoration:none;color:var(--ink);border-top:1.5px solid var(--line);font-size:1.02rem}
.res-grp > a.res-t + .hit-row{border-top:0}
.hit-row:hover{background:var(--tint)}
.hit-row .sec{display:block;font-size:.9rem;font-weight:700;color:var(--muted);margin-bottom:2px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:12px;padding:20px}

/* guideline */
.back{display:inline-block;font-size:1rem;color:var(--ink);margin-bottom:6px}
.doc-h h1{font-size:clamp(2.1rem,7vw,3rem);line-height:1.05;margin:0 0 14px;font-weight:700;text-wrap:balance}
.meta{color:var(--muted);font-size:.95rem;margin-bottom:14px}
.aim{max-width:46rem;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;font-size:1rem}
.aim summary{cursor:pointer;font-weight:700}
.aim[open] summary{margin-bottom:6px}
.aim p{margin:0 0 6px}
.aim ul{margin:0;padding-left:1.2rem}
.rel{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center;max-width:46rem}
.rel .lbl{font-weight:700;font-size:1rem;margin-right:2px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4.2rem);z-index:10;background:var(--page);margin:18px -16px 0;padding:8px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1.5px solid var(--line)}
.toc::-webkit-scrollbar{display:none}
.toc a{flex:none;font-size:.95rem;text-decoration:none;color:var(--ink);border:2px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:3px 13px;white-space:nowrap}
.toc a.on{background:var(--bar);color:var(--bar-ink)}
article{max-width:46rem}
.sec{padding-top:6px}
.sec h2{background:var(--bar);color:var(--bar-ink);font-size:1.35rem;line-height:1.3;font-weight:700;margin:30px 0 14px;padding:9px 16px;border-radius:8px;text-wrap:balance}
.sec h3{font-size:1.2rem;font-weight:700;margin:24px 0 8px;line-height:1.3}
.sec p{margin:0 0 12px}
.sec ul{list-style:none;padding:0;margin:0 0 14px}
.sec ul li{position:relative;padding-left:1.5rem;margin:0 0 10px}
.sec ul li::before{content:"";position:absolute;left:.3rem;top:.62em;width:.5rem;height:.5rem;background:var(--ink);border-radius:2px}
.sec ul ul{margin:8px 0 0}
.sec ul ul li::before{background:transparent;border:2px solid var(--ink);width:.45rem;height:.45rem}
.sec ol{margin:0 0 14px;padding-left:1.6rem}
.sec ol li{margin:0 0 10px;padding-left:.2rem}
.sec ol li::marker{font-weight:700}
.callout{margin:14px 0 18px;padding:12px 16px;background:var(--key);color:var(--key-ink);border-radius:12px;font-weight:500}
.callout a{color:var(--key-ink)}
.callout p:last-child,.callout ul:last-child{margin-bottom:0}
.callout ul li::before{background:var(--key-ink)}
.callout strong{color:var(--key-ink)}

/* tables */
.tbl{margin:8px 0 18px;overflow-x:auto}
.tbl table{border-collapse:separate;border-spacing:0;width:100%;font-size:1.02rem;line-height:1.55;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:10px 14px;border-top:1.5px solid var(--line)}
.tbl thead th{border-top:0;font-weight:700;background:var(--tint)}
.tbl thead th:first-child{border-top-left-radius:10px}.tbl thead th:last-child{border-top-right-radius:10px}
.tbl tbody tr:first-child > *{border-top:0}
.tbl thead + tbody tr:first-child > *{border-top:1.5px solid var(--line)}
.tbl td + td,.tbl th + td,.tbl td + th,.tbl th + th{border-left:1.5px solid var(--line)}
.tbl.kv td:first-child{font-weight:700;width:34%}
.tbl tbody th,.tbl td.rowh{font-weight:700}
.tbl ul{margin:0}
@media (max-width:640px){
  .tbl{overflow:visible}
  .tbl table,.tbl tbody,.tbl tr,.tbl td,.tbl th{display:block;width:auto!important}
  .tbl table{border:0;background:none}
  .tbl thead{display:none}
  .tbl tr{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
  .tbl td,.tbl th{border:0!important;padding:0}
  .tbl.kv td:first-child{margin-bottom:3px}
  .tbl.stack td + td,.tbl.stack th + td{margin-top:8px}
  .tbl.stack [data-label]::before{content:attr(data-label);display:block;font-weight:700;font-size:.9rem;color:var(--muted)}
  .tbl.stack .rowh{font-size:1.1rem;margin-bottom:4px}
}

/* figures and bespoke blocks */
figure{margin:12px 0 20px}
.zoom{display:block;width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:10px;cursor:zoom-in}
.zoom img{display:block;margin:0 auto;max-height:560px;width:auto;max-width:100%}
figcaption{font-size:.95rem;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:12px}
figcaption span{flex:none;color:var(--ink);font-weight:700}
.figtext{margin:-10px 0 20px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 16px;font-size:1rem}
.figtext summary{cursor:pointer;font-weight:700}
.figtext[open] summary{margin-bottom:8px}
.figtext p,.figtext ul,.figtext ol{margin:0 0 8px}
.kit{display:grid;gap:10px;margin:8px 0 18px}
.kit-item{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.kit-item img{background:#fff;border-radius:8px;width:110px;height:90px;object-fit:contain}
.kit-item h4{margin:0 0 4px;font-size:1.15rem}
.kit-item ul{margin:0}
.flow{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;margin:8px 0 18px}
.flow-q{font-weight:700;margin-bottom:10px}
.flow-branches{display:grid;gap:10px;padding-left:14px;border-left:3px solid var(--line-strong)}
.flow-b{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.flow-a{font-weight:700;font-size:.9rem;border-radius:999px;padding:1px 10px;margin-top:3px;border:2px solid var(--line-strong)}
.flow-a.yes{background:var(--bar);color:var(--bar-ink)}
.flow-r{background:var(--tint);border-radius:10px;padding:8px 12px}
.bands{display:grid;gap:8px;margin:6px 0 18px}
.band{border-radius:10px;padding:10px 14px;background:var(--surface);border:1.5px solid var(--line)}
.band-mid{border:2px solid var(--line-strong)}
.band-high{background:var(--key);color:var(--key-ink);border-color:var(--key)}
a.xref{font-weight:500}
.src{margin-top:36px;padding-top:12px;border-top:1.5px solid var(--line);font-size:.95rem;color:var(--muted);max-width:46rem}

/* lightbox */
dialog.lb{border:0;padding:0;width:100vw;height:100vh;max-width:none;max-height:none;background:#111;color:#fff}
dialog.lb::backdrop{background:rgba(0,0,0,.9)}
.lb-top{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:#111;z-index:2}
.lb-top p{margin:0;font-size:.95rem;flex:1;min-width:0}
.lb-top button{border:2px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:5px 14px;cursor:pointer;font-size:.95rem;font-weight:700}
.lb-body{overflow:auto;height:calc(100% - 64px);padding:10px 16px 30px}
.lb-body img{display:block;margin:0 auto;background:#fff;max-width:100%;border-radius:8px}
.lb-body.full img{max-width:none;width:1600px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (max-width:520px){.kit-item{grid-template-columns:84px 1fr}.kit-item img{width:84px;height:72px}}

</style>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#" aria-label="Handbook home">TAG Trauma Handbook<small>Royal London · 2025</small></a>
    <div class="search" role="search">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search, e.g. calcium, DLT size, TXA" aria-label="Search all guidelines">
      <span id="kbd" hidden></span>
      <button class="clear" id="clear" type="button" aria-label="Clear search" hidden>×</button>
    </div>
    <button class="tsize" id="tsize" type="button" aria-label="Change text size" title="Text size"><small>A</small>A</button>
  </div>
</header>

<main id="main"></main>

<dialog class="lb" id="lb" aria-label="Figure">
  <div class="lb-top"><p id="lb-cap"></p><button type="button" id="lb-size">Zoom in</button><button type="button" id="lb-close">Close</button></div>
  <div class="lb-body" id="lb-body"><img id="lb-img" alt=""></div>
</dialog>

<script>
const DATA = /*__DATA__*/[];
const $ = (s, el=document) => el.querySelector(s);
const main = $("#main"), q = $("#q"), clearBtn = $("#clear");
const BY = Object.fromEntries(DATA.cpgs.map(c => [c.slug, c]));
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[’‘]/g,"'");

/* ---------- search index: one entry per paragraph / list item / table row ---------- */
const INDEX = [];
for (const c of DATA.cpgs) {
  INDEX.push({c, sid:null, sec:"Scope", text:"Aim: " + c.aim});
  c.objectives.forEach(o => INDEX.push({c, sid:null, sec:"Objectives", text:o}));
  const t = document.createElement("template"); t.innerHTML = c.html;
  t.content.querySelectorAll("section.sec").forEach(sec => {
    const secTitle = sec.querySelector("h2")?.textContent || "";
    sec.querySelectorAll("p, li, tr, figcaption, h3, .flow-r, .kit-item, .band").forEach(el => {
      if (el.tagName === "P" && el.closest("li, td, th")) return;
      let txt;
      if (el.tagName === "LI") { const cl = el.cloneNode(true); cl.querySelectorAll("ul,ol").forEach(n => n.remove()); txt = cl.textContent; }
      else if (el.tagName === "TR") txt = [...el.children].map(x => { const cl = x.cloneNode(true); cl.querySelectorAll("br").forEach(b => b.replaceWith(" ")); cl.querySelectorAll("li").forEach(l => l.append(" ")); return cl.textContent.trim(); }).join(" · ");
      else txt = el.textContent;
      txt = txt.replace(/\s+/g, " ").trim();
      if (txt.length > 1) INDEX.push({c, sid:sec.dataset.sid, sec:secTitle, text:txt, n:norm(txt)});
    });
  });
}
INDEX.forEach(e => { e.n = e.n || norm(e.text); e.hn = norm(e.sec); e.tn = norm(e.c.title); });

const SYN = {txa:["tranexamic"], tranexamic:["txa"], fona:["front of neck","front-of-neck"], mils:["manual in-line","in-line stabilisation","in-line immobilisation"],
  dlt:["double lumen"], olv:["one lung"], sga:["supraglottic"], lma:["supraglottic"], vl:["videolaryngoscop","video laryngoscop"], ric:["rapid infusion"],
  pocus:["ultrasound"], fast:["ultrasound"], cvc:["central"], io:["intra-osseus","intraosseous"], ffp:["plasma"], prbc:["red cell"], ecmo:["extracorporeal"],
  potassium:["k+","hyperkal"], hyperkalaemia:["potassium"], cacl:["calcium chloride"], sux:["suxamethonium"], roc:["rocuronium"], ketamine:["ketamine"],
  icp:["intracranial"], tbi:["brain injury","code black"], pmcs:["peri-mortem caesarian","peri-mortem caesarean"], stumbl:["stumbl"]};
function alts(t){ return [t, ...(SYN[t] || [])]; }
function terms(query){ return norm(query).split(/\s+/).filter(Boolean); }
const hasT = (hay, t) => alts(t).some(a => hay.includes(a));
const flatAlts = ts => ts.flatMap(alts);
function search(query){
  const ts = terms(query); if (!ts.length) return [];
  const out = [];
  for (const e of INDEX) {
    const hay = e.n + " " + e.hn + " " + e.tn;
    if (!ts.every(t => hasT(hay, t))) continue;
    let score = 0;
    for (const t of ts) { if (hasT(e.n, t)) score += 3; if (hasT(e.hn, t)) score += 2; if (hasT(e.tn, t)) score += 1;
      if (new RegExp("\\b" + t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(e.n)) score += 1; }
    out.push({...e, score});
  }
  if (out.length) return out;
  // fallback: all terms somewhere in the same section; show the blocks that carry the most terms
  const secs = new Map();
  for (const e of INDEX) { const k = e.c.slug + "|" + e.sid; if (!secs.has(k)) secs.set(k, []); secs.get(k).push(e); }
  for (const list of secs.values()) {
    const all = list.map(e => e.n).join(" ") + " " + list[0].hn + " " + list[0].tn;
    if (!ts.every(t => hasT(all, t))) continue;
    for (const e of list) { const k = ts.filter(t => hasT(e.n, t)).length; if (k) out.push({...e, score:k}); }
  }
  return out;
}
function highlight(text, ts){
  let h = esc(text);
  const pats = flatAlts(ts).map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).sort((a,b)=>b.length-a.length);
  if (!pats.length) return h;
  return h.replace(new RegExp("(" + pats.join("|") + ")", "gi"), "<mark>$1</mark>");
}
function snippet(text, ts){
  if (text.length <= 220) return highlight(text, ts);
  const n = norm(text); let i = Math.min(...flatAlts(ts).map(t => { const k = n.indexOf(t); return k < 0 ? 1e9 : k; }));
  if (i > 1e8) i = 0;
  const start = Math.max(0, i - 70), end = Math.min(text.length, start + 220);
  return (start ? "… " : "") + highlight(text.slice(start, end), ts) + (end < text.length ? " …" : "");
}

/* ---------- views ---------- */
let pendingTerms = null;
function recent(){ try { return JSON.parse(localStorage.getItem("tag-recent") || "[]").filter(s => BY[s]); } catch { return []; } }
function pushRecent(s){ try { const r = [s, ...recent().filter(x => x !== s)].slice(0, 5); localStorage.setItem("tag-recent", JSON.stringify(r)); } catch {} }

/* one-tap links to the sections most needed under pressure (label, guideline, start of section title) */
const EMERGENCY = [
  {label: "Code Red: induction",        slug: "code-red",        section: "Anaesthetic Considerations"},
  {label: "Code Red: resuscitation",    slug: "code-red",        section: "Resuscitation Considerations"},
  {label: "Traumatic cardiac arrest",   slug: "code-red",        section: "Traumatic Cardiac Arrest"},
  {label: "RSI drugs",                  slug: "ed-rsi",          section: "Drugs"},
  {label: "Front-of-neck access",       slug: "ed-rsi",          section: "Plan D"},
  {label: "Code Black: ICP care",       slug: "code-black",      section: "ICP Care"},
  {label: "Neck injury: airway plan",   slug: "neck-injury",     section: "Airway Management Plan"},
  {label: "Peri-mortem Caesarean",      slug: "pregnant-trauma", section: "Peri-mortem"},
];

/* optional extras supplied by the standalone app build (install button, build date, visit counts) */
const hook = (n, ...a) => (window.APP && typeof window.APP[n] === "function") ? window.APP[n](...a) : "";

function renderHome(){
  currentSlug = null; setWake(false);
  document.title = "TAG Trauma Handbook";
  const rec = recent();
  let h = `<div class="intro"><h1>Trauma anaesthesia guidelines</h1>
    <p>All ${DATA.cpgs.length} Trauma Anaesthesia Group clinical practice guidelines from the Royal London Hospital.</p></div>`;
  h += hook("homeTop");
  const quick = EMERGENCY.map(e => {
    const c = BY[e.slug]; const s = c && c.sections.find(x => x.title.toLowerCase().startsWith(e.section.toLowerCase()));
    return s ? `<a class="quick" href="#${e.slug}.${s.id}">${esc(e.label)}</a>` : "";
  }).join("");
  if (quick) h += `<section class="group emerg"><h2 class="bar-h">In an emergency</h2><div class="quicks">${quick}</div></section>`;
  for (const [g, label] of Object.entries(DATA.groups)) {
    const list = DATA.cpgs.filter(c => c.group === g);
    h += `<section class="group"><h2 class="bar-h">${label}</h2><div class="list">` +
      list.map(c => `<a class="item" href="#${c.slug}"><h3>${esc(c.title)}</h3><span class="chev" aria-hidden="true">›</span></a>`).join("") +
      `</div></section>`;
  }
  if (rec.length) h += `<div class="recent" style="margin-top:36px"><span class="lbl">Recently opened</span>${rec.map(s => `<a class="pill" href="#${s}">${esc(BY[s].title)}</a>`).join("")}</div>`;
  h += `<p class="foot">Text is transcribed from the TAG clinical practice guidelines (version 2, reviewed 2025), with 30 typos corrected. Check the controlled copy before relying on a dose or number. Documents the guidelines refer to but that are not included here (REBOA, Paediatric Trauma, Analgesia for Trauma, Anticoagulation Reversal, Code Red ROTEM algorithm) are shown without a link.</p>`;
  h += hook("homeBottom");
  main.innerHTML = h; window.scrollTo(0, 0);
  hook("view", "/", "Home");
}

function renderResults(query){
  currentSlug = null; setWake(false);
  const ts = terms(query);
  const hits = search(query);
  if (!hits.length) {
    main.innerHTML = `<p class="res-h">No matches</p><div class="empty">Nothing in the ${DATA.cpgs.length} guidelines matches <b>${esc(query)}</b>. Try a shorter word, or an abbreviation such as <b>TXA</b>, <b>MILS</b> or <b>FONA</b>.</div>`;
    return;
  }
  const groups = new Map();
  for (const hit of hits) { if (!groups.has(hit.c.slug)) groups.set(hit.c.slug, []); groups.get(hit.c.slug).push(hit); }
  const ordered = [...groups.values()].sort((a,b) => Math.max(...b.map(x=>x.score)) - Math.max(...a.map(x=>x.score)) || b.length - a.length);
  let h = `<p class="res-h">${hits.length} match${hits.length>1?"es":""} in ${ordered.length} guideline${ordered.length>1?"s":""}</p>`;
  for (const list of ordered) {
    const c = list[0].c; list.sort((a,b) => b.score - a.score);
    h += `<div class="res-grp"><a class="res-t" href="#${c.slug}" data-go>${esc(c.title)}<span>${list.length} match${list.length>1?"es":""}</span></a>` +
      list.slice(0, 6).map(x => `<a class="hit-row" data-go href="#${c.slug}${x.sid ? "." + x.sid : ""}"><span class="sec">${esc(x.sec)}</span>${snippet(x.text, ts)}</a>`).join("") + `</div>`;
  }
  main.innerHTML = h; window.scrollTo(0, 0);
}

let currentSlug = null;
function renderDoc(slug, sid){
  const c = BY[slug]; if (!c) return renderHome();
  currentSlug = slug; setWake(true);
  hook("view", "/" + slug, c.title);
  document.title = c.title + " · TAG Trauma Handbook";
  pushRecent(slug);
  const rel = c.related.length ? `<div class="rel"><span class="lbl">See also</span>${c.related.map(r => r.slug
      ? `<a class="pill" href="#${r.slug}">${esc(BY[r.slug].title)}</a>`
      : `<span class="pill off" title="Not included in this handbook">${esc(r.name.replace(/ CPG$/,""))}</span>`).join("")}</div>` : "";
  main.innerHTML = `<div class="doc">
    <div class="doc-h">
      <a class="back" href="#">‹ All guidelines</a>
      <h1>${esc(c.title)}</h1>
      <details class="aim"><summary>Aim and objectives</summary><p>${esc(c.aim)}</p><ul>${c.objectives.map(o => `<li>${esc(o)}</li>`).join("")}</ul></details>
    </div>
    <nav class="toc" aria-label="Sections">${c.sections.map(s => `<a href="#${slug}.${s.id}" data-sid="${s.id}">${esc(s.title)}</a>`).join("")}</nav>
    <article id="art">${c.html}</article>
    <p class="src">Version ${esc(c.version.split(" ")[0].replace(/\.0$/,""))} · ${esc((c.version.match(/(20\d\d)/)||[,""])[1])}</p>
  </div>`;
  const art = $("#art");
  if (pendingTerms) { markTerms(art, pendingTerms); art.querySelectorAll("details").forEach(d => { if (d.querySelector("mark.hit")) d.open = true; }); }
  const target = sid ? document.getElementById(slug + "." + sid) : null;
  requestAnimationFrame(() => {
    const firstHit = target && pendingTerms ? target.querySelector("mark.hit") : null;
    if (firstHit) window.scrollTo(0, firstHit.getBoundingClientRect().top + window.scrollY - window.innerHeight / 2);
    else if (target) toSection(target);
    else window.scrollTo(0, 0);
    pendingTerms = null; spy();
  });
}

function toSection(el){
  const bar = $(".bar"), toc = $(".toc");
  const off = (bar ? bar.offsetHeight : 0) + (toc ? toc.offsetHeight : 0) + 6;
  window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - off);
}

/* keep the screen awake while a guideline is open (ignored where the phone does not allow it) */
let wake = null;
async function setWake(on){
  try {
    if (on && !wake && "wakeLock" in navigator && !document.hidden) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); }
    else if (!on && wake) { await wake.release(); wake = null; }
  } catch { wake = null; }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && currentSlug) setWake(true); });

/* text size */
const SIZES = [1, 1.15, 1.3];
function applySize(i){ document.documentElement.style.setProperty("--scale", SIZES[i]); $("#tsize").setAttribute("aria-label", "Text size " + Math.round(SIZES[i]*100) + "%. Change text size"); }
let sizeIdx = 0; try { sizeIdx = Math.min(2, Math.max(0, +localStorage.getItem("tag-size") || 0)); } catch {}
applySize(sizeIdx);
$("#tsize").addEventListener("click", () => { sizeIdx = (sizeIdx + 1) % SIZES.length; applySize(sizeIdx); try { localStorage.setItem("tag-size", sizeIdx); } catch {} });

function markTerms(root, ts){
  const pats = flatAlts(ts).filter(t => t.length > 1).map(t => t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).sort((a,b)=>b.length-a.length);
  if (!pats.length) return;
  const re = new RegExp("(" + pats.join("|") + ")", "gi");
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const nt = norm(n.nodeValue); re.lastIndex = 0;
    if (!re.test(nt) || nt.length !== n.nodeValue.length) continue;
    const frag = document.createDocumentFragment(); let last = 0, m; re.lastIndex = 0;
    while ((m = re.exec(nt))) {
      frag.append(n.nodeValue.slice(last, m.index));
      const mk = document.createElement("mark"); mk.className = "hit"; mk.textContent = n.nodeValue.slice(m.index, m.index + m[0].length);
      frag.append(mk); last = m.index + m[0].length;
    }
    frag.append(n.nodeValue.slice(last)); n.replaceWith(frag);
  }
}

/* ---------- section spy ---------- */
function spy(){
  const toc = $(".toc"); if (!toc) return;
  const secs = [...document.querySelectorAll("section.sec")];
  let cur = secs[0];
  for (const s of secs) if (s.getBoundingClientRect().top < 140) cur = s;
  toc.querySelectorAll("a").forEach(a => {
    const on = cur && a.dataset.sid === cur.dataset.sid;
    if (on && !a.classList.contains("on")) { a.classList.add("on"); toc.scrollTo({left: a.offsetLeft - (toc.clientWidth - a.offsetWidth) / 2, behavior: "auto"}); }
    else if (!on) a.classList.remove("on");
  });
}
addEventListener("scroll", () => requestAnimationFrame(spy), {passive:true});

/* ---------- routing ---------- */
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) { if (q.value.trim()) renderResults(q.value.trim()); else renderHome(); return; }
  const [slug, sid] = h.split(".");
  if (slug === currentSlug && !pendingTerms && $("#art")) {
    const el = sid ? document.getElementById(slug + "." + sid) : null;
    if (el) toSection(el);
    return;
  }
  renderDoc(slug, sid);
}
addEventListener("hashchange", route);

let tmr;
q.addEventListener("input", () => {
  clearBtn.hidden = !q.value;
  clearTimeout(tmr);
  tmr = setTimeout(() => {
    const v = q.value.trim();
    if (v) { if (location.hash) history.replaceState(null, "", location.pathname + location.search); renderResults(v); }
    else if (!location.hash) renderHome();
  }, 120);
});
q.addEventListener("keydown", e => { if (e.key === "Escape") { q.value = ""; q.dispatchEvent(new Event("input")); } });
clearBtn.addEventListener("click", () => { q.value = ""; q.dispatchEvent(new Event("input")); q.focus(); });
addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q && !e.metaKey && !e.ctrlKey) { e.preventDefault(); q.focus(); q.select(); }
});
main.addEventListener("click", e => {
  const go = e.target.closest("a[data-go]");
  if (go && q.value.trim()) pendingTerms = terms(q.value.trim());
  const tab = e.target.closest(".toc a");
  if (tab) { e.preventDefault(); const el = document.getElementById(currentSlug + "." + tab.dataset.sid); if (el) toSection(el); return; }
  const z = e.target.closest("button.zoom");
  if (z) openLb(z.dataset.src, z.dataset.cap);
});
document.addEventListener("click", e => {
  const a = e.target.closest("a.brand"); if (a) { q.value = ""; clearBtn.hidden = true;  if (!location.hash) renderHome(); }
});

/* ---------- lightbox ---------- */
const lb = $("#lb"), lbBody = $("#lb-body");
function openLb(src, cap){
  $("#lb-img").src = src; $("#lb-img").alt = cap; $("#lb-cap").textContent = cap;
  lbBody.classList.remove("full"); $("#lb-size").textContent = "Zoom in";
  if (lb.showModal) lb.showModal(); else lb.setAttribute("open", "");
}
$("#lb-close").addEventListener("click", () => lb.close());
$("#lb-size").addEventListener("click", () => { const f = lbBody.classList.toggle("full"); $("#lb-size").textContent = f ? "Fit to screen" : "Zoom in"; });
lb.addEventListener("click", e => { if (e.target === lb || e.target === lbBody) lb.close(); });

route();
</script>
