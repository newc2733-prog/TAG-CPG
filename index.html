<style>
@font-face{font-family:"Lexend";font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/lexend-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Lexend";font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/lexend-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
.update{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:50;background:#111;color:#FBFAF6;border:0;border-radius:999px;padding:12px 20px;font:700 1rem "Lexend",Arial,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}
.install{max-width:44rem;margin-top:16px;font-size:.95rem;color:#5A5A5A}
.getapp{max-width:44rem;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 0}
.getapp button{font:700 1.05rem "Lexend",Arial,sans-serif;border-radius:999px;cursor:pointer;padding:10px 20px;min-height:3rem}
.getapp .go{background:#111;color:#FBFAF6;border:2px solid #111}
.getapp .no{background:none;color:#111;border:0;font-weight:400;text-decoration:underline;padding:10px 6px}
dialog.how{border:2px solid #111;border-radius:16px;padding:20px;max-width:min(26rem,calc(100vw - 32px));background:#fff;color:#111;font:400 1.05rem/1.55 "Lexend",Arial,sans-serif}
dialog.how::backdrop{background:rgba(0,0,0,.55)}
dialog.how h2{margin:0 0 10px;font-size:1.35rem;line-height:1.2}
dialog.how ol{margin:0 0 12px;padding-left:1.4rem}
dialog.how li{margin:0 0 10px}
dialog.how li::marker{font-weight:700}
dialog.how svg{width:1.3em;height:1.3em;vertical-align:-.28em}
dialog.how p{margin:0 0 14px;font-size:.95rem;color:#5A5A5A}
dialog.how button{font:700 1.05rem "Lexend",Arial,sans-serif;background:#111;color:#FBFAF6;border:0;border-radius:999px;padding:10px 24px;cursor:pointer}
:root{
  --page:#FBFAF6; --surface:#FFFFFF; --ink:#111111; --ink-2:#3F3F3F; --muted:#5A5A5A;
  --line:#CFCBBF; --line-strong:#111111; --bar:#111111; --bar-ink:#FBFAF6;
  --key:#FFE14D; --key-ink:#111111; --link:#0B4F8A; --focus:#FFB81C;
  --mark:#FFE14D; --mark-ink:#111111; --tint:#F1EFE7;
  --scale:1;
  color-scheme:light;
  --f:"Lexend","Atkinson Hyperlegible",Arial,Helvetica,sans-serif;
  /* colour option: one colour and one pale tint per group of guidelines */
  --navy:#0B2F5B;
  --c-resus:#C8102E; --t-resus:#FBE3E6;
  --c-airway:#0067B9; --t-airway:#DEEDF9;
  --c-populations:#7A3E9D; --t-populations:#EFE3F6;
  --c-injuries:#00796B; --t-injuries:#DBF0ED;
  --c-procedures:#B85C00; --t-procedures:#FBE8D5;
  --c-kit:#3E5568; --t-kit:#E3E9EE;
  --c-logistics:#7A5C00; --t-logistics:#F5EDCF;
}
html{font-size:calc(100% * var(--scale));scroll-padding-top:9rem}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font:400 1.125rem/1.6 var(--f);letter-spacing:.005em;-webkit-text-size-adjust:100%}
a{color:var(--link);text-underline-offset:3px;text-decoration-thickness:1.5px}
b,strong{font-weight:700}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--page);border-bottom:3px solid var(--line-strong)}
.bar-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center}
.brand{font-weight:700;font-size:1.05rem;color:var(--ink);text-decoration:none;flex:none;line-height:1.15}
/* back to the list of guidelines; always in reach because the bar stays at the top */
.homebtn{flex:none;width:2.5rem;height:2.5rem;border-radius:50%;border:2px solid var(--line-strong);background:var(--bar);color:var(--bar-ink);display:grid;place-items:center;text-decoration:none}
.homebtn svg{width:1.2rem;height:1.2rem;margin-right:.1rem}
:root[data-style="colour"] .homebtn{background:var(--key);color:var(--key-ink);border-color:var(--key)}
.brand small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.search{flex:1;position:relative;min-width:0;max-width:30rem;margin-right:auto}
.search input{width:100%;height:2.5rem;border:2px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:0 2.3rem 0 2.4rem;font:400 1rem var(--f)}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:3px solid var(--focus);outline-offset:1px}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink);pointer-events:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:2rem;height:2rem;border-radius:50%;cursor:pointer;font-size:1.4rem;line-height:1}
.tsize{flex:none;border:2px solid var(--line-strong);background:var(--surface);border-radius:999px;height:2.5rem;min-width:2.5rem;padding:0 .55rem;cursor:pointer;font-weight:700;display:flex;align-items:baseline;justify-content:center;gap:1px}
.tsize small{font-size:.75rem}
@media (max-width:640px){.brand{display:none}}

main{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:22px 64px}

/* home */
.intro{max-width:44rem;margin-bottom:18px}
.intro .logo{display:block;width:11.5rem;height:auto;margin:2px 0 16px}
.intro h1{font-size:clamp(2rem,6vw,2.75rem);line-height:1.05;margin:0 0 10px;font-weight:700;text-wrap:balance}
.intro p{margin:0;color:var(--ink-2)}
.notice a{color:var(--ink);font-weight:700;overflow-wrap:anywhere}
.notice{max-width:44rem;border:2px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:12px 16px;font-size:1rem;margin-bottom:10px}
.recent{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 0}
.recent .lbl{font-weight:700;font-size:1rem;margin-right:4px}
.pill{display:inline-flex;align-items:center;border:2px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 14px;font-size:1rem;text-decoration:none;color:var(--ink)}
.pill:hover{background:var(--tint)}
.pill.off{border-style:dashed;border-color:var(--line);color:var(--muted);cursor:help}
.group{margin-top:30px}
.bar-h{background:var(--bar);color:var(--bar-ink);font-size:1.3rem;font-weight:700;margin:0 0 12px;padding:8px 16px;border-radius:8px;line-height:1.3}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:8px}
.quicks{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:8px}
.quick{display:flex;align-items:center;min-height:3.6rem;background:var(--key);color:var(--key-ink);border-radius:12px;padding:10px 14px;font-weight:700;font-size:1.05rem;line-height:1.25;text-decoration:none}
.quick:hover{outline:2px solid var(--line-strong)}
.quick .ql{display:block}
.quicks.plain .quick{background:var(--surface);border:2px solid var(--line-strong)}
.group.emerg{margin-top:22px}
/* guideline groups as drop-downs */
.dds{display:flex;flex-direction:column;gap:10px;margin-top:30px}
.dd > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;margin:0}
.dd > summary::-webkit-details-marker{display:none}
.dd > summary > span:first-child{flex:1;min-width:0}
.dd-c{flex:none;width:.7rem;height:.7rem;border-right:3px solid currentColor;border-bottom:3px solid currentColor;transform:translateY(-3px) rotate(45deg);transition:transform .15s}
.dd[open] .dd-c{transform:translateY(2px) rotate(-135deg)}
.dd .list{margin:10px 0 6px}
.dd-quick{margin-top:30px}
.dd-quick .quicks{margin:10px 0 6px}
.dd-quick + .dds{margin-top:10px}
@media (prefers-reduced-motion:reduce){.dd-c{transition:none}}
.intro-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.fbbtn{flex:none;font:500 .95rem var(--f);border:2px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 16px;cursor:pointer}
.fb{position:fixed;inset:0;z-index:50;background:rgba(17,17,17,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 70px) 16px 16px}
.fb-in{width:100%;max-width:30rem;background:var(--surface);border:2px solid var(--line-strong);border-radius:14px;padding:16px 18px}
.fb-in h2{margin:0 0 6px;font-size:1.3rem}
.fb-in p{margin:0 0 10px;font-size:1rem;color:var(--ink-2)}
.fb-in textarea{width:100%;font:400 1rem/1.45 var(--f);border:2px solid var(--line-strong);border-radius:10px;padding:8px 10px;background:var(--page);color:var(--ink);resize:vertical}
.fb-act{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.fb-act button{font:700 1rem var(--f);border-radius:999px;padding:8px 20px;cursor:pointer;border:2px solid var(--line-strong)}
.fb-act .ghost{background:var(--surface);color:var(--ink)}
.fb-act .send{background:var(--bar);color:var(--bar-ink)}
.fb-act .send:disabled{opacity:.5;cursor:default}
.fb-msg{margin:10px 0 0!important;border-radius:8px;padding:8px 10px;background:var(--tint);color:var(--ink)!important;font-weight:500}
.fb-msg.ok{background:var(--key)}
.fb-msg.bad{background:#FBE3E6}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;text-decoration:none;color:var(--ink)}
.item:hover{border-color:var(--line-strong)}
.item h3{margin:0;font-size:1.2rem;line-height:1.25;font-weight:700}
.item p{grid-column:1;margin:0;color:var(--muted);font-size:.95rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .chev{grid-column:2;font-size:1.6rem;line-height:1}
.acklink{display:flex;justify-content:space-between;align-items:center;max-width:24rem;margin-top:30px;padding:10px 16px;border:2px solid var(--navy);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:700;text-decoration:none}
.acklink .chev{font-size:1.5rem;line-height:1;color:var(--navy)}
.foot{margin-top:28px;color:var(--muted);font-size:.95rem;max-width:44rem}

/* look switch */
.stylectl{flex:none;display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem}
@media (max-width:640px){.stylelbl{display:none}}
/* a round button like the text-size one. Its disc shows the look a tap switches to:
   a colour wheel while the page is black and white, half black and half white while it is in colour. */
.stylebtn{flex:none;width:2.5rem;height:2.5rem;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);padding:0;cursor:pointer;display:grid;place-items:center}
.stylebtn span{width:1.5rem;height:1.5rem;border-radius:50%;background:conic-gradient(#E5243B,#F28C28,#F2C94C,#2BA84A,#0B84D8,#7A3E9D,#E5243B)}
:root[data-style="colour"] .stylebtn{border-color:#fff}
:root[data-style="colour"] .stylebtn span{background:linear-gradient(135deg,#111 0 50%,#fff 50% 100%);box-shadow:0 0 0 2px #111}
:root[data-style="colour"] .stylelbl{color:#fff}
.grptag{display:none}

/* colour option (data-style="colour" on the page). Everything else stays as the original. */
.grp-resus{--gc:var(--c-resus);--gt:var(--t-resus)}
.grp-airway{--gc:var(--c-airway);--gt:var(--t-airway)}
.grp-populations{--gc:var(--c-populations);--gt:var(--t-populations)}
.grp-injuries{--gc:var(--c-injuries);--gt:var(--t-injuries)}
.grp-procedures{--gc:var(--c-procedures);--gt:var(--t-procedures)}
.grp-kit{--gc:var(--c-kit);--gt:var(--t-kit)}
.grp-logistics{--gc:var(--c-logistics);--gt:var(--t-logistics)}
.grp-about{--gc:var(--navy);--gt:#E1E8F0}
:root[data-style="colour"] .bar{background:var(--navy);border-bottom-color:var(--navy)}
:root[data-style="colour"] .brand,:root[data-style="colour"] .brand small{color:#fff}
:root[data-style="colour"] .search input,:root[data-style="colour"] .tsize{border-color:#fff}
:root[data-style="colour"] .grp .bar-h{background:var(--gc);color:#fff}
:root[data-style="colour"] .grp .item{background:var(--gt);border-color:var(--gt)}
:root[data-style="colour"] .grp .item:hover{border-color:var(--gc)}
:root[data-style="colour"] .grp .item .chev{color:var(--gc)}
:root[data-style="colour"] .quicks.plain .quick{border-color:var(--navy)}
:root[data-style="colour"] .grp .grptag{display:inline-block;background:var(--gc);color:#fff;font-weight:700;font-size:.85rem;border-radius:999px;padding:2px 12px;margin:2px 0 8px}
:root[data-style="colour"] .grp .sec h2{background:var(--gc);color:#fff}
:root[data-style="colour"] .grp .toc a{border-color:var(--gc);color:var(--gc)}
:root[data-style="colour"] .grp .toc a.on{background:var(--gc);color:#fff}
:root[data-style="colour"] .grp .sec ul > li::before{background:var(--gc)}
:root[data-style="colour"] .grp .sec ul ul > li::before{background:transparent;border-color:var(--gc)}
:root[data-style="colour"] .grp .sec .callout ul > li::before{background:var(--key-ink)}
:root[data-style="colour"] .grp .tbl.kv td:first-child,:root[data-style="colour"] .grp .tbl tbody th,:root[data-style="colour"] .grp .tbl td.rowh{color:var(--gc)}
:root[data-style="colour"] .grp .tbl.kv td:first-child strong{color:inherit}
:root[data-style="colour"] .res-grp.grp > a.res-t{background:var(--gc);color:#fff}
:root[data-style="colour"] .flow-a.yes{background:var(--gc);border-color:var(--gc);color:#fff}

/* results */
.res-h{font-weight:700;font-size:1.1rem;margin:0 0 14px}
.res-grp{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.res-grp > a.res-t{display:block;background:var(--bar);color:var(--bar-ink);padding:8px 16px;font-weight:700;font-size:1.15rem;text-decoration:none}
.res-grp > a.res-t span{font-weight:400;font-size:.9rem;opacity:.85;margin-left:8px}
.hit-row{display:block;padding:12px 16px;text-decoration:none;color:var(--ink);border-top:1.5px solid var(--line);font-size:1.02rem}
.res-grp > a.res-t + .hit-row{border-top:0}
.hit-row:hover{background:var(--tint)}
.hit-row .sec{display:block;font-size:.9rem;font-weight:700;color:var(--muted);margin-bottom:2px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:12px;padding:20px}

/* guideline */
.back{display:inline-block;font-size:1rem;color:var(--ink);margin-bottom:6px}
.doc-h h1{font-size:clamp(2.1rem,7vw,3rem);line-height:1.05;margin:0 0 14px;font-weight:700;text-wrap:balance}
.meta{color:var(--muted);font-size:.95rem;margin-bottom:14px}
.aim{max-width:46rem;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;font-size:1rem}
.aim summary{cursor:pointer;font-weight:700}
.aim[open] summary{margin-bottom:6px}
.aim p{margin:0 0 6px}
.aim ul{margin:0;padding-left:1.2rem}
.rel{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center;max-width:46rem}
.rel .lbl{font-weight:700;font-size:1rem;margin-right:2px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 3.9rem);z-index:10;background:var(--page);margin:18px -16px 0;padding:8px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1.5px solid var(--line)}
.toc::-webkit-scrollbar{display:none}
.toc a{flex:none;font-size:.95rem;text-decoration:none;color:var(--ink);border:2px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:3px 13px;white-space:nowrap}
.toc a.on{background:var(--bar);color:var(--bar-ink)}
article{max-width:46rem}
.sec{padding-top:6px}
.sec h2{background:var(--bar);color:var(--bar-ink);font-size:1.35rem;line-height:1.3;font-weight:700;margin:30px 0 14px;padding:9px 16px;border-radius:8px;text-wrap:balance}
.sec h3{font-size:1.2rem;font-weight:700;margin:24px 0 8px;line-height:1.3}
.sec p{margin:0 0 12px}
.sec ul{list-style:none;padding:0;margin:0 0 14px}
.sec ul > li{position:relative;padding-left:1.5rem;margin:0 0 10px}
.sec ul > li::before{content:"";position:absolute;left:.3rem;top:.62em;width:.5rem;height:.5rem;background:var(--ink);border-radius:2px}
.sec ul ul,.sec ul ol,.sec ol ul,.sec ol ol{margin:8px 0 0}
.sec ul ul > li::before{background:transparent;border:2px solid var(--ink);width:.45rem;height:.45rem}
.sec ol{margin:0 0 14px;padding-left:1.6rem}
.sec ol > li{margin:0 0 10px;padding-left:.2rem}
.sec ol > li::marker{font-weight:700}
.anchor{display:block;height:0}
.callout{margin:14px 0 18px;padding:12px 16px;background:var(--key);color:var(--key-ink);border-radius:12px;font-weight:500}
.callout a{color:var(--key-ink)}
.callout p:last-child,.callout ul:last-child{margin-bottom:0}
.callout ul > li::before{background:var(--key-ink)}
.callout strong{color:var(--key-ink)}

/* tables */
.tbl{margin:8px 0 18px;overflow-x:auto}
.tbl table{border-collapse:separate;border-spacing:0;width:100%;font-size:1.02rem;line-height:1.55;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:10px 14px;border-top:1.5px solid var(--line)}
.tbl thead th{border-top:0;font-weight:700;background:var(--tint)}
.tbl thead th:first-child{border-top-left-radius:10px}.tbl thead th:last-child{border-top-right-radius:10px}
.tbl tbody tr:first-child > *{border-top:0}
.tbl thead + tbody tr:first-child > *{border-top:1.5px solid var(--line)}
.tbl td + td,.tbl th + td,.tbl td + th,.tbl th + th{border-left:1.5px solid var(--line)}
.tbl.kv td:first-child{font-weight:700;width:34%}
.tbl tbody th,.tbl td.rowh{font-weight:700}
.tbl ul{margin:0}
@media (max-width:640px){
  .tbl{overflow:visible}
  .tbl table,.tbl tbody,.tbl tr,.tbl td,.tbl th{display:block;width:auto!important}
  .tbl table{border:0;background:none}
  .tbl thead{display:none}
  .tbl tr{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
  .tbl td,.tbl th{border:0!important;padding:0}
  .tbl.kv td:first-child{margin-bottom:3px}
  .tbl.stack td + td,.tbl.stack th + td{margin-top:8px}
  .tbl.stack [data-label]::before{content:attr(data-label);display:block;font-weight:700;font-size:.9rem;color:var(--muted)}
  .tbl.stack .rowh{font-size:1.1rem;margin-bottom:4px}
}

/* figures and bespoke blocks */
figure{margin:12px 0 20px}
.zoom{display:block;width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:10px;cursor:zoom-in}
.zoom img{display:block;margin:0 auto;max-height:560px;width:auto;max-width:100%}
figcaption{font-size:.95rem;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:12px}
figcaption span{flex:none;color:var(--ink);font-weight:700}
.figtext{margin:-10px 0 20px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 16px;font-size:1rem}
.figtext summary{cursor:pointer;font-weight:700}
.figtext[open] summary{margin-bottom:8px}
.figtext p,.figtext ul,.figtext ol{margin:0 0 8px}
.kit{display:grid;gap:10px;margin:8px 0 18px}
.kit-item{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.kit-item img{background:#fff;border-radius:8px;width:110px;height:90px;object-fit:contain}
.kit-item h4{margin:0 0 4px;font-size:1.15rem}
.kit-item ul{margin:0}
.flow{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;margin:8px 0 18px}
.flow-q{font-weight:700;margin-bottom:10px}
.flow-branches{display:grid;gap:10px;padding-left:14px;border-left:3px solid var(--line-strong)}
.flow-b{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.flow-a{font-weight:700;font-size:.9rem;border-radius:999px;padding:1px 10px;margin-top:3px;border:2px solid var(--line-strong)}
.flow-a.yes{background:var(--bar);color:var(--bar-ink)}
.flow-r{background:var(--tint);border-radius:10px;padding:8px 12px}
.bands{display:grid;gap:8px;margin:6px 0 18px}
.band{border-radius:10px;padding:10px 14px;background:var(--surface);border:1.5px solid var(--line)}
.band-mid{border:2px solid var(--line-strong)}
.band-high{background:var(--key);color:var(--key-ink);border-color:var(--key)}
a.xref{font-weight:500}
.src{margin-top:36px;padding-top:12px;border-top:1.5px solid var(--line);font-size:.85rem;color:var(--muted);max-width:46rem}

/* lightbox */
dialog.lb{border:0;padding:0;width:100vw;height:100vh;max-width:none;max-height:none;background:#111;color:#fff}
dialog.lb::backdrop{background:rgba(0,0,0,.9)}
.lb-top{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:#111;z-index:2}
.lb-top p{margin:0;font-size:.95rem;flex:1;min-width:0}
.lb-top button{border:2px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:5px 14px;cursor:pointer;font-size:.95rem;font-weight:700}
.lb-body{overflow:auto;height:calc(100% - 64px);padding:10px 16px 30px}
.lb-body img{display:block;margin:0 auto;background:#fff;max-width:100%;border-radius:8px}
.lb-body.full img{max-width:none;width:1600px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (max-width:520px){.kit-item{grid-template-columns:84px 1fr}.kit-item img{width:84px;height:72px}}

<script>
const standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const BUILD_LABEL = "8 Oct 2026";

/* ---- Add to Home Screen ----
   Android/Chrome lets a page open the install prompt from a button. iPhone and iPad do not,
   so there the button shows the three taps instead. */
let installEvent = null, installHidden = false;
try { installHidden = localStorage.getItem("tag-install-hide") === "1"; } catch {}
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvent = e; });
addEventListener("appinstalled", () => { installEvent = null; hideInstall(true); });
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function hideInstall(remember){
  installHidden = true; if (remember) { try { localStorage.setItem("tag-install-hide", "1"); } catch {} }
  document.querySelectorAll(".getapp").forEach(el => el.remove());
}
function showHow(){
  let d = document.getElementById("how");
  if (!d) {
    d = document.createElement("dialog"); d.id = "how"; d.className = "how";
    const share = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 15V3M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
    d.innerHTML = isIOS
      ? `<h2>Add to your Home Screen</h2><ol><li>Tap the Share button ${share} in your browser's toolbar.</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol><p>If you can't see that option, open this page in Safari first.</p><button type="button">Got it</button>`
      : `<h2>Add to your home screen</h2><ol><li>Open your browser's menu (the three dots).</li><li>Tap <b>Add to Home screen</b> or <b>Install app</b>.</li><li>Tap <b>Install</b> or <b>Add</b>.</li></ol><button type="button">Got it</button>`;
    d.querySelector("button").addEventListener("click", () => d.close());
    d.addEventListener("click", e => { if (e.target === d) d.close(); });
    document.body.append(d);
  }
  if (d.showModal) d.showModal(); else d.setAttribute("open", "");
}
document.addEventListener("click", async e => {
  if (e.target.closest("[data-install]")) {
    if (installEvent) { const ev = installEvent; installEvent = null; ev.prompt(); try { const r = await ev.userChoice; if (r && r.outcome === "accepted") hideInstall(true); } catch {} }
    else showHow();
  } else if (e.target.closest("[data-install-no]")) hideInstall(true);
});

/* ---- visit counts (anonymous, no cookies); does nothing if no counter is set or the phone is offline ---- */
let lastCounted = "";
function countView(path, title){
  if (path === lastCounted) return; lastCounted = path;
  try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({path, title, event: false}); else pendingView = {path, title}; } catch {}
}
let pendingView = null;
addEventListener("load", () => { const t = setInterval(() => { if (window.goatcounter && window.goatcounter.count) { clearInterval(t); if (pendingView) { try { window.goatcounter.count({...pendingView, event: false}); } catch {} pendingView = null; } } }, 500); setTimeout(() => clearInterval(t), 15000); });

window.APP = {
  homeTop: () => (standalone || installHidden) ? "" : `<div class="getapp"><button type="button" class="go" data-install>Add to Home Screen</button><button type="button" class="no" data-install-no>Not now</button></div>`,
  updated: () => ` · Updated ${BUILD_LABEL}`,
  homeBottom: () => ``,
  view: (path, title) => { countView(path, title); return ""; },
};
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(reg => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
    setInterval(check, 60 * 60 * 1000);
  }).catch(() => {});
  let prompted = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || prompted) return;   // first install: nothing to announce
    prompted = true;
    const b = document.createElement("button");
    b.className = "update"; b.type = "button"; b.textContent = "New version ready. Tap to update";
    b.addEventListener("click", () => location.reload());
    document.body.append(b);
  });
}
const DATA = {"groups": {"resus": "Resuscitation", "airway": "Airway", "populations": "Special populations", "injuries": "Specific injuries", "procedures": "Procedures & skills", "kit": "Kit", "logistics": "Logistics"}, "cpgs": [{"slug": "code-red", "title": "Code Red", "group": "resus", "version": "2 (reviewed June 2025)", "effective": "1 July 2022", "review": "1 July 2028", "hidden": false, "aim": "To ensure all trauma patients with major haemorrhage receive safe and effective anaesthesia and resuscitation.", "objectives": ["Describe a safe approach to anaesthesia in Code Red.", "Understand and apply the principles of haemostatic & metabolic resuscitation.", "Describe the practicalities of delivering optimal resuscitation during Code Red.", "Highlight the non-technical considerations during Code Red."], "footer": "", "related": [{"name": "Vascular Access CPG", "slug": "vascular-access"}, {"name": "REBOA CPG", "slug": null}, {"name": "Emergency Department RSI CPG", "slug": "ed-rsi"}, {"name": "Ultrasound CPG", "slug": "ultrasound"}, {"name": "Paediatric Trauma CPG", "slug": null}, {"name": "Elderly Trauma CPG", "slug": "elderly-trauma"}, {"name": "Code Red Rotem Algorithm", "slug": "rotem-algorithm"}], "sections": [{"id": "s1", "title": "Background"}, {"id": "s2", "title": "Anaesthetic Considerations"}, {"id": "s3", "title": "Resuscitation Considerations"}, {"id": "s4", "title": "Practical & Non-Technical Considerations"}, {"id": "s5", "title": "Traumatic Cardiac Arrest / Peri-Arrest Algorithm"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"code-red.s1\"><h2>Background<\/h2>\n<p>Exsanguinating haemorrhage is the leading cause of preventable death after major trauma. Advances in the understanding of trauma pathophysiology and transfusion science have led to significant improvements in survival from bleeding in recent years. This CPG describes the key elements required for successful resuscitation in critically injured and actively bleeding trauma patients, typically known at Royal London Hospital as ‘Code Red’.<\/p>\n<aside class=\"callout\">\n<p><strong>Note:<\/strong> This CPG is intended for the most profoundly critically-ill and unstable Code Red patient. All recommendations, doses and manoeuvres may be titrated or adjusted as required, either initially or as resuscitation progresses and physiological stability and reserve improve. In this context, ‘’active bleeding’’ refers to <strong>severe haemorrhage<\/strong> at a rate causing shock and minimal or no response to volume resuscitation.<\/p>\n<\/aside>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"code-red.s2\"><h2>Anaesthetic Considerations<\/h2>\n<p>Keep all elements of anaesthesia as simple and standardised as possible<\/p>\n<h3>Induction for common Code Red Scenarios:<\/h3>\n<div class=\"tbl kv\"><table>\n<thead>\n<tr>\n<th>Scenario<\/th>\n<th>Induction<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Awake<\/strong><\/td>\n<td>Fentanyl: Ketamine: Rocuronium 1mcg/kg : 1mg/kg : 1mg/kg<\/td>\n<\/tr>\n<tr>\n<td><strong>Shocked &amp; Drowsy<\/strong><\/td>\n<td>Ketamine: Rocuronium 1mg/kg : 1mg/kg<\/td>\n<\/tr>\n<tr>\n<td><strong>Unconscious or Peri-arrest<\/strong><\/td>\n<td>Rocuronium 100mg<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>The <strong>3:2:1<\/strong> ratio should be <strong>reserved<\/strong> for haemodynamically <strong>INTACT<\/strong> patients<\/li>\n<\/ul>\n<h3>Maintenance:<\/h3>\n<ul>\n<li>If intubated in the field, top up paralysis on patient’s arrival with <strong>Rocuronium<\/strong> and note the time.<\/li>\n<li>Administer <strong>Co-amoxiclav 1.2g<\/strong> early (unless known allergy).<\/li>\n<li>Maintain analgesia and anaesthesia with <strong>intermittent boluses of Fentanyl 25-50mcg, increasing as tolerated.<\/strong> Beware of large doses of Fentanyl – it can cause significant hypotension in bleeding trauma patients.<\/li>\n<li>In early profound hypovolaemia before surgical control, maintenance may be achieved with <strong>aliquots of Ketamine (20 - 40mg).<\/strong><\/li>\n<li>In patients that are approaching haemodynamic stability, undergoing transfer or awaiting an ACCU bed, anaesthesia may be maintained with <strong>low dose propofol infusion (2-15 ml/hour).<\/strong><\/li>\n<li>In the operating theatre utilize cautious, small aliquots of fentanyl or ketamine as tolerated until the resuscitation is well established. Once physiology permits, a volatile can be added. Typically, <strong>Sevoflurane at 0.3 - 0.5 MAC.<\/strong><\/li>\n<li><strong>TIVA should not be used in Code Red/bleeding advanced trauma patients<\/strong><\/li>\n<\/ul>\n<h3>Context &amp; Rationale:<\/h3>\n<p><strong>Haemodynamic status<\/strong> - Drugs take longer to act due to prolonged circulation times and volumes of distribution. Patients are intolerant to standard drug regimens due to catecholamine depletion and/or myocardial depression.<\/p>\n<p><strong>Rocuronium<\/strong> - Usually given as a 100mg push. Even in morbidly obese patients where IBW dosing is typical.<\/p>\n<p><strong>Nature of injuries<\/strong> - The principle behind a fentanyl-heavy approach in trauma patients is to restrict the neuroendocrine stress response to tissue injury without blunting the protective autonomic responses to blood loss, and opening the microvascular capacitance slowly. Therefore, a polytrauma patient with a high tissue injury burden will require (and tolerate) more fentanyl earlier in their timeline than a patient exsanguinating from a single stab wound.<\/p>\n<p><strong>Peri-arrest patients<\/strong> - Consider zero PEEP and low tidal volumes initially as a sudden rise in intrathoracic pressure with IPPV may adversely affect preload in the volume depleted patient. As soon as the patient is volume restored, return PEEP to the ventilation strategy.<\/p>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"code-red.s3\"><h2>Resuscitation Considerations<\/h2>\n<div class=\"tbl kv\"><table>\n<tbody>\n<tr>\n<td><strong>Permissive hypotension<\/strong><\/td>\n<td>Aim to maintain SBP ≥ 60-70mmHg (see below)<\/td>\n<\/tr>\n<tr>\n<td><strong>Blood product ratio 1:1:1<\/strong><\/td>\n<td><strong>Avoid crystalloids<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>ROTEM Guidance<\/strong><\/td>\n<td>Maintain pack A/B ratios until ROTEM results available, then products as per <a class=\"xref\" href=\"#rotem-algorithm.s2\">algorithm<\/a> <strong>in addition<\/strong> to packs<\/td>\n<\/tr>\n<tr>\n<td><strong>Tranexamic Acid<\/strong><\/td>\n<td><strong>2g<\/strong> (within first 3 hours)<br/><strong>1g<\/strong> (every whole body transfusion)<\/td>\n<\/tr>\n<tr>\n<td><strong>Calcium<\/strong><\/td>\n<td><strong>10 ml 10% Calcium Chloride<\/strong><br/>Keep ionised Ca<sup>2+<\/sup> &gt; 1.0<\/td>\n<\/tr>\n<tr>\n<td><strong>Bicarbonate<\/strong><\/td>\n<td><strong>1ml/kg of 8.4%<\/strong> for severe, profound acidosis<\/td>\n<\/tr>\n<tr>\n<td><strong>Potassium<\/strong><\/td>\n<td><strong>10 ml 10% Calcium Chloride<\/strong> (omit if Ca<sup>2+<\/sup> &gt; 1.3)<br/><strong>Insulin/ Dextrose:<\/strong> 50u insulin in 50ml of 50% dextrose.<\/td>\n<\/tr>\n<tr>\n<td><strong>Noradrenaline/Adrenaline<\/strong><\/td>\n<td>Should only be considered once the haemorrhage has been controlled and patient’s volume restored.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Context &amp; Rationale:<\/h3>\n<p>The goal is to <strong>maintain organ perfusion and minimise blood loss<\/strong> until definitive haemostasis can be achieved.<\/p>\n<p>Definitive bleeding control may be via surgery or Interventional Radiology. In general, critically unstable patients should be brought to theatre. TAG Consultant assessment of the physiology should inform this decision in discussion with the Trauma Surgeon and Trauma Team Leader.<\/p>\n<h3>Volume Replacement:<\/h3>\n<ul>\n<li>In active bleeding, <strong>permissive hypotension<\/strong> is accepted. This should be kept to the minimum duration necessary. In most patients a <strong>SBP of ±60mmHg<\/strong> can be accepted. In the elderly or those with known or suspected stenotic coronary or aortic lesions, aim for a <strong>SBP of ±70mmHg<\/strong>. In patients with confirmed traumatic brain injury or spinal cord injury a risk-benefit decision should be made based on the severity of bleeding and likely degree of compromise to the cerebral/spinal cord perfusion pressure.<\/li>\n<li><strong>Maintain a ratio of PRBC:FFP:Platelets of 1:1:1<\/strong>. Blood packs come in the following format:<ul>\n<li><strong>Pack A:<\/strong> 6 PRBC (O negative/positive blood from local fridge) + 6 FFP<\/li>\n<li><strong>Pack B:<\/strong> 6 PRBC (from fridge as above) + 6 FFP + 2 Cryo + 1 Platelets (1 bag = 6 individual units)<\/li>\n<li><strong>Keep ahead of requirements:<\/strong> Blood bank will thaw 6 units FFP at a time as standard during a Code Red but will defrost 2 Pack B on request.<\/li>\n<\/ul>\n<\/li>\n<li>Resuscitate according to the <strong>lactate and base deficit<\/strong> which should improve linearly with bleeding control and volume restoration.<\/li>\n<li>Refer to Vascular Access CPG and RATS Handbook for Vascular access and Belmont procedures.<\/li>\n<\/ul>\n<aside class=\"callout\">\n<p>When haemostasis is achieved, the strategy should change to one of aggressive <strong>restoration of physiological normality including MAP ≥ 65mmHg.<\/strong><\/p>\n<\/aside>\n<h3>Coagulopathy &amp; Metabolic State:<\/h3>\n<ul>\n<li>Give blood products as above until haemostasis and adequate blood pressure. Aim to provide targeted coagulation therapy via <strong>ROTEM guidance.<\/strong><\/li>\n<li><strong>No crystalloids<\/strong> should be administered during the resuscitation phase.<\/li>\n<li>Code Red patients should receive <strong>2g of Tranexamic Acid<\/strong> prior to arrival in theatre or within the first 3 hours of injury. Further doses (1g) should be given if fibrinolysis is apparent on ROTEM or every whole-body transfusion (12 PRBC + 2x Pack B).<\/li>\n<li><strong>Hypocalcaemia<\/strong> results from chelation by citrate in the blood products and is common in all major resuscitations. Keep the <strong>ionised calcium &gt; 1.0<\/strong> with regular boluses of <strong>Calcium Chloride<\/strong> (<strong>5 - 10ml of 10% solution<\/strong>). Beware Calcium Gluconate: dosing requires 3x more than Calcium Chloride per unit volume.<\/li>\n<li>The pH should improve with resuscitation, but prolonged acidosis impairs myocardial function and promotes arrhythmias, vasodilation and coagulopathy. If <strong>pH &lt; 7<\/strong> consider <strong>1ml/kg of 8.4% sodium bicarbonate.<\/strong><\/li>\n<li>Vasoplegia should be treated with <strong>noradrenaline<\/strong>. This is in the context of indicators that haemorrhage is controlled and volume status is approaching normal, but blood pressure remains poor. Consider early echocardiography to evaluate quality of ventricular contractility and early ECMO consultation.<\/li>\n<\/ul>\n<h3>Potassium:<\/h3>\n<ul>\n<li>Big volumes of PRBCs and large burden of tissue injury or prolonged hypoxaemia will result in a significant burden of free potassium ions made worse by acidosis. Renal hypoperfusion may additionally prevent adequate clearance. The majority of patients that die on the operating table do so from uncontrolled hyperkalaemia. <strong>It cannot be overstated how important it is to anticipate and manage this as a complication.<\/strong><\/li>\n<li>Management strategy should include the following:<ul>\n<li><strong>10 ml 10% Calcium Chloride<\/strong> (omit if ionised Calcium &gt;1.3)<\/li>\n<li><strong>Insulin/Dextrose:<\/strong> 50u insulin in 50ml, 50% dextrose, infuse at 2 - 5ml/hour. Maximum infusion rate is 200ml/hour (will administer over 15 min).<\/li>\n<li>Effects of insulin will be prolonged post resuscitation therefore <strong>hypoglycaemia must be sought and treated aggressively<\/strong> for the first 24 – 48 hours.<\/li>\n<li><strong>Consider 1ml/kg 8.4% Sodium Bicarbonate<\/strong> (if K<sup>+<\/sup> &gt; 6)<\/li>\n<li><strong>Avoid initiating filtration in theatre: clearance is inadequate, logistic burden is high.<\/strong><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"code-red.s4\"><h2>Practical &amp; Non-Technical Considerations<\/h2>\n<h3>Arterial lines:<\/h3>\n<ul>\n<li>Should not delay other lifesaving therapies or procedures. May be deferred until sufficient team members are available and initial resuscitation priorities are met.<\/li>\n<li>Palpation of a carotid pulse, monitoring ETCO<sub>2<\/sub> or visualization of the heart through the open thorax are sufficient indicators of a beating heart and perfusing rhythm.<\/li>\n<li>Venous blood gas from the trauma line can be used to determine calcium, potassium, lactate and base deficit.<\/li>\n<\/ul>\n<h3>Temperature Management:<\/h3>\n<ul>\n<li>All efforts should be made to achieve patient <strong>core temperature &gt; 36.5<sup>O<\/sup>C.<\/strong><\/li>\n<li>Set the ambient <strong>theatre temperature to 25<sup>O<\/sup>C.<\/strong><\/li>\n<li>Keep the patient <strong>dry and covered<\/strong> as much as possible with a <strong>Bair Hugger<\/strong> and blankets.<\/li>\n<li>The patient should be on an <strong>Inditherm<\/strong> mattress.<\/li>\n<li>All fluids should go through a fluid warmer.<\/li>\n<\/ul>\n<h3>Role Allocations:<\/h3>\n<div class=\"tbl kv\"><table>\n<thead>\n<tr>\n<th>Role<\/th>\n<th>Responsibility<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Lead Anaesthetist (LA)<\/strong><\/td>\n<td>Team Leader, comms with surgical team<\/td>\n<\/tr>\n<tr>\n<td><strong>Procedural Anaesthetist (PL)<\/strong><\/td>\n<td>Lines &amp; procedures<\/td>\n<\/tr>\n<tr>\n<td><strong>ODP 1 (Procedures ODP)<\/strong><\/td>\n<td>Support to LA/procedural anaesthetists, ABGs &amp; ROTEMs<\/td>\n<\/tr>\n<tr>\n<td><strong>ODP 2 (Belmont ODP)<\/strong><\/td>\n<td>Check blood products, manage Belmont<\/td>\n<\/tr>\n<tr>\n<td><strong>HCA<\/strong><\/td>\n<td>Blood runner<\/td>\n<\/tr>\n<tr>\n<td><strong>Drugs Person<\/strong><\/td>\n<td>Draw and administer as per LA<\/td>\n<\/tr>\n<tr>\n<td><strong>Scribe<\/strong><\/td>\n<td>Collate details and events on chart, comms with blood bank<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><span class=\"anchor\" id=\"code-red.baste\"><\/span><\/p>\n<aside class=\"callout\">\n<p>Use the <strong>B.A.S.T.E<\/strong> communication tool with the surgeons to ensure shared mental model.<\/p>\n<p><strong>B<\/strong>lood products<br/><strong>A<\/strong>cid-base Status<br/><strong>S<\/strong>urgical Status<br/><strong>T<\/strong>emperature &amp; <strong>T<\/strong>ime<br/><strong>E<\/strong>lectrolytes<\/p>\n<\/aside>\n<h3>Post Operatively:<\/h3>\n<ul>\n<li>If acidosis and temperature control are challenging after surgery is complete, consider remaining in theatre for continued <strong>warming<\/strong> and <strong>resuscitation.<\/strong><\/li>\n<li>Maintain patient in theatre until blood gas, temperature and ongoing transfusion requirements are satisfactory for management on ACCU by a bedside nurse.<\/li>\n<li>Handover should be to <strong>ACCU Consultant<\/strong> with clear outline of prior events, progress of resuscitation and anticipated problems or ongoing requirements.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"code-red.s5\"><h2>Traumatic Cardiac Arrest / Peri-Arrest Algorithm<\/h2>\n<figure><button aria-label=\"Enlarge figure: Traumatic cardiac arrest / peri-arrest algorithm (European Resuscitation Council Guidelines 2021)\" class=\"zoom\" data-cap=\"Traumatic cardiac arrest / peri-arrest algorithm (European Resuscitation Council Guidelines 2021)\" data-src=\"fig/code-red-tca.jpg\" type=\"button\"><img alt=\"Traumatic cardiac arrest / peri-arrest algorithm (European Resuscitation Council Guidelines 2021)\" loading=\"lazy\" src=\"fig/code-red-tca.jpg\"/><\/button><figcaption>Traumatic cardiac arrest / peri-arrest algorithm (European Resuscitation Council Guidelines 2021)<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<ul>\n<li>Trauma Patient in Arrest/ Peri-Arrest → Non-traumatic arrest likely? <strong>YES<\/strong> → ALS<\/li>\n<li><strong>NO<\/strong> → START CPR. Address reversible causes simultaneously (Hypoxaemia, Hypovolaemia, Tension pneumothorax, Tamponade):<ol>\n<li>Control external catastrophic haemorrhage<\/li>\n<li>Secure airway and maximise oxygenation<\/li>\n<li>Bilateral chest decompression (thoracostomies)<\/li>\n<li>Relieve tamponade (penetrating chest injury)<\/li>\n<li>Proximal vascular control (REBOA/manual aortic compression)<\/li>\n<li>Pelvic splint<\/li>\n<li>Blood products / Massive Haemorrhage Protocol<\/li>\n<\/ol>\n<\/li>\n<li>Expertise? Equipment? Environment? Elapsed time since loss of vital signs &lt; 15 min? → Resuscitative Thoracotomy<\/li>\n<li><strong>ROSC YES<\/strong> → Pre-hospital: immediate transport to appropriate hospital. In-hospital: damage control surgery / resuscitation<\/li>\n<li><strong>ROSC NO<\/strong> → Consider termination of resuscitation<\/li>\n<\/ul><\/section>", "source": "Code Red CPG 2025.pdf"}, {"slug": "rotem-algorithm", "title": "Code Red ROTEM Algorithm", "group": "resus", "version": "Nov 2023", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Nov 2023", "related": [{"name": "Code Red CPG", "slug": "code-red"}], "sections": [{"id": "s1", "title": "Code Red Trauma"}, {"id": "s2", "title": "ROTEM Algorithm"}, {"id": "s3", "title": "Original chart"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rotem-algorithm.s1\"><h2>Code Red Trauma<\/h2>\n<div class=\"tbl kv\"><table>\n<thead>\n<tr>\n<th>Stage<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Code Red activation<\/strong><\/td>\n<td>• Pack A - 6x PRBC + 6x FFP<br/>• Ensure TxA 2g administered (bolus)<\/td>\n<\/tr>\n<tr>\n<td><strong>Ongoing bleeding<\/strong><\/td>\n<td>• Maintain TEMP&gt;35°C<br/>• Maintain ionised CALCIUM&gt;1mmol/l<\/td>\n<\/tr>\n<tr>\n<td><strong>DCS<\/strong><\/td>\n<td>• Move to Theatres or Interventional Radiology<br/>• Consider Cell Salvage<br/>• Continue empiric transfusion (PRBC:FFP in 1:1 Ratio)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rotem-algorithm.s2\"><h2>ROTEM Algorithm<\/h2>\n<div class=\"tbl kv\"><table>\n<thead>\n<tr>\n<th>Step<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1. Thrombin generation<\/strong><\/td>\n<td>If EXTEM CT&gt;80s<br/><strong>GIVE 4x UNITS FFP<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>2. Fibrinogen<\/strong><\/td>\n<td>If FIBTEM A5&lt;10mm<br/><strong>GIVE 2x POOLS CRYOPRECIPITATE<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>3. Platelets<\/strong><\/td>\n<td>If (EXTEM A5 – FIBTEM A5) = &lt;30mm<br/><strong>GIVE 1x POOL PLATELETS<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>4. Fibrinolysis<\/strong><\/td>\n<td>If EXTEM LI30&lt;85%<br/><strong>GIVE 1g TXA BOLUS<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"callout\">\n<p>ROTEM repeatable as soon as <strong>15min<\/strong> after blood products to assess treatment response and to further guide therapy<\/p>\n<\/aside>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"rotem-algorithm.s3\"><h2>Original chart<\/h2>\n<figure><button aria-label=\"Enlarge figure: Code Red Trauma and ROTEM Algorithm chart, Trauma Anaesthesia Group, Nov 2023\" class=\"zoom\" data-cap=\"Code Red Trauma and ROTEM Algorithm chart, Trauma Anaesthesia Group, Nov 2023\" data-src=\"fig/rotem-algorithm.jpg\" type=\"button\"><img alt=\"Code Red Trauma and ROTEM Algorithm chart, Trauma Anaesthesia Group, Nov 2023\" loading=\"lazy\" src=\"fig/rotem-algorithm.jpg\"/><\/button><figcaption>Code Red Trauma and ROTEM Algorithm chart, Trauma Anaesthesia Group, Nov 2023<span>Tap to enlarge<\/span><\/figcaption><\/figure><\/section>", "source": "ROTEM Algorithm 2023.pdf"}, {"slug": "code-black", "title": "Code Black", "group": "resus", "version": "2 (reviewed June 2025)", "effective": "1 July 2022", "review": "1 July 2028", "hidden": false, "aim": "To provide safe and effective care to all Code Black trauma patients.", "objectives": ["Describe a safe approach to anaesthesia in Code Black.", "Understand and apply the principles of ICP care.", "Describe and understand the principles of management of code black patients in ED and theatre environment."], "footer": "", "related": [{"name": "Emergency Department RSI CPG", "slug": "ed-rsi"}, {"name": "Elderly Trauma CPG", "slug": "elderly-trauma"}, {"name": "Neck Injury CPG", "slug": "neck-injury"}], "sections": [{"id": "s1", "title": "Anaesthetic Considerations"}, {"id": "s2", "title": "ICP Care"}, {"id": "s3", "title": "Assessment and Actions in ED"}, {"id": "s4", "title": "In theatre"}, {"id": "s5", "title": "Post operative considerations"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"code-black.s1\"><h2>Anaesthetic Considerations<\/h2>\n<p><strong>Code Black<\/strong> is declared pre- or in- hospital if:<\/p>\n<ul>\n<li>History of <strong>head trauma<\/strong><\/li>\n<li><strong>GCS ≤ 8<\/strong><\/li>\n<li>Signs of <strong>raised ICP<\/strong><ul>\n<li>Fixed and dilated pupil(s)<\/li>\n<li>Cushing’s Reflex: hypertension and bradycardia<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>2222 “Code Black trauma team to A&amp;E Resus”<\/h3>\n<aside class=\"callout\">\n<p>Attendance as for advanced trauma team plus:<\/p>\n<ul>\n<li><strong>Neurosurgery<\/strong><\/li>\n<li><strong>1220 Anaesthetist<\/strong><\/li>\n<\/ul>\n<\/aside>\n<ul>\n<li>If <strong>haemorrhagic shock<\/strong> and a transient or non-responder to volume replacement, then <strong>haemorrhage control must take priority.<\/strong><\/li>\n<li>In lesser cases, decide on which is the most urgent pathology.<\/li>\n<li><strong>Avoid concurrent Code Red and Code Black.<\/strong> Mortality in this group is devastating. TTL/Trauma Surgeon/Neurosurgeon/Anaesthetist MDT consultant discussion if unclear.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"code-black.s2\"><h2>ICP Care<\/h2>\n<ul>\n<li>Adequate sedation, analgesia and paralysis<\/li>\n<li>15-30<sup>O<\/sup> head up (tilt the whole bed/trolley if spine not cleared)<\/li>\n<li>Head to midline neutral position<\/li>\n<li>Tape ETT: avoid ties around the neck<\/li>\n<li>Remove cervical collar (use blocks/tape for intubated patients until c-spine cleared)<\/li>\n<\/ul>\n<h3>Targets<\/h3>\n<div class=\"tbl kv\"><table>\n<thead>\n<tr>\n<th>Target<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>MAP<\/strong><\/td>\n<td><strong>&gt; 90 mmHg<\/strong> (CPP &gt; 60 if ICP known)<br/>Insert an arterial line when able, but do not delay interventions<\/td>\n<\/tr>\n<tr>\n<td><strong>PaO<sub>2<\/sub><\/strong><\/td>\n<td><strong>&gt; 13 kPa<\/strong> (spO2 &gt;95%)<\/td>\n<\/tr>\n<tr>\n<td><strong>PaCO<sub>2<\/sub><\/strong><\/td>\n<td><strong>4.5-5 kPa<\/strong>, titrate to EtCO2<br/>Initially assume difference of 1kPa between EtCO2 &amp; PaCO2, confirm with blood gases<\/td>\n<\/tr>\n<tr>\n<td><strong>PEEP<\/strong><\/td>\n<td><strong>5 cmH<sub>2<\/sub>O<\/strong>, Vt: 4-8 ml/kg<\/td>\n<\/tr>\n<tr>\n<td><strong>Blood glucose<\/strong><\/td>\n<td><strong>6-10 mmol/L<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Temperature<\/strong><\/td>\n<td><strong>36.5-37.5°C<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Sodium<\/strong><\/td>\n<td><strong>135-155 mmol/L<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>If critical ICP<\/strong> (blown pupil or ICP &gt; 25 mmHg if measured)<ul>\n<li>1st line osmotherapy: Hypertonic saline (6 ml/kg 5% to a maximum of 350mls)<\/li>\n<li>2nd line: mannitol 2.5 ml/kg 20% or 5 ml/kg 10%<\/li>\n<li>Immediate neurosurgical review<\/li>\n<\/ul>\n<\/li>\n<li><strong>Treat seizures<\/strong>:<ul>\n<li>Levetiracetam (Keppra) 60 mg/kg up to 4500 mg max. To be administered in a 100 ml bag of 0.9% Saline over ~ 10 min.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"code-black.s3\"><h2>Assessment and Actions in ED<\/h2>\n<ul>\n<li>Full trauma primary survey and resuscitation<\/li>\n<li>Intubate (if not already intubated)<ul>\n<li>Usual drugs and doses: <strong>Fentanyl<\/strong> 1-3 mcg/kg, <strong>Ketamine<\/strong> 2 mg/kg, <strong>Rocuronium<\/strong> 1 mg/kg<\/li>\n<li>Continue sedation, analgesia and blood pressure support<\/li>\n<li>Maintain Manual In-Line Stabilisation if C-Spine not cleared<\/li>\n<\/ul>\n<\/li>\n<li>Initiate ICP care<\/li>\n<li>Blood gas and ROTEM<ul>\n<li>Do not delay for arterial line.<\/li>\n<li>Trauma induced coagulopathy is common.<\/li>\n<\/ul>\n<\/li>\n<li>Ensure 2 grams of <strong>Tranexamic Acid<\/strong> given if within 2 hours of injury<\/li>\n<li>CT pan-scan to identify all injuries:<ul>\n<li>Include: head, neck, chest, abdomen and pelvis.<\/li>\n<li>Neurosurgery/Radiologist may consider CT angio/venogram<\/li>\n<\/ul>\n<\/li>\n<li>Neurosurgery:<ul>\n<li>Immediate decision on theatre<\/li>\n<li>Clear C-Spine to assist ICP care<\/li>\n<\/ul>\n<\/li>\n<li>Radiology:<ul>\n<li>Primary survey initial CT report to identify other critical injury<\/li>\n<\/ul>\n<\/li>\n<li>Immediate transfer to theatre when plan confirmed<\/li>\n<li>Consider ordering Pack A for all Code Black cases<\/li>\n<\/ul>\n<h3>Anticoagulant &amp; Antiplatelet Drugs<\/h3>\n<ul>\n<li>Do not wait for lab results before reversing anticoagulation<\/li>\n<li><strong>Haematology SpR bleep 1155<\/strong> (in hours, via switch out-of-hours)<\/li>\n<li><strong>Haematology lab: ext 61049, 60342<\/strong> out of hours<\/li>\n<li>Follow trust guidelines for anticoagulant reversal (<strong>WeShare<\/strong> → search → ‘‘over-anticoagulation’’)<\/li>\n<li>If other coagulopathy (e.g. haemophilia, von Willebrands) discuss with haematology.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"code-black.s4\"><h2>In theatre<\/h2>\n<ul>\n<li>Continue ICP care<\/li>\n<li>Use <strong>Code Black<\/strong> timeout/ checklist<\/li>\n<li>Check:<ul>\n<li>ETT is secure<\/li>\n<li>Temperature probe<\/li>\n<li>Eyes are protected/padded/sealed<\/li>\n<li>Head up 15-30<sup>o<\/sup><\/li>\n<li>Urinary catheter<\/li>\n<li>Flowtrons +/- TED stockings<\/li>\n<li>Warming<\/li>\n<li>Pressure areas<\/li>\n<\/ul>\n<\/li>\n<li>Maintain anaesthesia: volatile or propofol, plus opioid.<ul>\n<li>Remifentanil (Ct &gt; 3ng/ml or ~ 0.1 mcg/kg/min infusion) or<\/li>\n<li>Fentanyl (e.g. 3 mcg/kg bolus then 4 mcg/kg/h infusion)<\/li>\n<\/ul>\n<\/li>\n<li><strong>Metaraminol<\/strong> or <strong>Noradrenaline<\/strong> to keep <strong>MAP &gt; 90 mmHg<\/strong><\/li>\n<li>Arterial line when able<\/li>\n<li>Large bore IV access<\/li>\n<li>Consider Belmont for all cases<\/li>\n<li>Antibiotics: Cefuroxime 1.5g IV unless allergy<\/li>\n<li><strong>1-2 litres blood loss is common<\/strong>. Beware escalating vasopressors and actively look for blood loss.<\/li>\n<li>ABG and ROTEM guided resuscitation<\/li>\n<li>Repeat TXA and antibiotics if blood loss &gt; 3 litres<\/li>\n<\/ul>\n<aside class=\"callout\">\n<p>If skull not open at <strong>30 min from knife-to-skin<\/strong>, discuss with surgeon.<\/p>\n<\/aside>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"code-black.s5\"><h2>Post operative considerations<\/h2>\n<ul>\n<li>Confirm full CT report – look for missed injuries.<\/li>\n<li>ACCU level 3 care:<ul>\n<li>Maintain sedation and analgesia<\/li>\n<\/ul>\n<\/li>\n<li>Change ETT if flexi/reinforced:<ul>\n<li>Use ACCU subglottic suction port tube if possible.<\/li>\n<\/ul>\n<\/li>\n<li>If time in theatre:<ul>\n<li>CVC (femoral or subclavian preferred, jugular acceptable).<\/li>\n<li>Naso- or oro-gastric <strong>feeding tube<\/strong> (from ACCU), <strong>beware base of skull fracture.<\/strong><\/li>\n<\/ul>\n<\/li>\n<\/ul><\/section>", "source": "Code Black CPG 2025.pdf"}, {"slug": "ed-rsi", "title": "Emergency Department RSI", "group": "airway", "version": "2 (reviewed June 2025)", "effective": "1 May 2021", "review": "1 July 2028", "hidden": false, "aim": "To ensure that all trauma patients requiring intubation in the emergency department (ED) receive a safe, standardised, and effective approach to their airway management.", "objectives": ["Describe the common indications for intubation in the emergency department.", "Standardise the drug regimen and philosophy of restoring physiology before airway intervention.", "Describe a practical, standardised approach to front-of-neck access in an emergency."], "footer": "", "related": [{"name": "Difficult Airway & OMFS Trauma CPG", "slug": "difficult-airway"}, {"name": "Neck Injury CPG", "slug": "neck-injury"}, {"name": "Code Red CPG", "slug": "code-red"}], "sections": [{"id": "s1", "title": "General Principles"}, {"id": "s2", "title": "Indications for ED RSI"}, {"id": "s3", "title": "Drugs"}, {"id": "s4", "title": "Airway Plan"}, {"id": "s5", "title": "Plan D – Front Of Neck Access (FONA)"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"ed-rsi.s1\"><h2>General Principles<\/h2>\n<ul>\n<li><strong>Assume a full stomach.<\/strong> All intubations should be an RSI. Cricoid pressure is not mandated and is at the discretion of the Anaesthetist.<\/li>\n<li><strong>Manual in-line immobilisation<\/strong> should be provided (after removal of cervical collar) where there are concerns for cervical spine injury. It may be appropriate to only apply this after induction of anaesthesia.<\/li>\n<li><strong>Assume hypovolaemia and unstable physiology.<\/strong> Appropriately resuscitate this physiology prior to induction of anaesthesia using vascular access, blood products and drug therapy as necessary. Appropriately titrate induction drugs and have vasopressors prepared.<\/li>\n<li><strong>Assume difficult intubation<\/strong> (positioning, airway soiling, anatomical disruption) and optimise all ergonomic elements to make first attempt the best attempt.<\/li>\n<li><strong>RSI may be conducted in the ED or in theatre<\/strong> (including for difficult airway). Decisions are based on the circumstances and urgency and are at the discretion of the Anaesthetist.<\/li>\n<li><strong>Checklists:<\/strong> TAG encourages the use of a checklist to ensure all equipment is present and all team members share the same mental model.<\/li>\n<\/ul>\n<figure><button aria-label=\"Enlarge figure: Intubation Checklist: critically ill adults – to be done with whole team present\" class=\"zoom\" data-cap=\"Intubation Checklist: critically ill adults – to be done with whole team present\" data-src=\"fig/rsi-checklist.jpg\" type=\"button\"><img alt=\"Intubation Checklist: critically ill adults – to be done with whole team present\" loading=\"lazy\" src=\"fig/rsi-checklist.jpg\"/><\/button><figcaption>Intubation Checklist: critically ill adults – to be done with whole team present<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"ed-rsi.s2\"><h2>Indications for ED RSI<\/h2>\n<ul>\n<li>Actual or impending airway compromise<\/li>\n<li>Ventilatory failure<\/li>\n<li>Unconsciousness/ moribund/ peri-arrest<\/li>\n<li>Agitated head injury or intoxication<\/li>\n<li>Humanitarian (e.g., high analgesia requirements, burns, etc)<\/li>\n<\/ul>\n<aside class=\"callout\">\n<p><strong>In these circumstances, once committed to advanced airway management, there is no option to abandon this. An airway must then be achieved.<\/strong><\/p>\n<\/aside>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"ed-rsi.s3\"><h2>Drugs<\/h2>\n<div class=\"tbl stack\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Awake<\/th>\n<th>Shocked &amp; Drowsy<\/th>\n<th>Unconscious or Peri-arrest<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td class=\"rowh\"><strong>Fentanyl<\/strong><\/td>\n<td data-label=\"Awake\">1-2 mcg/kg<\/td>\n<td data-label=\"Shocked &amp; Drowsy\">0 mcg/kg<\/td>\n<td data-label=\"Unconscious or Peri-arrest\">0<\/td>\n<\/tr>\n<tr>\n<td class=\"rowh\"><strong>Ketamine<\/strong><\/td>\n<td data-label=\"Awake\">2 mg/kg<\/td>\n<td data-label=\"Shocked &amp; Drowsy\">1 mg/kg<\/td>\n<td data-label=\"Unconscious or Peri-arrest\">0<\/td>\n<\/tr>\n<tr>\n<td class=\"rowh\"><strong>Rocuronium<\/strong><\/td>\n<td data-label=\"Awake\">100mg<\/td>\n<td data-label=\"Shocked &amp; Drowsy\">100mg<\/td>\n<td data-label=\"Unconscious or Peri-arrest\">100mg<\/td>\n<\/tr>\n<tr>\n<td class=\"rowh\"><strong>Propofol Maintenance<\/strong><\/td>\n<td data-label=\"Awake\">10–30 ml/hr<\/td>\n<td data-label=\"Shocked &amp; Drowsy\">0–15 ml/hr<\/td>\n<td data-label=\"Unconscious or Peri-arrest\">0<\/td>\n<\/tr>\n<tr>\n<td class=\"rowh\"><strong>Ongoing Fentanyl boluses<\/strong><\/td>\n<td data-label=\"Awake\">50-100mcg<\/td>\n<td data-label=\"Shocked &amp; Drowsy\">25–50mcg<\/td>\n<td data-label=\"Unconscious or Peri-arrest\">25–50 mcg<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Manage hypotension with balanced blood product transfusion<\/p>\n<p>Vasopressors acceptable to treat side effects of anaesthesia drugs or when fully volume resuscitated and patient exhibits vasoplegia<\/p>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"ed-rsi.s4\"><h2>Airway Plan<\/h2>\n<figure><button aria-label=\"Enlarge figure: Tracheal intubation of critically ill adults (DAS / ICS / FICM / RCoA flowchart)\" class=\"zoom\" data-cap=\"Tracheal intubation of critically ill adults (DAS / ICS / FICM / RCoA flowchart)\" data-src=\"fig/rsi-das.jpg\" type=\"button\"><img alt=\"Tracheal intubation of critically ill adults (DAS / ICS / FICM / RCoA flowchart)\" loading=\"lazy\" src=\"fig/rsi-das.jpg\"/><\/button><figcaption>Tracheal intubation of critically ill adults (DAS / ICS / FICM / RCoA flowchart)<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<details class=\"figtext\"><summary>Flowchart text<\/summary>\n<p><b>Pre-oxygenate and Checklist<\/b>: Position: head up if possible; Assess airway and identify cricothyroid membrane; Waveform capnograph; Pre-oxygenate: facemask / CPAP / NIV / nasal O<sub>2<\/sub>; Optimise cardiovascular system; Share plan for failure. Note the time.<\/p>\n<p><b>Plan A: Tracheal Intubation<\/b>. Laryngoscopy, maximum 3 attempts. Maintain oxygenation: continuous nasal oxygenation; facemask ventilation between attempts. Neuromuscular block. Video or direct laryngoscopy +/- bougie or stylet. External laryngeal manipulation. Remove cricoid. EXPERT: one extra attempt if appropriate. Succeed → confirm with capnography. First failure → Call HELP: video laryngoscopy; get Front Of Neck Airway (FONA) set. Fail → Declare \"failed intubation\".<\/p>\n<p><b>Plan B/C: Rescue Oxygenation<\/b>. 2nd generation supraglottic airway, or facemask (2 person, adjuncts). Maximum 3 attempts each. Change device / size / operator. Open Front Of Neck Airway set. Succeed → Stop, think, communicate. Options: wake patient if planned; wait for expert; intubate via supraglottic airway x1; Front Of Neck Airway. Fail → Declare \"can't intubate, can't oxygenate\".<\/p>\n<p><b>Plan D: Front Of Neck Airway: FONA<\/b>. Use FONA set. Scalpel cricothyroidotomy. Extend neck. Neuromuscular blockade. Continue rescue oxygenation. Trained expert only: other FONA techniques (non-scalpel cricothyroidotomy, percutaneous tracheostomy, surgical tracheostomy).<\/p>\n<\/details>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"ed-rsi.s5\"><h2>Plan D – Front Of Neck Access (FONA)<\/h2>\n<figure><button aria-label=\"Enlarge figure: Can't Intubate, Can't Oxygenate (CICO) in critically ill adults\" class=\"zoom\" data-cap=\"Can't Intubate, Can't Oxygenate (CICO) in critically ill adults\" data-src=\"fig/rsi-fona.jpg\" type=\"button\"><img alt=\"Can't Intubate, Can't Oxygenate (CICO) in critically ill adults\" loading=\"lazy\" src=\"fig/rsi-fona.jpg\"/><\/button><figcaption>Can't Intubate, Can't Oxygenate (CICO) in critically ill adults<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<p><strong>CALL FOR HELP<\/strong> – Declare \"Can't Intubate, Can't Oxygenate\"<\/p>\n<p><strong>Plan D: Front Of Neck Airway: FONA<\/strong><\/p>\n<ul>\n<li>Extend neck<\/li>\n<li>Ensure neuromuscular blockade<\/li>\n<li>Continue rescue oxygenation<\/li>\n<li>Exclude oxygen failure and blocked circuit<\/li>\n<\/ul>\n<h3>Scalpel cricothyroidotomy<\/h3>\n<p>Equipment: 1. Scalpel (wide blade e.g. number 10 or 20) 2. Bougie (≤ 14 French gauge) 3. Tube (cuffed 5.0-6.0mm ID)<\/p>\n<p>Laryngeal handshake to identify cricothyroid membrane<\/p>\n<p><strong>Palpable cricothyroid membrane<\/strong><\/p>\n<ul>\n<li>Transverse stab incision through cricothyroid membrane<\/li>\n<li>Turn blade through 90° (sharp edge towards the feet)<\/li>\n<li>Slide Coudé tip of bougie along blade into trachea<\/li>\n<li>Railroad lubricated cuffed tube into trachea<\/li>\n<li>Inflate cuff, ventilate and confirm position with capnography<\/li>\n<li>Secure tube<\/li>\n<\/ul>\n<p><strong>Impalpable cricothyroid membrane<\/strong><\/p>\n<ul>\n<li>Make a large midline vertical incision<\/li>\n<li>Blunt dissection with fingers to separate tissues<\/li>\n<li>Identify and stabilise the larynx<\/li>\n<li>Proceed with technique for palpable cricothyroid membrane as above<\/li>\n<\/ul>\n<p><strong>Trained expert only<\/strong> – Other FONA techniques: Non-scalpel cricothyroidotomy; Percutaneous tracheostomy; Surgical tracheostomy<\/p>\n<h3>Post-FONA care and follow up<\/h3>\n<ul>\n<li>Tracheal suction<\/li>\n<li>Recruitment manoeuvre (if haemodynamically stable)<\/li>\n<li>Chest X-ray<\/li>\n<li>Monitor for complications<\/li>\n<li>Surgical review of FONA site<\/li>\n<li>Agree airway plan with senior clinicians<\/li>\n<li>Document and complete airway alert<\/li>\n<\/ul><\/section>", "source": "Emergency Department RSI CPG 2025.pdf"}, {"slug": "difficult-airway", "title": "Difficult Airway and OMFS Trauma", "group": "airway", "version": "2 (reviewed July 2025)", "effective": "1 July 2022", "review": "1 July 2028", "hidden": false, "aim": "To ensure all trauma patients with facial injuries and potential difficult airway receive appropriate early assessment and management.", "objectives": ["To understand general principles of assessment and management of difficult airway in the trauma patient, including those with C-spine injury.", "To know the equipment available for management of these patients.", "To provide a safe and effective way of airway management in the trauma patient."], "footer": "", "related": [{"name": "Emergency Department RSI CPG", "slug": "ed-rsi"}, {"name": "Neck Injury CPG", "slug": "neck-injury"}, {"name": "Code Black CPG", "slug": "code-black"}], "sections": [{"id": "s1", "title": "Key Principles"}, {"id": "s2", "title": "Maintaining C-Spine Immobilisation"}, {"id": "s3", "title": "Pre-hospital placement of SGA by HEMS"}, {"id": "s4", "title": "Facial bleeding and airway soiling"}, {"id": "s5", "title": "MaxFax trauma airway considerations"}, {"id": "s6", "title": "Difficult airway equipment"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"difficult-airway.s1\"><h2>Key Principles<\/h2>\n<ul>\n<li>Assume difficult intubation (positioning, airway soiling, anatomical disruption).<\/li>\n<li>A cuffed tube in the trachea is the gold standard airway.<\/li>\n<li>An anticipated difficult airway is ideally managed in theatre.<\/li>\n<li>Reversal and wake up is rarely an option.<\/li>\n<li>It is unusual to perform awake fibreoptic intubation in acute trauma. Indications for intubation, patient acuity, and time often limit its use.<\/li>\n<li>Videolaryngoscopy (VL) is useful in documenting airway injury (e.g. laryngeal tears)<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"difficult-airway.s2\"><h2>Maintaining C-Spine Immobilisation<\/h2>\n<ul>\n<li>Assume all facial trauma patients have a C-spine injury and minimise movement<\/li>\n<li>Remove C-Spine collar prior to intubation<\/li>\n<li>Delegate and brief trauma team member to perform MILS<\/li>\n<li>If the patient is agitated, do not restrain the head to immobilise the neck<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"difficult-airway.s3\"><h2>Pre-hospital placement of SGA by HEMS<\/h2>\n<ul>\n<li>To be regarded as an anticipated difficult airway<\/li>\n<li>Jointly decide with the Resus team if definitive ETT required<\/li>\n<li>Plan to secure ETT in theatre whenever possible<\/li>\n<li>Check all the kit fits and slides easily – lignocaine spray will help this<\/li>\n<\/ul>\n<h3>KIT &amp; SIZES<\/h3>\n<ul>\n<li>An Aintree catheter will pass down an IGEL size 3<\/li>\n<li>Smallest ETT to pass over the Aintree is a 6.5 ETT (will require lubrication)<\/li>\n<li>Use a catheter mount with a bronchoscopy port to maintain oxygenation<\/li>\n<li>Our typical Ambu-scope (Ambu aScope 4 Broncho Regular 5.0/2.2) will pass down an Aintree<\/li>\n<li>Insert the Aintree in the correct orientation in order to assess the depth correctly<\/li>\n<\/ul>\n<h3>THINGS TO NOTE:<\/h3>\n<ul>\n<li>Use a laryngoscope to advance the ETT over the Aintree it is also an opportunity to visualise the larynx and identify foreign bodies and potential grade of intubation<\/li>\n<li>Discuss with ACCU and document an airway plan for this patient on CRS<\/li>\n<\/ul>\n<figure><button aria-label=\"Enlarge figure: Fibreoptic guided tracheal intubation through supraglottic airway device (SAD) using Aintree intubation catheter (Cook Medical; NHS Lanarkshire / NHS Tayside)\" class=\"zoom\" data-cap=\"Fibreoptic guided tracheal intubation through supraglottic airway device (SAD) using Aintree intubation catheter (Cook Medical; NHS Lanarkshire / NHS Tayside)\" data-src=\"fig/da-aintree.jpg\" type=\"button\"><img alt=\"Fibreoptic guided tracheal intubation through supraglottic airway device (SAD) using Aintree intubation catheter (Cook Medical; NHS Lanarkshire / NHS Tayside)\" loading=\"lazy\" src=\"fig/da-aintree.jpg\"/><\/button><figcaption>Fibreoptic guided tracheal intubation through supraglottic airway device (SAD) using Aintree intubation catheter (Cook Medical; NHS Lanarkshire / NHS Tayside)<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<details class=\"figtext\"><summary>Figure text<\/summary>\n<p><b>Fibreoptic guided tracheal intubation through supraglottic airway device (SAD) using Aintree intubation catheter.<\/b> Please ensure the SAD is in place; give 100% oxygen; confirm adequate sedation/anaesthesia, ventilation &amp; paralysis.<\/p>\n<p><b>Aintree catheter<\/b>: 56cm long hollow catheter; 6.5mm outer diameter; 4.7mm inner diameter; easily preloaded onto an appropriately sized intubating fibrescope (maximum insertion cord diameter - 4.2mm); flexible enough for loading over fibrescope; stiff enough to facilitate railroading of tracheal tube; comes with 2 rapifit adaptors (please refer to manufacturer’s guidelines); used for SAD assisted orotracheal fibreoptic intubation.<\/p>\n<ol>\n<li>Having prepared the fibrescope (FS) and camera system, lubricate the outer surfaces of both the Aintree Intubation Catheter (AIC) and FS. Preload AIC onto FS and secure with tape. Attach a 15mm bronchoscopic swivel connector (with port) to SAD and attach the anaesthetic circuit to the swivel connector. Confirm adequate anaesthesia, muscle relaxation and assisted ventilation.<\/li>\n<li>The SAD should be immobilised by an assistant. Introduce FS with loaded AIC through top port of swivel connector into the SAD lumen.<\/li>\n<li>Sequentially visualise SAD aperture bars (if present), glottis, tracheal rings and finally carina as the FS passes caudally. Never advance beyond carina.<\/li>\n<li>Note depth of AIC. With assistant immobilising SAD and the operator maintaining the position of AIC, the FS alone is withdrawn after removal of securing tape.<\/li>\n<li>Briefly disconnect SAD (along with swivel connector) from anaesthetic circuit, deflate cuff (if present) and start withdrawing SAD (along with swivel connector), applying counter pressure on AIC to prevent movement. Once the SAD cuff becomes visible, grasp AIC in the mouth and fully remove SAD with the swivel connector. The process should be done with care. Again note the depth of AIC at the lips, ensuring that it never exceeds 26cm.<\/li>\n<li>Using a laryngoscope, railroad the tracheal tube (ETT) over AIC ensuring a ‘tip anterior’ orientation. Use a conventional ETT - minimum size is 7.0 and pre cut to appropriate length.<\/li>\n<li>Reconnect circuit and re-establish anaesthesia and ventilation. Confirm end-tidal CO<sub>2<\/sub>. Consider FS confirmation of ETT position.<\/li>\n<\/ol>\n<ul><li>This is not an airway rescue technique<\/li><li>It should be performed in a controlled stepwise process<\/li><li>The process is designed to provide continued ventilation/oxygenation via the SAD and swivel connector until the SAD is removed and tracheal tube is railroaded in place<\/li><li>Oxygen can be delivered via the AIC in situations where railroading of tracheal tube is prolonged; assisting ventilation via this route is often suboptimal (narrow diameter/lack of cuff). Refer to manufacturer’s guidelines for methods of oxygen delivery.<\/li><\/ul>\n<p><b>Recommendations<\/b>: 1. Consider a second anaesthetist in addition to a trained assistant. 2. Use a camera system for fibrescope.<\/p>\n<p><b>Caution<\/b>: The aintree catheter is not recommended with the LMA Supreme.<\/p>\n<p>Permission for use granted by Cook Medical Incorporated, Bloomington, Indiana. Authors: Dr. Rajmohan Padmanabhan, Consultant Anaesthetist, NHS Lanarkshire; Dr. Barry McGuire, Consultant Anaesthetist, NHS Tayside. Illustrations produced by Andy Morris, Medical Illustration Department, NHS Lanarkshire. 26/01/2011. The AIC was invented in Liverpool, UK; Reference: Anaesthesia, 1996, volume 51, pages 1123-1126.<\/p>\n<\/details>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"difficult-airway.s4\"><h2>Facial bleeding and airway soiling<\/h2>\n<h3>Preparation<\/h3>\n<ul>\n<li>If the patient is awake allow them to position themselves (e.g. sitting up, leaning forward) prior to induction. Preoxygenate as much as possible.<\/li>\n<li>Manage the airway on a trolley which can be tipped head down if necessary<\/li>\n<li>Lateral positioning is likely to be difficult in a trauma patient<\/li>\n<li>Ensure you have 2 x working suctions prior to intubation<\/li>\n<\/ul>\n<h3>Airway Plan<\/h3>\n<ul>\n<li>RSI with cricoid, bougie and direct laryngoscopy should be plan A<\/li>\n<li>Blood and vomit can obscure the image from VL and fibreoptic scopes. Consider having a spare VL blade and/or something to clean the blade with.<\/li>\n<li>Supraglottic airways can be considered in the case of a failed intubation, but these should be a temporising measure and do not protect the airway<\/li>\n<li>Have a low threshold to move to front of neck access<\/li>\n<li>Extensive facial trauma makes the face and mandible more mobile. Disruption of the upper airway can be disorientating. However, the majority of facial trauma patients are straightforward to intubate<\/li>\n<\/ul>\n<h3>Aspiration Management<\/h3>\n<ul>\n<li>Record in the notes any obvious airway soiling or aspiration<\/li>\n<li>Liquid soiling can be managed by irrigation of the trachea with saline (5-10ml) and endo tracheal suction<\/li>\n<li>Aspiration of solids (e.g. teeth) need interventional bronchoscopy.<\/li>\n<\/ul>\n<figure><button aria-label=\"Enlarge figure: Tracheal intubation of critically ill adults (DAS / ICS / FICM / RCoA flowchart)\" class=\"zoom\" data-cap=\"Tracheal intubation of critically ill adults (DAS / ICS / FICM / RCoA flowchart)\" data-src=\"fig/da-das.jpg\" type=\"button\"><img alt=\"Tracheal intubation of critically ill adults (DAS / ICS / FICM / RCoA flowchart)\" loading=\"lazy\" src=\"fig/da-das.jpg\"/><\/button><figcaption>Tracheal intubation of critically ill adults (DAS / ICS / FICM / RCoA flowchart)<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<details class=\"figtext\"><summary>Flowchart text<\/summary>\n<p><b>Pre-oxygenate and Checklist<\/b>: Position: head up if possible; Assess airway and identify cricothyroid membrane; Waveform capnograph; Pre-oxygenate: facemask / CPAP / NIV / nasal O<sub>2<\/sub>; Optimise cardiovascular system; Share plan for failure. Note the time.<\/p>\n<p><b>Plan A: Tracheal Intubation<\/b>. Laryngoscopy, maximum 3 attempts. Maintain oxygenation: continuous nasal oxygenation; facemask ventilation between attempts. Neuromuscular block. Video or direct laryngoscopy +/- bougie or stylet. External laryngeal manipulation. Remove cricoid. EXPERT: one extra attempt if appropriate. Succeed → confirm with capnography. First failure → Call HELP: video laryngoscopy; get Front Of Neck Airway (FONA) set. Fail → Declare \"failed intubation\".<\/p>\n<p><b>Plan B/C: Rescue Oxygenation<\/b>. 2nd generation supraglottic airway, or facemask (2 person, adjuncts). Maximum 3 attempts each. Change device / size / operator. Open Front Of Neck Airway set. Succeed → Stop, think, communicate. Options: wake patient if planned; wait for expert; intubate via supraglottic airway x1; Front Of Neck Airway. Fail → Declare \"can't intubate, can't oxygenate\".<\/p>\n<p><b>Plan D: Front Of Neck Airway: FONA<\/b>. Use FONA set. Scalpel cricothyroidotomy. Extend neck. Neuromuscular blockade. Continue rescue oxygenation. Trained expert only: other FONA techniques (non-scalpel cricothyroidotomy, percutaneous tracheostomy, surgical tracheostomy).<\/p>\n<\/details>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"difficult-airway.s5\"><h2>MaxFax trauma airway considerations<\/h2>\n<h3>Packing of facial bleeding<\/h3>\n<ul>\n<li>Ongoing facial bleeding can be slowed by anatomical reduction of the facial fractures<\/li>\n<\/ul>\n<p>This will be led by the trauma team. It is important you know the procedure and assist when required. The order of steps is crucial in preventing further anatomical distortion<\/p>\n<ol>\n<li>Secure ETT as standard<\/li>\n<li>Insert bilateral epistats along the base of the nasal cavity. Do not inflate.<\/li>\n<li>Insert dental blocks either side of the ETT between the molars<\/li>\n<li>Secure the cervical collar to brace the mandible<\/li>\n<li>Inflate the small posterior balloon with 10ml Saline (inflate both simultaneously)<\/li>\n<li>Inflate the middle balloon with 20-30ml Saline (inflate both simultaneously)<\/li>\n<\/ol>\n<figure><button aria-label=\"Enlarge figure: Epistats, dental blocks and collar in place\" class=\"zoom\" data-cap=\"Epistats, dental blocks and collar in place\" data-src=\"fig/da-epistat.jpg\" type=\"button\"><img alt=\"Epistats, dental blocks and collar in place\" loading=\"lazy\" src=\"fig/da-epistat.jpg\"/><\/button><figcaption>Epistats, dental blocks and collar in place<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s6\" id=\"difficult-airway.s6\"><h2>Difficult airway equipment<\/h2>\n<div class=\"kit\">\n<div class=\"kit-item\"><img alt=\"C-Mac\" src=\"fig/da-cmac.jpg\"/><div><h4>C-Mac<\/h4><ul><li>Hyperangulated D blade useful for view of the glottis<\/li><li>Use with bougie/stylet as it can sometimes be difficult to pass the tube despite a good view<\/li><\/ul><\/div><\/div>\n<div class=\"kit-item\"><img alt=\"McGrath\" src=\"fig/da-mcgrath.jpg\"/><div><h4>McGrath<\/h4><ul><li>Suitable for direct and video laryngoscopy<\/li><\/ul><\/div><\/div>\n<div class=\"kit-item\"><img alt=\"Airtraq\" src=\"fig/da-airtraq.jpg\"/><div><h4>Airtraq<\/h4><ul><li>Good for minimising neck movement.<\/li><li>Video attachment available.<\/li><\/ul><\/div><\/div>\n<div class=\"kit-item\"><img alt=\"Ambu scope\" src=\"fig/da-ambu.jpg\"/><div><h4>Ambu scope<\/h4><ul><li>Can be used as a directional fibreoptic bougie when used with laryngoscopy<\/li><\/ul><\/div><\/div>\n<\/div><\/section>", "source": "Difficult Airway and OMFS Trauma CPG 2025.pdf"}, {"slug": "neck-injury",
