 of Code Black<\/li>\n<li>Standardised resuscitation of the Paediatric/ Pregnant/ Elderly Trauma patient<\/li>\n<li>Airway management of trauma patients including:<ul>\n<li>Emergency Department RSI &amp; Front-of-neck access<\/li>\n<li>Difficult Airway &amp; OMFS Trauma<\/li>\n<li>Penetrating neck injury<\/li>\n<li>Placement of double lumen tube &amp; one-lung ventilation<\/li>\n<\/ul>\n<\/li>\n<li>Advanced vascular access skills (including placement of subclavian trauma line)<\/li>\n<li>Interpretation and use of ROTEM and familiarity with emergency reversal of anticoagulation medications<\/li>\n<li>Standardised approach to analgesia for acute trauma pain management<\/li>\n<li>Standardised approach and ability to deliver the following regional anaesthesia:<ul>\n<li>Supra- or Infra-clavicular block<\/li>\n<li>Femoral &amp; fascia iliaca block<\/li>\n<li>Sciatic nerve block<\/li>\n<li>Epidural, paravertebral, serratus anterior, erector spinae blocks<\/li>\n<li>Placement of regional anaesthetic nerve catheters<\/li>\n<\/ul>\n<\/li>\n<li>Understanding of principles involved in resuscitation of Burns, Drowning &amp; Hypothermia, Spinal Cord Injury<\/li>\n<li>Understanding of principles involved in resuscitation involving Thoracotomy, REBOA, ECMO, Peri-mortem Caesarean Section<\/li>\n<li>Understanding of principles involved in Major Incident Management<\/li>\n<li>Familiarity with TAG Clinical Practice Guidelines and Resuscitation, Anaesthesia and Trauma Skills (RATS) Workbook<\/li>\n<li>High-stakes decision making and non-technical skills appropriate to leadership and followership<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"tag-skillset.s2\"><h2>Specialist Clinical Skills<\/h2>\n<p><em>(to exist within the group but not all individuals)<\/em><\/p>\n<ul>\n<li>Interpretation of eFAST Scan in Trauma and relevant Point-of-Care Ultrasound<\/li>\n<li>Conceptual understanding of ECMO/ eCPR and ability to support ECMO Team<\/li>\n<li>Conceptual understanding of REBOA and ability to support REBOA Team<\/li>\n<li>Interpretation of Trauma CT scan<\/li>\n<li>Placement of intercostal drains<\/li>\n<li>RATS Course Faculty<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"tag-skillset.s3\"><h2>Aspirational/ Future-intended Skills<\/h2>\n<ul>\n<li>Member of delivery team for ECMO/ eCPR<\/li>\n<li>Higher complexity Regional Anaesthesia<\/li>\n<li>Trauma Team Leader Course Faculty<\/li>\n<\/ul><\/section>", "source": "TAG Skills CPG 2025.pdf"}, {"slug": "rats-thoracotomy", "title": "Thoracotomy", "group": "resus", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Definition"}, {"id": "s2", "title": "Contraindications"}, {"id": "s3", "title": "Anaesthesia for thoracotomy"}, {"id": "s4", "title": "Techniques"}, {"id": "s5", "title": "Post-procedure care"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-thoracotomy.s1\"><h2>Definition<\/h2>\n<p>A thoracotomy is indicated for patients in extremis allows operator:<\/p>\n<ul>\n<li>To relieve cardiac tamponade (either confirmed with imaging or clinically suspected)<\/li>\n<li>To manage exsanguinating haemorrhage and where internal cardiac massage and clamping of the descending aorta is required<\/li>\n<\/ul>\n<p>Specifically, these patients are in imminent circulatory arrest from cardiac tamponade or exsanguination despite maximal volume filling or are already in circulatory arrest with external massage ongoing and &lt; 15 min since loss of vital signs. Outcomes are far better if performed before cardiac arrest occurs, regardless of location and if performed for cardiac tamponade.<\/p>\n<p>A thoracotomy can be performed by HEMS Doctors, Trauma Surgeons and some ED or TAG Consultants who have undergone defined training. Thoracotomy may occur in Resus (Bay 8) or preferentially Theatre.<\/p>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rats-thoracotomy.s2\"><h2>Contraindications<\/h2>\n<ul>\n<li>Prolonged down-time (&gt;15mins) +- CPR performed<\/li>\n<li>Multiple injuries inconsistent with survival<\/li>\n<li>Blunt trauma exsanguination<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"rats-thoracotomy.s3\"><h2>Anaesthesia for thoracotomy<\/h2>\n<ul>\n<li>Minimal / none if in cardiac arrest, minimal if severe shock.<\/li>\n<li>Titrate small amounts of an IV agent, eg Fentanyl / Ketamine, as needed and minimal MAC (if at all).<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"rats-thoracotomy.s4\"><h2>Techniques<\/h2>\n<ul>\n<li>Clamshell thoracotomy - allows access to the lungs, major vessels including the aorta, the mediastinum and the heart within the pericardial sac.<\/li>\n<li>Pericardiotomy - for direct management of penetrating cardiac injury and evacuation of pericardial clot.<\/li>\n<li>Aortic clamp - for management of exsanguinating sub-diaphragmatic injury and to optimise myocardial and cerebral perfusion (increased afterload).<\/li>\n<li>Anaesthetic - VCV, F<sub>i<\/sub>O<sub>2<\/sub> 1.0, minimum MAC, Ketamine / Fentanyl<\/li>\n<li>Aggressively re-warm.<\/li>\n<li>Beware loss of aortic occlusion during transfer from trolley to table.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"rats-thoracotomy.s5\"><h2>Post-procedure care<\/h2>\n<ul>\n<li>Transfer to theatre for further damage control surgery / resuscitation.<\/li>\n<li>Debrief with team.<\/li>\n<li>Clinical Governance procedures will follow.<\/li>\n<li>Analgesia - consider regional catheters sited by Surgeons for ‘well’ patients likely to be extubated within 24hrs, eg isolated tamponade with no cardiac arrest.<\/li>\n<li><strong>See <a href=\"#rats-ecmo\">ECMO and Trauma Shock Call<\/a><\/strong><\/li>\n<\/ul><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-ecmo", "title": "ECMO and Trauma Shock Call", "group": "resus", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Definition"}, {"id": "s2", "title": "Indications"}, {"id": "s3", "title": "Considerations"}, {"id": "s4", "title": "Trauma Shock Call"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-ecmo.s1\"><h2>Definition<\/h2>\n<p>Extra Corporeal Membrane Oxygenation (ECMO) consists of a large bore drainage cannula, a pump, a membrane oxygenator and a large bore return cannula. It can be set up for Veno-Venous (VV ECMO) support for severe respiratory failure or Veno-Arterial (VA ECMO) for cardiac and respiratory support.<\/p>\n<p>The ECMO circuit allows for easy administration of very large volumes of blood products as well as precise temperature control, warming and cooling.<\/p>\n<p>In trauma, VA ECMO has an evolving use for <strong>refractory cardiogenic shock.<\/strong><\/p>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-ecmo.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-ecmo.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rats-ecmo.s2\"><h2>Indications<\/h2>\n<ul>\n<li>Post ROSC for traumatic cardiac arrest.<\/li>\n<li>Early intra-operative cardiogenic shock not responding to normal resuscitation.<\/li>\n<li>Trauma Induced Secondary Cardiac Injury (TISCI) in the ICU phase of care: May be evidenced by pulmonary artery parameters.<\/li>\n<li>Following pneumonectomy for severe pulmonary trauma (high risk of acute right heart failure).<\/li>\n<li>Warming in profound hypothermia &amp; hypothermic cardiac arrest.<\/li>\n<li>Uncontrollable hyperkalaemia leading to cardiac instability.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"rats-ecmo.s3\"><h2>Considerations<\/h2>\n<ul>\n<li>Modern heparin-bonded circuits do not mandate systemic anticoagulation.<\/li>\n<li>VV ECMO for respiratory failure is a nationally commissioned service, for RLH - this is provided by Papworth Hospital and has a <strong>separate referral pathway<\/strong> to the Bart’s Trauma Shock Call.<\/li>\n<li>Time to initiation: Shock Call and ECMO team mobilisation will <strong>take at least 1 hour<\/strong>.<\/li>\n<li>Cannulation: Usually via femoral vein and contralateral femoral artery, though it can be done by other central routes or into central vessels when the patient has an open chest.<\/li>\n<li>Patient location: ECMO patients will usually be transferred to Bart’s Hospital for ongoing care<\/li>\n<\/ul>\n<p><span class=\"anchor\" id=\"rats-ecmo.shock-call\"><\/span><\/p>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"rats-ecmo.s4\"><h2>Trauma Shock Call<\/h2>\n<figure><button aria-label=\"Enlarge figure: Trauma Shock Call\" class=\"zoom\" data-cap=\"Trauma Shock Call\" data-src=\"fig/rats-shock-call.jpg\" type=\"button\"><img alt=\"Trauma Shock Call\" loading=\"lazy\" src=\"fig/rats-shock-call.jpg\"/><\/button><figcaption>Trauma Shock Call<span>Tap to enlarge<\/span><\/figcaption><\/figure><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-paediatric", "title": "Paediatric Trauma", "group": "populations", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Paediatric CODE RED"}, {"id": "s2", "title": "Key Formulae"}, {"id": "s3", "title": "Key Drug Dosages"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-paediatric.s1\"><h2>Paediatric CODE RED<\/h2>\n<p>The principles are broadly similar to an adult CODE RED.<\/p>\n<p>There are weight-based guidelines for blood products and suggested maximum volumes (available on Box app).<\/p>\n<div class=\"tbl stack\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>RBCs<\/th>\n<th>FFP / Octaplas<\/th>\n<th>Platelets<\/th>\n<th>Cryo<\/th>\n<th>TXA<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td class=\"rowh\"><strong>&lt; 30kg<\/strong><\/td>\n<td data-label=\"RBCs\">10 - 20 mL/kg<\/td>\n<td data-label=\"FFP / Octaplas\">15mL/kg<\/td>\n<td data-label=\"Platelets\">15mL/kg<\/td>\n<td data-label=\"Cryo\">10mL/kg<\/td>\n<td data-label=\"TXA\">15mg/kg (max 1gram)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>ROTEM can be used for Paediatric patients however, the algorithm differs slightly.<\/p>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-paeds-rotem.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-paeds-rotem.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<p><span class=\"anchor\" id=\"rats-paediatric.formulae\"><\/span><\/p>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rats-paediatric.s2\"><h2>Key Formulae<\/h2>\n<p><strong>Weight<\/strong><\/p>\n<ul>\n<li>Age 1 - 5yo = (Age x 2) + 8<\/li>\n<li>Age 6 - 12yo = (Age x 3) + 7<\/li>\n<\/ul>\n<p><strong>ETT size and length<\/strong><\/p>\n<ul>\n<li>Uncuffed ETT = (Age / 4) + 4.5<\/li>\n<li>Cuffed ETT ID = (Age / 4) + 4<\/li>\n<li>ETT Length = (Age / 2) + 12<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"rats-paediatric.s3\"><h2>Key Drug Dosages<\/h2>\n<ul>\n<li>Suxamethonium = 1 - 2mg/kg<\/li>\n<li>Rocuronium (RSI) = 1mg/kg<\/li>\n<li>Propofol = 1 - 2mg/kg<\/li>\n<li>Ketamine = 1 - 2mg/kg<\/li>\n<li>Fentanyl = 1mcg/kg<\/li>\n<li>Atropine = 20mcg/kg (minimum 100mcg)<\/li>\n<li>Adrenaline = 0.1mL/kg of 1:10,000<\/li>\n<\/ul>\n<p>The CATS website is a valuable source of information for paediatric drug dosages including the infusions of vasopressors and maintenance of anaesthesia (<a href=\"https://cats.nhs.uk/\" target=\"_blank\" rel=\"noopener\">www.cats.nhs.uk<\/a>).<\/p><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-afoi", "title": "Awake Fibreoptic Intubation", "group": "airway", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Definition"}, {"id": "s2", "title": "Procedure"}, {"id": "s3", "title": "Topical agents"}, {"id": "s4", "title": "Tips and tricks"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-afoi.s1\"><h2>Definition<\/h2>\n<p>In a planned setting, awake tracheal intubation has a high success rate and low-risk profile in the management of predicted difficult airways. This is due to the maintenance of spontaneous ventilation, airway tone and patient cooperation. Trauma patients may have difficult airways including difficult facemask ventilation due to C-spine immobilisation precautions, being un-fasted, airway disruption, disrupted physiology and the urgency involved. AFOI is infrequently used but is a valuable skillset to maintain.<\/p>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rats-afoi.s2\"><h2>Procedure<\/h2>\n<ul>\n<li><strong>Oxygenate<\/strong> - use HFNO unless contraindicated.<\/li>\n<li><strong>Topicalise<\/strong> - Lidocaine 4% to oropharynx, tonsillar pillars, base of tongue, hypopharynx. If nasal intubation planned use co-phenylcaine as a vasoconstrictor.<\/li>\n<li><strong>Consider Sedation<\/strong> - Usually Remifentanil.<\/li>\n<li><strong>Perform<\/strong> - Confirm tube position (visual + EtCO<sub>2<\/sub>) before induction.<\/li>\n<\/ul>\n<figure><button aria-label=\"Enlarge figure: Ergonomics for ATI\" class=\"zoom\" data-cap=\"Ergonomics for ATI\" data-src=\"fig/rats-afoi-1.jpg\" type=\"button\"><img alt=\"Ergonomics for ATI\" loading=\"lazy\" src=\"fig/rats-afoi-1.jpg\"/><\/button><figcaption>Ergonomics for ATI<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: DAS ATI technique\" class=\"zoom\" data-cap=\"DAS ATI technique\" data-src=\"fig/rats-afoi-2.jpg\" type=\"button\"><img alt=\"DAS ATI technique\" loading=\"lazy\" src=\"fig/rats-afoi-2.jpg\"/><\/button><figcaption>DAS ATI technique<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"rats-afoi.s3\"><h2>Topical agents<\/h2>\n<ul>\n<li>Varied practice, at the discretion of the Anaesthetist, options available:<\/li>\n<li>Xylocaine (Lignocaine spray)<\/li>\n<li>4% Lignocaine (drawn up into a syringe and administered via a Mucosal Atomization Device (MAD))<\/li>\n<li>Otrivine (Xylometazoline ) (Vasoconstrictor)<\/li>\n<li>Lidocaine 5% / Phenylephrine 0.5%<\/li>\n<li>Instillagel<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"rats-afoi.s4\"><h2>Tips and tricks<\/h2>\n<ul>\n<li>Maximum dose of lidocaine is 9mg.kg<sup>-1<\/sup> for topicalisation<\/li>\n<li>Anaesthesia should only be induced once two point check confirmed (visual confirmation of tube through cords + EtCO<sub>2<\/sub>)<\/li>\n<li>Sedation is not a substitute for proper topicalisation<\/li>\n<li>Supplemental oxygen should always be administered<\/li>\n<li>Logistics are complex for AFOI - strongly consider moving to Theatre<\/li>\n<\/ul><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-optiflow", "title": "Optiflow", "group": "kit", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Definition"}, {"id": "s2", "title": "Indications"}, {"id": "s3", "title": "Tips and tricks"}, {"id": "s4", "title": "Contraindications"}, {"id": "s5", "title": "Complications"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-optiflow.s1\"><h2>Definition<\/h2>\n<p>Optiflow / high flow oxygenation therapy (HFOT) / high flow nasal oxygenation (HFNO) allows the administration of high F<sub>i<\/sub>O<sub>2<\/sub> (up to 1.0), high flow, humidified, heated oxygen therapy to a patient via wide bore nasal cannulae. The high flow (70L/min<sup>-1<\/sup>) administered aims to match the high peak inspiratory flow rates of the patient in respiratory failure to maximise F<sub>i<\/sub>O<sub>2<\/sub>. It may also deliver a variable amount of PEEP.<\/p>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-optiflow-1.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-optiflow-1.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-optiflow-2.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-optiflow-2.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rats-optiflow.s2\"><h2>Indications<\/h2>\n<ul>\n<li>Hypoxic respiratory failure (CAP, asthma, PE, etc)<\/li>\n<li>Pre-oxygenation prior to intubation<\/li>\n<li>Apnoeic oxygenation<\/li>\n<li>Post-extubation hypoxia<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"rats-optiflow.s3\"><h2>Tips and tricks<\/h2>\n<ul>\n<li>Theatre Optiflow will deliver a fixed F<sub>i<\/sub>O<sub>2<\/sub> 1.0 with a titratable flow<\/li>\n<li>Consider intubation in theatre if anticipated difficult airway<\/li>\n<li>Filled with sterile water, <strong>not<\/strong> 0.9% NaCl<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"rats-optiflow.s4\"><h2>Contraindications<\/h2>\n<ul>\n<li>Epistaxis<\/li>\n<li>Base of skull fracture<\/li>\n<li>Recent nasal or upper aero-digestive tract surgery<\/li>\n<li>Nasal obstruction<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"rats-optiflow.s5\"><h2>Complications<\/h2>\n<ul>\n<li>Local trauma / discomfort / pressure areas<\/li>\n<li>Epistaxis<\/li>\n<li>Gastric distension<\/li>\n<\/ul><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-cmac", "title": "C-Mac Videolaryngoscope", "group": "kit", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Definition"}, {"id": "s2", "title": "C-Mac"}, {"id": "s3", "title": "Tips and tricks"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-cmac.s1\"><h2>Definition<\/h2>\n<p>Videolaryngoscopy is an easily available tool for management of the anticipated difficult airway. The most commonly used system at RLH is the C-Mac, although the Airtraq system is also available.<\/p>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rats-cmac.s2\"><h2>C-Mac<\/h2>\n<p>The C-Mac system uses a disposable, single-use plastic blade over a fiberoptic endoscope. Blades available include the Macintosh 3, 4 and ‘D Blade’ which is a hyperangulated blade. These systems are available throughout ED, Theatres and ITU.<\/p>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-cmac-2.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-cmac-2.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"rats-cmac.s3\"><h2>Tips and tricks<\/h2>\n<ul>\n<li>A standard Macintosh 4 blade has the benefits of a familiar laryngoscopy technique and a direct view if blood / debris covers the camera.<\/li>\n<li>If struggling to get tube off stylet, withdraw the blade to a ‘less optimal' view which improves the angle of tube delivery.<\/li>\n<li>If using a D Blade, use a pre-formed stylet / Frova bougie to match curve of blade - see picture below.<\/li>\n<li>Battery life is approximately 3.5hours - if it has been appropriately stored and charged, it doesn’t need to be plugged in once in theatre - this can just add to the tangle of wires!<\/li>\n<li>If the light source is not sufficiently inserted and correctly seated into the plastic blade, significant glare can occur obscuring the view - this is particularly problematic when using the ‘D’ blade.<\/li>\n<\/ul>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-cmac-1.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-cmac-1.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-cmac-3.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-cmac-3.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-ambuscope", "title": "Ambuscope", "group": "kit", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Definition"}, {"id": "s2", "title": "Uses in Trauma"}, {"id": "s3", "title": "Size"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-ambuscope.s1\"><h2>Definition<\/h2>\n<p>The ambuscope is a single-use, disposable fiberoptic bronchoscope available in 3 sizes - ‘slim’, ‘regular’ and ‘large’. It can be used to guide the insertion of an ETT and perform bronchoalveolar lavage. The larger sizes (Regular [Green] and Large [Orange]) provide the strongest suction.<\/p>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-ambuscope-2.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-ambuscope-2.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rats-ambuscope.s2\"><h2>Uses in Trauma<\/h2>\n<ul>\n<li>“Double setup” for neck injuries with suspicion of airway injury (combined with RSI and videolaryngoscopy)<\/li>\n<li>Double lumen tube confirmation and monitoring<\/li>\n<li>iGel airway exchange<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"rats-ambuscope.s3\"><h2>Size<\/h2>\n<div class=\"tbl stack\"><table>\n<thead>\n<tr>\n<th>Size<\/th>\n<th>Slim<\/th>\n<th>Regular<\/th>\n<th>Large<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Size\"><strong>Colour<\/strong><\/td>\n<td data-label=\"Slim\">Grey<\/td>\n<td data-label=\"Regular\">Green<\/td>\n<td data-label=\"Large\">Orange<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Size\"><strong>Suction Channel (mm)<\/strong><\/td>\n<td data-label=\"Slim\">1.2<\/td>\n<td data-label=\"Regular\">2.2<\/td>\n<td data-label=\"Large\">2.8<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Size\"><strong>Minimum diameter ETT (ID)<\/strong><\/td>\n<td data-label=\"Slim\">5<\/td>\n<td data-label=\"Regular\">6<\/td>\n<td data-label=\"Large\">7<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Size\"><strong>Suggested ETT (ID)<\/strong><\/td>\n<td data-label=\"Slim\">6<\/td>\n<td data-label=\"Regular\">7<\/td>\n<td data-label=\"Large\">8<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-ambuscope-1.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-ambuscope-1.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-transport-ventilators", "title": "Transport Ventilators", "group": "kit", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Transport Ventilators"}, {"id": "s2", "title": "Tips and tricks"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-transport-ventilators.s1\"><h2>Transport Ventilators<\/h2>\n<p>Within Resus, ACCU and Theatres the most common transport ventilator used is the Oxylog 3000+. It is able to provide both volume and pressure controlled mandatory modes of ventilation as well as modes for spontaneously breathing patients (CPAP and SIMV / PC-BiPAP). In the Trauma Bay of Resus (Bay 8) the paraPAC is the ventilator used.<\/p>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-vent-1.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-vent-1.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-vent-2.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-vent-2.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-vent-3.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-vent-3.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rats-transport-ventilators.s2\"><h2>Tips and tricks<\/h2>\n<ul>\n<li>Ventilation can have significant impact on haemodynamics - consider this carefully at initial setup<\/li>\n<li>Low PEEP + low tidal volume with permissive hypercapnia may reduce impact on cardiovascular stability<\/li>\n<li>Balancing neuroprotective ventilation with the haemodynamics of a shocked patient is challenging - this is a senior-led discussion<\/li>\n<li>The Oxylog 3000+ has a tidal volume (Vt) range of 50 - 2000mL, paediatric circuits should be used for Vt &lt; 250mL<\/li>\n<\/ul><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-belmont", "title": "Belmont Rapid Infusion Device", "group": "kit", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Definition"}, {"id": "s2", "title": "Clinical use"}, {"id": "s3", "title": "Tips and tricks"}, {"id": "s4", "title": "Belmont bucket"}, {"id": "s5", "title": "Belmont Rapid infusion Bucket Setup"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-belmont.s1\"><h2>Definition<\/h2>\n<p>The Belmont infusion device is able to infuse a maximum of 750mL/min of fluid or blood products whilst protecting against air embolus, warming the fluid to 37.5°C and managing line pressure to prevent vessel trauma.<\/p>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-belmont-1.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-belmont-1.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-belmont-2.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-belmont-2.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rats-belmont.s2\"><h2>Clinical use<\/h2>\n<p>The Belmont is set up in ED for CODE RED. This will accompany the patient to theatre and continue to be used. Another unit is sent back to Resus with the ED monitor when the patient is handed over in theatre.<\/p>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"rats-belmont.s3\"><h2>Tips and tricks<\/h2>\n<ul>\n<li>Manufacturer advises all blood products can be given <strong>except<\/strong> Platelets and all fluids except those containing calcium.<\/li>\n<li>When unplugged it reverts to battery mode which has a maximum infusion rate of 50ml/min with no heating function. Bear this in mind when in transit.<\/li>\n<li>The machine will generally prompt you how to correct errors - first step is to look at what the screen is telling you to do.<\/li>\n<li>Prime with 0.9% NaCl only.<\/li>\n<li>There is no heating function at flow rate &lt;5mL/min.<\/li>\n<li>Bolus functions allows delivery of 500mL aliquots, a useful function, and volumes can be altered if required.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"rats-belmont.s4\"><h2>Belmont bucket<\/h2>\n<ul>\n<li>3L capacity and blood products can be emptied directly into bucket.<\/li>\n<li>Not usually setup in ED, consider adding to Belmont in theatre.<\/li>\n<li>Most useful if anticipating sudden or torrential blood loss.<\/li>\n<li>Cell salvage can be plugged directly into the top of the bucket.<\/li>\n<li>Beware kinking of tubing below bucket.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"rats-belmont.s5\"><h2>Belmont Rapid infusion Bucket Setup<\/h2>\n<figure><button aria-label=\"Enlarge figure: 1. Belmont setup includes a small chamber by default\" class=\"zoom\" data-cap=\"1. Belmont setup includes a small chamber by default\" data-src=\"fig/rats-bucket-1.jpg\" type=\"button\"><img alt=\"1. Belmont setup includes a small chamber by default\" loading=\"lazy\" src=\"fig/rats-bucket-1.jpg\"/><\/button><figcaption>1. Belmont setup includes a small chamber by default<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 2. Ensure blue clamp is closed\" class=\"zoom\" data-cap=\"2. Ensure blue clamp is closed\" data-src=\"fig/rats-bucket-2.jpg\" type=\"button\"><img alt=\"2. Ensure blue clamp is closed\" loading=\"lazy\" src=\"fig/rats-bucket-2.jpg\"/><\/button><figcaption>2. Ensure blue clamp is closed<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 3. Disconnect connections to infuser\" class=\"zoom\" data-cap=\"3. Disconnect connections to infuser\" data-src=\"fig/rats-bucket-3.jpg\" type=\"button\"><img alt=\"3. Disconnect connections to infuser\" loading=\"lazy\" src=\"fig/rats-bucket-3.jpg\"/><\/button><figcaption>3. Disconnect connections to infuser<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 4. Slide clamp down but do not remove\" class=\"zoom\" data-cap=\"4. Slide clamp down but do not remove\" data-src=\"fig/rats-bucket-4.jpg\" type=\"button\"><img alt=\"4. Slide clamp down but do not remove\" loading=\"lazy\" src=\"fig/rats-bucket-4.jpg\"/><\/button><figcaption>4. Slide clamp down but do not remove<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 5. Attach C clamp between yellow lines on stand\" class=\"zoom\" data-cap=\"5. Attach C clamp between yellow lines on stand\" data-src=\"fig/rats-bucket-5.jpg\" type=\"button\"><img alt=\"5. Attach C clamp between yellow lines on stand\" loading=\"lazy\" src=\"fig/rats-bucket-5.jpg\"/><\/button><figcaption>5. Attach C clamp between yellow lines on stand<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 6. Connect bucket to Belmont lines\" class=\"zoom\" data-cap=\"6. Connect bucket to Belmont lines\" data-src=\"fig/rats-bucket-6.jpg\" type=\"button\"><img alt=\"6. Connect bucket to Belmont lines\" loading=\"lazy\" src=\"fig/rats-bucket-6.jpg\"/><\/button><figcaption>6. Connect bucket to Belmont lines<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 7. Ensure lines are not kinked and that blue clamp is open\" class=\"zoom\" data-cap=\"7. Ensure lines are not kinked and that blue clamp is open\" data-src=\"fig/rats-bucket-7.jpg\" type=\"button\"><img alt=\"7. Ensure lines are not kinked and that blue clamp is open\" loading=\"lazy\" src=\"fig/rats-bucket-7.jpg\"/><\/button><figcaption>7. Ensure lines are not kinked and that blue clamp is open<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 8. Prime system with blood products - not crystalloids\" class=\"zoom\" data-cap=\"8. Prime system with blood products - not crystalloids\" data-src=\"fig/rats-bucket-8.jpg\" type=\"button\"><img alt=\"8. Prime system with blood products - not crystalloids\" loading=\"lazy\" src=\"fig/rats-bucket-8.jpg\"/><\/button><figcaption>8. Prime system with blood products - not crystalloids<span>Tap to enlarge<\/span><\/figcaption><\/figure><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-reboa", "title": "REBOA and Monitor Setup", "group": "kit", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Definition"}, {"id": "s2", "title": "Clinical use"}, {"id": "s3", "title": "REBOA variations"}, {"id": "s4", "title": "Tips and tricks"}, {"id": "s5", "title": "Potential issues following balloon deflation"}, {"id": "s6", "title": "REBOA Monitor Setup"}], "html": "<aside class=\"callout\">\n<p><strong>AN INFLATED REBOA BALLOON IS A TIME CRITICAL, LIFE THREATENING EMERGENCY - EVEN ONCE HAEMORRHAGE CONTROLLED. AIM TOTAL BALLOON TIME &lt; 30min.<\/strong><\/p>\n<\/aside>\n<section class=\"sec\" data-sid=\"s1\" id=\"rats-reboa.s1\"><h2>Definition<\/h2>\n<p>Non-compressible torso haemorrhage is the leading cause of preventable trauma deaths. Pelvic fractures and torso vascular injuries are two important sources of this bleeding and contribute to one third of all trauma deaths at the Royal London Hospital. Resuscitative Endovascular Balloon Occlusion of the Aorta (REBOA) involves placement of an endovascular balloon in the proximal or distal aorta and is used to control catastrophic haemorrhage and improve afterload in traumatic cardiac arrest and haemorrhagic shock states to facilitate transfer of a patient to place of definitive control, ie theatre or interventional radiology. A specific ‘CODE RED REBOA’ trauma call may be put out, however, any CODE RED may be upgraded upon arrival of the patient to Resus.<\/p>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rats-reboa.s2\"><h2>Clinical use<\/h2>\n<p>A REBOA sheath +/- catheter can be inserted pre-hospital or in ED Resus, dictated by senior decision makers present (Trauma Team Leader, TAG, Consultant, Trauma Surgeon). It provides temporary control and balloon time should be minimised. Patients will often be moved straight to theatre on HEMS monitoring.<\/p>\n<p>Inflation time is a <strong>crucial<\/strong> detail. REBOA is associated with numerous risks and complications including vascular, renal, splanchnic and spinal cord ischaemia - the risk increases exponentially with balloon inflation time.<\/p>\n<p>The REBOA trolley is located in Bay 8 of Resus - it contains transducer equipment including the ‘splitter cable’ to allow 2 waveforms to be transduced (REBOA sheath and catheter).<\/p>\n<p>Default setup is double transducer - <strong>R<\/strong>ed is to the <strong>R<\/strong>EBOA tip and is the upper of the two traces (scale 0-300mmHg), <strong>B<\/strong>lue <strong>B<\/strong>elow this and represents aortic pressure distal to the balloon (scale 0-100mmHg).<\/p>\n<p>Zone 1 REBOA – primarily for abdominal injuries and cardiac arrest, occlusion above the coeliac trunk and below the left subclavian artery. Expect the physiological changes to be profound.<\/p>\n<p>Zone 3 REBOA – primarily for pelvic injuries, occlusion above the bifurcation of the iliacs and below the renal arteries.<\/p>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-reboa-zones.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-reboa-zones.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"rats-reboa.s3\"><h2>REBOA variations<\/h2>\n<ol>\n<li>The Common Femoral Artery (CFA) has been cannulated with a 4Fr arterial line. This can be used for Invasive Blood Pressure (IBP) and if needed exchanged for a size 8Fr arterial sheath through which REBOA can be placed.<\/li>\n<li>The CFA has been cannulated with a size 8Fr arterial sheath. Again, this can be used for IBP monitoring.<\/li>\n<li>The REBOA catheter has been inserted through the 8Fr sheath. This means there will be two lumens to transduce. The side port on the 8Fr arterial sheath and the arterial line lumen on the REBOA catheter.<\/li>\n<li>Partial REBOA (P-REBOA) - the REBOA balloon has been partially deflated to reduce distal ischaemia and reperfusion injury. Arterial pressure from the side arm of the sheath (downstream of the balloon) will not usually read zero, but a relatively low number this is known as a ‘baseline’ occlusion pressure. The aim is to deflate the REBOA balloon to allow enough flow through to raise this ‘baseline’ mean by 5-10mmHg or the return of a small pulsatile wave form, whichever comes first.<\/li>\n<li>Complete REBOA (C-REBOA) the REBOA balloon is inflated to occlude the aorta. This is balanced against the risk of sustained complete aortic occlusion, primarily distal ischaemia and associated reperfusion injury. <strong>The period of C-REBOA should be less than 20minutes.<\/strong><\/li>\n<\/ol>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"rats-reboa.s4\"><h2>Tips and tricks<\/h2>\n<ul>\n<li>Remember ‘hard to transduce’ when zeroing - the ‘stiff tube’ of the transducer connects to the patient and the ‘soft tube’ side of the transducer goes to the fluid bag. If you turn the tap to face the hard side (‘hard to transduce’) then you are open to air and able to zero the transducer.<\/li>\n<li>HEMS will attach transducers to the patients leg - be aware the cables will be stretched between monitor and patient<\/li>\n<li>Both traces / waveforms are arterial. However, for clarity the ‘CVP’ wave colour is used for the 4Fr arterial line / 8Fr sheath (<strong>B<\/strong>lue <strong>B<\/strong>elow).<\/li>\n<li>The lower trace scale is set to 100mmHg rather than the ‘normal’ scale of 0-30mmHg because if the pressure is greater than 30mmHg you will not see the trace on the monitor<\/li>\n<li><strong>Do NOT confuse the arterial line lumen and the balloon lumen on the REBOA catheter<\/strong> - unintentional inflation / deflation of the balloon may have catastrophic results.<\/li>\n<li>Samples for ABG can be taken from the 4Fr arterial line, 8Fr arterial sheath and REBOA catheter (preferentially the REBOA catheter) - ensure to account for length of catheter when aspirating / flushing. Note, samples may also differ depending where they are taken from.<\/li>\n<li>Be alert for the potential for error when transducing two waveforms in a high-pressure, multi-personnel environment when there are a number of opportunities for the cables to become confused, this may be where the cables connect to the transducers or at the ‘splitter’ - attach one cable at a time and confirm expected waveform appears before connecting the second<\/li>\n<li>The transducer set up can be tested for dynamic response by pulling and quickly releasing the ‘Snap-Tab’ on the transducer - this should give you a ‘square’ waveform or a flattened trace.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"rats-reboa.s5\"><h2>Potential issues following balloon deflation<\/h2>\n<ul>\n<li><strong>Hypotension<\/strong> - ?Re-inflate balloon, blood products, caution with vasopressors, ongoing resuscitation, (try to optimise circulating volume <em>before deflation).<\/em><\/li>\n<li><strong>Re-perfusion<\/strong> - Hypothermia, hyperkalaemia, hypocalcaemia, coagulopathy and cardiac arrest can all occur - consider empirical initiation of insulin infusion (50IU in 50mL 50% Dextrose), sodium bicarbonate (1mL/kg 8.4%) and calcium chloride (10mL 10%). Note these effects may be worst 30-60min post-deflation and beyond, not necessarily immediately following deflation. Frequent ABGs / ROTEMs are required to monitor.<\/li>\n<\/ul>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-reboa-catheter.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-reboa-catheter.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s6\" id=\"rats-reboa.s6\"><h2>REBOA Monitor Setup<\/h2>\n<figure><button aria-label=\"Enlarge figure: 1. Access ‘Main Menu’ - bottom right\" class=\"zoom\" data-cap=\"1. Access ‘Main Menu’ - bottom right\" data-src=\"fig/rats-reboa-mon-1.jpg\" type=\"button\"><img alt=\"1. Access ‘Main Menu’ - bottom right\" loading=\"lazy\" src=\"fig/rats-reboa-mon-1.jpg\"/><\/button><figcaption>1. Access ‘Main Menu’ - bottom right<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 2. Main menu screen, swipe left\" class=\"zoom\" data-cap=\"2. Main menu screen, swipe left\" data-src=\"fig/rats-reboa-mon-2.jpg\" type=\"button\"><img alt=\"2. Main menu screen, swipe left\" loading=\"lazy\" src=\"fig/rats-reboa-mon-2.jpg\"/><\/button><figcaption>2. Main menu screen, swipe left<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 3. Press ‘Load'\" class=\"zoom\" data-cap=\"3. Press ‘Load'\" data-src=\"fig/rats-reboa-mon-3.jpg\" type=\"button\"><img alt=\"3. Press ‘Load'\" loading=\"lazy\" src=\"fig/rats-reboa-mon-3.jpg\"/><\/button><figcaption>3. Press ‘Load'<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 4. Select ‘REBOA’\" class=\"zoom\" data-cap=\"4. Select ‘REBOA’\" data-src=\"fig/rats-reboa-mon-4.jpg\" type=\"button\"><img alt=\"4. Select ‘REBOA’\" loading=\"lazy\" src=\"fig/rats-reboa-mon-4.jpg\"/><\/button><figcaption>4. Select ‘REBOA’<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 5. Press ‘Load’\" class=\"zoom\" data-cap=\"5. Press ‘Load’\" data-src=\"fig/rats-reboa-mon-5.jpg\" type=\"button\"><img alt=\"5. Press ‘Load’\" loading=\"lazy\" src=\"fig/rats-reboa-mon-5.jpg\"/><\/button><figcaption>5. Press ‘Load’<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 6. Press ‘OK'\" class=\"zoom\" data-cap=\"6. Press ‘OK'\" data-src=\"fig/rats-reboa-mon-6.jpg\" type=\"button\"><img alt=\"6. Press ‘OK'\" loading=\"lazy\" src=\"fig/rats-reboa-mon-6.jpg\"/><\/button><figcaption>6. Press ‘OK'<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 7. Ensure top left reads ‘General REBOA’ - no pressure waveform until transducer cables connected\" class=\"zoom\" data-cap=\"7. Ensure top left reads ‘General REBOA’ - no pressure waveform until transducer cables connected\" data-src=\"fig/rats-reboa-mon-7.jpg\" type=\"button\"><img alt=\"7. Ensure top left reads ‘General REBOA’ - no pressure waveform until transducer cables connected\" loading=\"lazy\" src=\"fig/rats-reboa-mon-7.jpg\"/><\/button><figcaption>7. Ensure top left reads ‘General REBOA’ - no pressure waveform until transducer cables connected<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 8. IBP1 = Red / Arterial - goes to REBOA catheter IBP2 = Blue - goes to REBOA sheath (Below)\" class=\"zoom\" data-cap=\"8. IBP1 = Red / Arterial - goes to REBOA catheter IBP2 = Blue - goes to REBOA sheath (Below)\" data-src=\"fig/rats-reboa-mon-8.jpg\" type=\"button\"><img alt=\"8. IBP1 = Red / Arterial - goes to REBOA catheter IBP2 = Blue - goes to REBOA sheath (Below)\" loading=\"lazy\" src=\"fig/rats-reboa-mon-8.jpg\"/><\/button><figcaption>8. IBP1 = Red / Arterial - goes to REBOA catheter IBP2 = Blue - goes to REBOA sheath (Below)<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 9. Two waveforms shown - zero will be required\" class=\"zoom\" data-cap=\"9. Two waveforms shown - zero will be required\" data-src=\"fig/rats-reboa-mon-9.jpg\" type=\"button\"><img alt=\"9. Two waveforms shown - zero will be required\" loading=\"lazy\" src=\"fig/rats-reboa-mon-9.jpg\"/><\/button><figcaption>9. Two waveforms shown - zero will be required<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 10. ‘Press Zero IBP’\" class=\"zoom\" data-cap=\"10. ‘Press Zero IBP’\" data-src=\"fig/rats-reboa-mon-10.jpg\" type=\"button\"><img alt=\"10. ‘Press Zero IBP’\" loading=\"lazy\" src=\"fig/rats-reboa-mon-10.jpg\"/><\/button><figcaption>10. ‘Press Zero IBP’<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: 11. Press ‘Zero all IBP’\" class=\"zoom\" data-cap=\"11. Press ‘Zero all IBP’\" data-src=\"fig/rats-reboa-mon-11.jpg\" type=\"button\"><img alt=\"11. Press ‘Zero all IBP’\" loading=\"lazy\" src=\"fig/rats-reboa-mon-11.jpg\"/><\/button><figcaption>11. Press ‘Zero all IBP’<span>Tap to enlarge<\/span><\/figcaption><\/figure><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-line-setup", "title": "Trauma Line and Arterial Line Setup", "group": "kit", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Trauma Lines"}, {"id": "s2", "title": "Arterial lines"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-line-setup.s1\"><h2>Trauma Lines<\/h2>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-tline-1.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-tline-1.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<p>The dilator needs to be threaded through the line prior to insertion and over the guidewire - note how far out the dilator lies from the tip (<em>Picture 1<\/em>).<\/p>\n<p>One method of reducing vessel injury risk is to not completely push the dilator through the line (<em>Picture 2<\/em>).<\/p>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-tline-2.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-tline-2.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<p>The blue port cover in the pack needs to be attached to the central port (as below) to avoid air embolus - if accidentally discarded they are available separately but should <strong>not<\/strong> be omitted. The larger bore (brown) port should be used for product resuscitation and the smaller (white) for drug administration. We advise a three way tap to be connected as below (<em>Picture 3<\/em>).<\/p>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-tline-3.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-tline-3.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rats-line-setup.s2\"><h2>Arterial lines<\/h2>\n<p>An arterial line is a useful addition to the monitoring of a trauma patient and attempts to insert one should be made early on during treatment. It should not delay potentially life saving interventions as non-invasive BP (NIBP), or even a peripheral / central pulse palpation can provide similar information, far more quickly. A venous gas may also be obtained from the trauma line to guide biochemical resuscitation. Securing an arterial line can prove challenging in the hypotensive trauma patient. We recommend securing the transducer for the arterial line to the NIBP cuff (see picture), as this will securely keep it at the correct level.<\/p>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-aline.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-aline.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-warming", "title": "Warming Kit (Inditherm)", "group": "kit", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Inditherm mattress tips and tricks"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-warming.s1\"><h2>Inditherm mattress tips and tricks<\/h2>\n<ul>\n<li>The Inditherm mattress is used wire side up, is X-ray compatible and can also be used as a transfer sheet. Radiology will not currently CT patients on the mattress.<\/li>\n<li>Setting up and initiate before patient arrival.<\/li>\n<li>It will function fully for 30min in battery mode.<\/li>\n<li>Look for green light to confirm it is turned on.<\/li>\n<li>Any of the ports on the front of the control unit can be used.<\/li>\n<li>The maximum temperature is 40°C and will not cause burns but will take <strong>up to 20mins<\/strong> to reach operating temperature.<\/li>\n<li>A Bair hugger placed on top of the Inditherm will speed the warming process.<\/li>\n<\/ul>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-inditherm.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-inditherm.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-pac", "title": "Pulmonary Artery Catheter", "group": "kit", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Definition"}, {"id": "s2", "title": "Indications in trauma"}, {"id": "s3", "title": "Insertion"}, {"id": "s4", "title": "Floating the PAC"}, {"id": "s5", "title": "Monitor setup"}, {"id": "s6", "title": "PAC Waveform"}, {"id": "s7", "title": "Risks"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-pac.s1\"><h2>Definition<\/h2>\n<p>The Pulmonary Artery Catheter (PAC) is a multi-lumen, balloon tipped catheter floated through the right heart to the pulmonary artery, it facilitates advanced haemodynamic assessment<\/p>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-pac-photo.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-pac-photo.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rats-pac.s2\"><h2>Indications in trauma<\/h2>\n<ul>\n<li>Complex, multifactorial hemodynamic instability with suspected cardiogenic component<\/li>\n<li>ECMO anticipated or initiated<\/li>\n<li>Less invasive monitoring inadequate for haemodynamic assessment<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"rats-pac.s3\"><h2>Insertion<\/h2>\n<p>The PAC is inserted through an introducer, an introducer sheath with a valved port for the line. A trauma line (MAC line) includes an introducer sheath but alternative wide bore access must be available. Ideally it should be inserted into the RIJ, although left subclavian, right subclavian and LIJ sites are alternative options (in order of preference).<\/p>\n<ol>\n<li>Sterile field around new/pre-existing sheath, operator gowned &amp; gloved<\/li>\n<li>Open PAC to sterile field, maintain curvature<\/li>\n<li>1.5ml syringe attached to red port, check balloon, passive deflation<\/li>\n<li>3-way taps attached to blue &amp; yellow lumens<\/li>\n<li>Bionector to other lumens, flush &amp; check all<\/li>\n<li>Connect CVP line to blue lumen, PA line to yellow lumen<\/li>\n<li>Insert PAC through sterile cover &amp; haemostasis valve<\/li>\n<li>Curvature pointing to patient’s left if RIJ<\/li>\n<li>Connect sterile cover to haemostasis valve<\/li>\n<\/ol>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"rats-pac.s4\"><h2>Floating the PAC<\/h2>\n<ol>\n<li>Ensure PA waveform corresponds to distal, yellow lumen on PAC<\/li>\n<li>Insert to 16-20cm, confirm RA waveform<\/li>\n<li>Inflate balloon with 1.5ml air via red port and lock<\/li>\n<li>Advance smoothly until RV then PA waveforms seen (~40-50cm if RIJ)<\/li>\n<li>Gently advance a little further until waveform flattens (PAOP)<\/li>\n<li>Note depth, deflate balloon and withdraw 2-3cm<\/li>\n<li>Ensure PA waveform returns<\/li>\n<li>Connect CCO cable (after testing: see below) &amp; SvO2 cable<\/li>\n<li>XR in ICU: catheter tip in West Zone 3, below LA<\/li>\n<\/ol>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"rats-pac.s5\"><h2>Monitor setup<\/h2>\n<ul>\n<li><a href=\"https://www.youtube.com/watch?v=7B_4J3EPMzU\" target=\"_blank\" rel=\"noopener\">Edwards HemoSphere Set Up<\/a><\/li>\n<li><a href=\"https://www.youtube.com/watch?v=UgkG1NlRjUg\" target=\"_blank\" rel=\"noopener\">Edwards CCO Set Up Video<\/a><\/li>\n<li>Edwards Quick Guide to Cardiopulmonary Care Booklet<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s6\" id=\"rats-pac.s6\"><h2>PAC Waveform<\/h2>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-pac-waveform.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-pac-waveform.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s7\" id=\"rats-pac.s7\"><h2>Risks<\/h2>\n<ul>\n<li>Risk of arrhythmias<ul>\n<li>Advance carefully, monitor closely<\/li>\n<li>If occur stop, deflate balloon, withdraw catheter, wait, manage as needed<\/li>\n<\/ul>\n<\/li>\n<li>Catheter looping in RV<ul>\n<li>\n<aside class=\"callout\">\n<p>15cm from RV without PA trace<\/p>\n<\/aside>\n<\/li>\n<li>Deflate balloon, withdraw, retry<\/li>\n<li>Too slow insertion allows PAC to heat up and soften<\/li>\n<li>Rotate PAC to re-align curvature<\/li>\n<\/ul>\n<\/li>\n<li>Do not leave PAC wedged - risk of PA rupture, infarct<\/li>\n<li>Always deflate balloon to withdraw - risk of valve damage<\/li>\n<li>Wedge waveform present without balloon inflation - tip too peripheral, risk of infarct<\/li>\n<li>Keep wedges to a minimum (10-15s)<\/li>\n<li>Do not use saline in balloon - deflation may not be possible<\/li>\n<\/ul>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-pac-parameters.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-pac-parameters.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-pac-flow.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-pac-flow.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-defib-paddles", "title": "Internal Defib Paddles", "group": "kit", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "How to Connect & Use the Internal Defib Paddles"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-defib-paddles.s1\"><h2>How to Connect &amp; Use the Internal Defib Paddles<\/h2>\n<figure><button aria-label=\"Enlarge figure: How to Connect &amp; Use the Internal Defib Paddles\" class=\"zoom\" data-cap=\"How to Connect &amp; Use the Internal Defib Paddles\" data-src=\"fig/rats-defib-paddles.jpg\" type=\"button\"><img alt=\"How to Connect &amp; Use the Internal Defib Paddles\" loading=\"lazy\" src=\"fig/rats-defib-paddles.jpg\"/><\/button><figcaption>How to Connect &amp; Use the Internal Defib Paddles<span>Tap to enlarge<\/span><\/figcaption><\/figure><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-resus-bay-8", "title": "Resus Bay 8 and Drug Setup", "group": "logistics", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Resus (Bay 8)"}, {"id": "s2", "title": "Drug Setup"}, {"id": "s3", "title": "Difficult Airway Trolley"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-resus-bay-8.s1\"><h2>Resus (Bay 8)<\/h2>\n<p>Bay 8 in Resus is the default bay for patients with major traumatic injury including neurological injury. In addition to the standard setup of a Resus bay it includes:<\/p>\n<ul>\n<li>REBOA trolley<\/li>\n<li>Difficult airway trolley<\/li>\n<li>ParaPAC ventilator, Mapleson C circuit attached to wall O<sub>2<\/sub>, suction<\/li>\n<li>Inditherm warming mattress<\/li>\n<li>CODE RED gratnel trolley<\/li>\n<li>Belmont Rapid Infusion device<\/li>\n<li>Surgical lighting overhead<\/li>\n<li>X-ray gantry<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rats-resus-bay-8.s2\"><h2>Drug Setup<\/h2>\n<p>A tray of drugs is maintained by the Trauma ODP and available for use<br/>Ask for any controlled drugs early and anticipated requirements.<\/p>\n<div class=\"tbl stack\"><table>\n<thead>\n<tr>\n<th>Drug<\/th>\n<th>Concentration<\/th>\n<th>Volume<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Drug\">Fentanyl<\/td>\n<td data-label=\"Concentration\">50mcg/mL<\/td>\n<td data-label=\"Volume\">10mL<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Drug\">Ketamine<\/td>\n<td data-label=\"Concentration\">10mg/mL<\/td>\n<td data-label=\"Volume\">20mL<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Drug\">Propofol<\/td>\n<td data-label=\"Concentration\">10mg/mL<\/td>\n<td data-label=\"Volume\">20mL<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Drug\">Rocuronium<\/td>\n<td data-label=\"Concentration\">10mg/mL<\/td>\n<td data-label=\"Volume\">10mL<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Drug\">Suxamethonium<\/td>\n<td data-label=\"Concentration\">50mg/mL<\/td>\n<td data-label=\"Volume\">2mL<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Drug\">Ephedrine<\/td>\n<td data-label=\"Concentration\">3mg/mL<\/td>\n<td data-label=\"Volume\">10mL<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Drug\">Metaraminol<\/td>\n<td data-label=\"Concentration\">0.5mg/mL<\/td>\n<td data-label=\"Volume\">20mL<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Drug\">Atropine<\/td>\n<td data-label=\"Concentration\">600mcg/mL<\/td>\n<td data-label=\"Volume\">1mL<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Drug\">0.9% NaCl<\/td>\n<td data-label=\"Concentration\">-<\/td>\n<td data-label=\"Volume\">20mL x 2<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-resus-tray.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-resus-tray.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"rats-resus-bay-8.s3\"><h2>Difficult Airway Trolley<\/h2>\n<p>The Difficult Airway Trolley is located between Bay 7 and 8 at the patient’s head end of the bay. It follows the Difficult Airway Society Plan A / B / C / D approach and contains:<\/p>\n<ul>\n<li><strong>Plan A<\/strong> - Various sizes of ETT including those with a subglottic suction port, catheter mount / filter sets, direct laryngoscopy with Macintosh 3 and 4 blades, tube-ties<\/li>\n<li><strong>Plan B<\/strong> - iGel size 3 / 4 / 5, LMA supreme size 3 / 4 / 5<\/li>\n<li><strong>Plan C<\/strong> - Self-inflating bag, Guedel airways size 2 / 3 / 4, face masks size 3 / 4 / 5. Sugammadex emergency reversal (16mg/kg) is very rarely an option for trauma patients as their ongoing care usually requires intubation. <strong>Failure here will immediately lead to Plan D.<\/strong><\/li>\n<li><strong>Plan D<\/strong> - Front of neck access equipment (scalpel / bougie / tube), <strong>(see <a href=\"#ed-rsi.s5\">Emergency Department RSI: Plan D<\/a>)<\/strong>, various sizes of tracheostomy<\/li>\n<\/ul><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-marched", "title": "Preparing the Theatre (MARCHED)", "group": "logistics", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Preparing the Theatre for Code Red"}, {"id": "s2", "title": "M A R C H E D"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-marched.s1\"><h2>Preparing the Theatre for Code Red<\/h2>\n<p>Preparation for a CODE RED is something that begins from the moment the bleep goes out. The coordinated, simultaneous activity of independent team members will usually occur with little to no input. However, there will <em>always<\/em> be value in double-checking the theatre environment is optimised and the equipment is available for immediate use - checklists are available to assist with this. In addition, the theatre team have a ‘default setup’ for instruments etc for laparotomy / thoracotomy / craniotomy. MARCHED is an acronym that may be helpful in remembering all potential steps.<\/p>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rats-marched.s2\"><h2>M A R C H E D<\/h2>\n<div class=\"tbl kv\"><table>\n<tbody>\n<tr>\n<td><strong>M<\/strong>ajor Haemorrhage<\/td>\n<td>CODE RED trolley with balanced transfusion board in theatre<br/>MAC trauma line prepared<br/>RIC (Rapid Infusion Catheter) prepared (Theatre 8 CODE RED drawer)<br/>Ultrasound and sterile probe covers available<\/td>\n<\/tr>\n<tr>\n<td><strong>A<\/strong>irway<\/td>\n<td>Airway trolley prepared for RSI<br/>C-Mac system available (especially if blunt trauma)<\/td>\n<\/tr>\n<tr>\n<td><strong>R<\/strong>EBOA<\/td>\n<td>Refer to <strong><a href=\"#rats-reboa\">REBOA and Monitor Setup<\/a><\/strong><br/>Prepare to transduce both REBOA sheath and catheter<\/td>\n<\/tr>\n<tr>\n<td><strong>C<\/strong>irculation<\/td>\n<td>Cardiac arrest trolley available (PEA most common rhythm in trauma)<br/>Belmont Rapid infuser plus consumables including 500mL 0.9% NaCl - do not need to prime, ED will also prepare. Consider using Belmont bucket - see <strong><a href=\"#rats-belmont\">Belmont Rapid Infusion Device<\/a><\/strong><br/>Arterial line kits x 2 (left and right) - bilateral, concurrent attempts<\/td>\n<\/tr>\n<tr>\n<td><strong>C<\/strong>irculation<\/td>\n<td>Unlikely a CVP transducer will be needed - prepare a single transducer for simplicity, this can also be pre-zeroed to save time<\/td>\n<\/tr>\n<tr>\n<td><strong>H<\/strong>ypothermia<\/td>\n<td>Refer to <strong><a href=\"#rats-warming\">Warming Kit (Inditherm)<\/a><\/strong><br/>Increase theatre temperature to 25<sup>O<\/sup>C / maximum<br/>Prepare Inditherm controller and have mattress available - patient should arrive from ED on mattress<br/>Have under-body Bairhugger on theatre table + surgical access Bairhugger blanket available<br/>Consider gamgee / inco-pads to cover head / exposed limbs<\/td>\n<\/tr>\n<tr>\n<td><strong>E<\/strong>xpect<\/td>\n<td>Prepare for multiple ABG and ROTEM samples including a baseline sample - 10mL / 5mL syringes, ABG syringes, blue vacutainer and blunt needles<br/>Blue vacutainers <strong>must<\/strong> be filled to 2.7mL line - incorrect volume of blood will invalidate results of ROTEM<br/>Extra ODPs required? Consider need for dedicated Airway / Left hand / Right hand / Belmont ODPs<\/td>\n<\/tr>\n<tr>\n<td><strong>D<\/strong>rugs<\/td>\n<td>Prepare as <strong><a href=\"#rats-code-red-activation\">Code Red: Activation<\/a><\/strong><br/>General anaesthetic - Fentanyl 500mcg (50mcg/mL), induction agent (Ketamine), muscle relaxant (Rocuronium)<br/>Electrolyte correction - 10mL calcium chloride, insulin / glucose to correct hyperkalaemia (note high dose concentration used)<br/>TXA 2g (within first 3 hours), 1g (every whole body transfusion)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-major-incident", "title": "Major Incident", "group": "logistics", "version": "", "effective": "", "review": "", "hidden": false, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Activation"}, {"id": "s2", "title": "Process"}, {"id": "s3", "title": "Where"}, {"id": "s4", "title": "Communication"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-major-incident.s1\"><h2>Activation<\/h2>\n<p>Initial awareness of a major incident may be via Social Media or news outlets.<\/p>\n<p>Begin preparations to attend but await instructions. This is likely to be via text message in the first instance via Page One to inform Consultant Anaesthetists and Surgeons. <strong>HOSPITAL ID IS ESSENTIAL FOR ENTRY.<\/strong><\/p>\n<p>Upon arrival get into scrubs and present yourself to the Tea Bar.<\/p>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rats-major-incident.s2\"><h2>Process<\/h2>\n<p>Theatre 12 continues with ‘life or limb’ surgery and all other theatres will finish their current operations as soon as possible and begin to prepare to receive casualties.<\/p>\n<p>At a minimum, theatres 7 - 12 will be made ready as for a CODE RED and Theatre 11 as for a CODE BLACK.<\/p>\n<p>Additional space will be made ready in Theatres 1 – 6 and then ACAD as necessary for additional patients who should ideally be more stable than those managed in 7 - 12.<\/p>\n<p>Theatre staff will cohort and collect in the Tea Bar.<\/p>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"rats-major-incident.s3\"><h2>Where<\/h2>\n<p>Oncall trauma, vascular, general, orthopaedic and OMFS surgeons will report directly to Resus with the on-call ITU, Anaesthetic and ODP teams.<\/p>\n<p>All other staff will report to Tea Bar and await instructions.<\/p>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"rats-major-incident.s4\"><h2>Communication<\/h2>\n<p>The Anaesthetic Coordinator and Theatre Coordinator will be the central point of all communication and allocation of roles.<\/p>\n<p>Try to minimise any unnecessary communication and beware of failure of mobile phones.<\/p><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-baste", "title": "BASTE", "group": "resus", "version": "", "effective": "", "review": "", "hidden": true, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "BASTE"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-baste.s1\"><h2>BASTE<\/h2>\n<p>BASTE is a helpful mnemonic that acts as a reminder of the near constant reassessment patients require during a CODE RED. It includes assessment of ongoing transfusion requirements, the metabolic status of the patient including reversible causes of coagulopathy (acidosis, hypocalcaemia, hypothermia) as well as encouraging frequent communication with the surgical team. <strong>Review BASTE out loud to the whole operating theatre.<\/strong><\/p>\n<div class=\"tbl kv\"><table>\n<tbody>\n<tr>\n<td><strong>B<\/strong>lood<\/td>\n<td>Review the transfusion board, what has been given? What is the anticipated ongoing requirement? ROTEM results? Do you need to order more?<\/td>\n<\/tr>\n<tr>\n<td><strong>A<\/strong>cid / base balance<\/td>\n<td>pH, lactate, HCO<sub>3<\/sub><sup>-<\/sup> / BE<\/td>\n<\/tr>\n<tr>\n<td><strong>S<\/strong>urgical progress<\/td>\n<td>Communicate with the surgical team, do you need time to catch up with blood products (‘pack and hold’) or otherwise optimise the patient for the next stage of surgery?<\/td>\n<\/tr>\n<tr>\n<td><strong>T<\/strong>emperature<br/><strong>T<\/strong>ime<\/td>\n<td>Patient temperature &amp; trend, time elapsed since start of case. Ambient temperature at maximum (25°C), active warming of patient with Bair hugger / Inditherm mattress.<\/td>\n<\/tr>\n<tr>\n<td><strong>E<\/strong>lectrolytes<\/td>\n<td>K<sup>+<\/sup>&lt;5.8mmol/L, corrected Ca<sup>2+<\/sup>&gt;1.0mmol/L, correct and replace as required.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "rats-code-red-activation", "title": "Code Red: Activation", "group": "resus", "version": "", "effective": "", "review": "", "hidden": true, "aim": "", "objectives": [], "footer": "Source: RATS handbook (Resuscitation, Anaesthetic and Trauma Skills), version 3.3", "related": [], "sections": [{"id": "s1", "title": "Identify"}, {"id": "s2", "title": "Initial resuscitation"}, {"id": "s3", "title": "Ongoing bleeding?"}, {"id": "s4", "title": "Bleeding controlled?"}, {"id": "s5", "title": "Drugs"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rats-code-red-activation.s1\"><h2>Identify<\/h2>\n<ol>\n<li><strong>Systolic blood pressure &lt; 90mmHg AND<\/strong><\/li>\n<li>Suspected active haemorrhage<\/li>\n<\/ol>\n<p>Nominate team member as <strong>CODE RED Communication Lead<\/strong><\/p>\n<ul>\n<li>Call Haematology Lab (Ext 61108) to request CODE RED PACK A or B<\/li>\n<li>Collect 6x RBCs from emergency fridge<\/li>\n<li>O negative (females) / O positive (males)<\/li>\n<li>Other products to be collected by Porter / HCA from Transfusion Lab<\/li>\n<li>Ensure being sent to correct area (Resus vs IR vs Theatres)<\/li>\n<li>FFP can only be returned to the fridge if out for &lt;30min<\/li>\n<li>Strongly consider putting FFP straight into theatre blood fridge if not being used immediately<\/li>\n<li>Track transfusion on Transfusion Board in theatre<\/li>\n<li>(nominate one person responsible for this)<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rats-code-red-activation.s2\"><h2>Initial resuscitation<\/h2>\n<ul>\n<li>6 units RBC/ 6 Units FFP (PACK A)<\/li>\n<li>Baseline bloods - ABG / G + S / ROTEM / FBC<\/li>\n<li>2g TXA IV push - check pre-hospital + ED Resus treatments.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"rats-code-red-activation.s3\"><h2>Ongoing bleeding?<\/h2>\n<ul>\n<li>6units RBC / 6 units FFP / 2 Cryoprecipitate / 1 pool Platelets (PACK B).<\/li>\n<li>Porter collects - <strong>order EARLY<\/strong><\/li>\n<li>BASTE (<strong>see <a href=\"#rats-baste\">BASTE<\/a><\/strong>)<\/li>\n<li>Transfusion guided by ROTEM (<strong>see <a href=\"#rotem-algorithm\">Code Red ROTEM Algorithm<\/a><\/strong>)<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"rats-code-red-activation.s4\"><h2>Bleeding controlled?<\/h2>\n<ul>\n<li>Step down CODE RED - inform Haematology Lab (Ext 61117 / Ext 60344)<\/li>\n<li>Return unused products.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"rats-code-red-activation.s5\"><h2>Drugs<\/h2>\n<p>Drugs for RSI, haemostasis, blood pressure support and electrolyte management should be drawn up as ASAP - transfer to theatre may be rapid.<\/p>\n<p><strong>Note<\/strong> Concentration of Actrapid - 15IU and 50IU in 50mL are both routinely used. Prepare as opposite for CODE RED. (see <a href=\"#code-red.s3\">Code Red CPG<\/a>)<\/p>\n<figure><button aria-label=\"Enlarge figure: \" class=\"zoom\" data-cap=\"\" data-src=\"fig/rats-codered-drugs.jpg\" type=\"button\"><img alt=\"\" loading=\"lazy\" src=\"fig/rats-codered-drugs.jpg\"/><\/button><figcaption><span>Tap to enlarge<\/span><\/figcaption><\/figure><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "phone-numbers", "title": "Phone Numbers (Accurx)", "group": "logistics", "version": "", "effective": "", "review": "", "hidden": true, "aim": "", "objectives": [], "footer": "Accurx is a separate app. You need to be signed in to Accurx to see the directory.", "related": [], "sections": [{"id": "s1", "title": "Find a number in Accurx"}, {"id": "s2", "title": "Get the Accurx app"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"phone-numbers.s1\"><h2>Find a number in Accurx<\/h2>\n<p>Royal London Hospital phone numbers, extensions and bleeps are in the Accurx app directory.<\/p>\n<ol>\n<li>Open the Accurx app.<\/li>\n<li>Open the <strong>Directory<\/strong>.<\/li>\n<li>If another hospital is showing, select its name, then search for and select <strong>Royal London Hospital<\/strong>.<\/li>\n<li>Search for the contact by name.<\/li>\n<\/ol>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"phone-numbers.s2\"><h2>Get the Accurx app<\/h2>\n<ul>\n<li><a href=\"https://apps.apple.com/gb/app/accurx/id604873500\" target=\"_blank\" rel=\"noopener\">Accurx on the App Store (iPhone)<\/a><\/li>\n<li><a href=\"https://play.google.com/store/apps/details?id=com.hermes.induction\" target=\"_blank\" rel=\"noopener\">Accurx on Google Play (Android)<\/a><\/li>\n<\/ul>\n<p>If the app is already installed, these pages show an <strong>Open<\/strong> button.<\/p><\/section>", "source": "RATS handbook 3.3.pdf"}, {"slug": "acknowledgements", "title": "Acknowledgements", "group": "about", "version": "", "effective": "", "review": "", "hidden": true, "aim": "", "objectives": [], "footer": "From the TAG clinical practice guidelines (2025) and the RATS handbook, version 3.3", "related": [], "sections": [{"id": "s1", "title": "Clinical practice guidelines"}, {"id": "s2", "title": "RATS handbook"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"acknowledgements.s1\"><h2>Clinical practice guidelines<\/h2>\n<p>Royal London Hospital clinical practice guidelines.<\/p>\n<p><strong>Author:<\/strong> Trauma Anaesthesia Group<br/><strong>Clinical Network:<\/strong> Department of Perioperative &amp; Pain Medicine<\/p>\n<div class=\"tbl kv\"><table>\n<tbody>\n<tr>\n<td><strong>Code Red<\/strong><\/td>\n<td>Version 2 (reviewed June 2025)<\/td>\n<\/tr>\n<tr>\n<td><strong>Code Black<\/strong><\/td>\n<td>Version 2 (reviewed June 2025)<\/td>\n<\/tr>\n<tr>\n<td><strong>Emergency Department RSI<\/strong><\/td>\n<td>Version 2 (reviewed June 2025)<\/td>\n<\/tr>\n<tr>\n<td><strong>Difficult Airway and OMFS Trauma<\/strong><\/td>\n<td>Version 2 (reviewed July 2025)<\/td>\n<\/tr>\n<tr>\n<td><strong>Neck Injury<\/strong><\/td>\n<td>Version 2 (reviewed July 2025)<\/td>\n<\/tr>\n<tr>\n<td><strong>One Lung Ventilation<\/strong><\/td>\n<td>Version 2 (July 2025)<\/td>\n<\/tr>\n<tr>\n<td><strong>Elderly Trauma<\/strong><\/td>\n<td>Version 2.0 (reviewed July 2025)<\/td>\n<\/tr>\n<tr>\n<td><strong>Pregnant Trauma<\/strong><\/td>\n<td>Version 2.0 (reviewed July 2025)<\/td>\n<\/tr>\n<tr>\n<td><strong>Drowning and Hypothermia<\/strong><\/td>\n<td>Version 2 (reviewed July 2025)<\/td>\n<\/tr>\n<tr>\n<td><strong>Rib Fractures<\/strong><\/td>\n<td>Version 2 (reviewed July 2025)<\/td>\n<\/tr>\n<tr>\n<td><strong>Spinal Cord Injury<\/strong><\/td>\n<td>Version 2 (reviewed Mar 2025)<\/td>\n<\/tr>\n<tr>\n<td><strong>Vascular Access<\/strong><\/td>\n<td>Version 2 (reviewed July 2025)<\/td>\n<\/tr>\n<tr>\n<td><strong>Ultrasound<\/strong><\/td>\n<td>Version 2 (reviewed July 2025)<\/td>\n<\/tr>\n<tr>\n<td><strong>TAG Skillset<\/strong><\/td>\n<td>Version 2 (reviewed July 2025)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The Code Red ROTEM Algorithm is dated Nov 2023.<\/p>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"acknowledgements.s2\"><h2>RATS handbook<\/h2>\n<p><strong>A practical guide to care of the trauma patient<\/strong><\/p>\n<ul>\n<li><strong>Dr James Shuttleworth<\/strong> MBBS BSc (Hons)<\/li>\n<li><strong>Dr Nina Taheri<\/strong> BMBS BMedSc (Hons) MSc<\/li>\n<li><strong>Mr Ben Roberts<\/strong> Operating Department Practitioner<\/li>\n<li><strong>Dr Jo Organ<\/strong> MBBCh BSc (Hons) DipMM FRCA FFICM<\/li>\n<li><strong>Dr Dan Nevin<\/strong> MBBCh Dip IMC RCS Ed FCA (SA) MScMed<\/li>\n<\/ul>\n<p>With thanks and acknowledgement to all those at the Royal London Hospital Theatres, Emergency Medicine and Anaesthetic Departments (especially the Trauma Anaesthesia Group) who contribute to trauma patient care and who have helped develop this course.<\/p>\n<p>Special thanks to Dr Stephen Shepherd for his work developing the Double Lumen Tube section.<\/p>\n<p>For Danny, Bud, Si and the 454.<br/><em>Ben Roberts<\/em><\/p>\n<p>For Ben.<br/><em>Jo Organ<\/em><\/p>\n<h3>Introduction<\/h3>\n<p>The Resuscitation, Anaesthetic and Trauma Skills (RATS) handbook is the accompanying text to the RATS Course. It is designed as an aide-memoire to allow rapid access to key practical knowledge for those involved in the acute management of traumatically injured patients.<\/p>\n<p>This handbook will support less experienced members of a trauma team to participate as active members and make effective contributions to trauma patient care.<\/p>\n<p>It does not replace the knowledge gained through experience or shared by fellow team members but is intended to augment learning on the journey to trauma care mastery.<\/p><\/section>", "source": "RATS handbook 3.3.pdf"}]};
const $ = (s, el=document) => el.querySelector(s);
const main = $("#main"), q = $("#q"), clearBtn = $("#clear");
const BY = Object.fromEntries(DATA.cpgs.map(c => [c.slug, c]));
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[’‘]/g,"'");

/* ---------- search index: one entry per paragraph / list item / table row ---------- */
const INDEX = [];
for (const c of DATA.cpgs) {
  if (c.aim) INDEX.push({c, sid:null, sec:"Scope", text:"Aim: " + c.aim});
  c.objectives.forEach(o => INDEX.push({c, sid:null, sec:"Objectives", text:o}));
  const t = document.createElement("template"); t.innerHTML = c.html;
  t.content.querySelectorAll("section.sec").forEach(sec => {
    const secTitle = sec.querySelector("h2")?.textContent || "";
    sec.querySelectorAll("p, li, tr, figcaption, h3, .flow-r, .kit-item, .band").forEach(el => {
      if (el.tagName === "P" && el.closest("li, td, th")) return;
      let txt;
      if (el.tagName === "LI") { const cl = el.cloneNode(true); cl.querySelectorAll("ul,ol").forEach(n => n.remove()); txt = cl.textContent; }
      else if (el.tagName === "TR") txt = [...el.children].map(x => { const cl = x.cloneNode(true); cl.querySelectorAll("br").forEach(b => b.replaceWith(" ")); cl.querySelectorAll("li").forEach(l => l.append(" ")); return cl.textContent.trim(); }).join(" · ");
      else txt = el.textContent;
      txt = txt.replace(/\s+/g, " ").trim();
      if (txt.length > 1) INDEX.push({c, sid:sec.dataset.sid, sec:secTitle, text:txt, n:norm(txt)});
    });
  });
}
INDEX.forEach(e => { e.n = e.n || norm(e.text); e.hn = norm(e.sec); e.tn = norm(e.c.title); });

const SYN = {txa:["tranexamic"], tranexamic:["txa"], fona:["front of neck","front-of-neck"], mils:["manual in-line","in-line stabilisation","in-line immobilisation"],
  dlt:["double lumen"], olv:["one lung"], sga:["supraglottic"], lma:["supraglottic"], vl:["videolaryngoscop","video laryngoscop"], ric:["rapid infusion"],
  pocus:["ultrasound"], fast:["ultrasound"], cvc:["central"], io:["intra-osseus","intraosseous"], ffp:["plasma"], prbc:["red cell"], ecmo:["extracorporeal"],
  potassium:["k+","hyperkal"], hyperkalaemia:["potassium"], cacl:["calcium chloride"], sux:["suxamethonium"], roc:["rocuronium"], ketamine:["ketamine"],
  icp:["intracranial"], tbi:["brain injury","code black"], pmcs:["peri-mortem caesarian","peri-mortem caesarean"], stumbl:["stumbl"]};
function alts(t){ return [t, ...(SYN[t] || [])]; }
function terms(query){ return norm(query).split(/\s+/).filter(Boolean); }
