 "title": "Neck Injury", "group": "airway", "version": "2 (reviewed July 2025)", "effective": "1 July 2022", "review": "1 July 2028", "hidden": false, "aim": "To outline a standardised approach to the management of the airway in patients with penetrating and blunt neck injuries.", "objectives": ["Describe the anatomical zones.", "Describe the considerations in decision making for airway management.", "Describe the airway management plan in neck trauma."], "footer": "", "related": [{"name": "Vascular Access CPG", "slug": "vascular-access"}, {"name": "Difficult Airway & OMFS Trauma CPG", "slug": "difficult-airway"}, {"name": "Code Red CPG", "slug": "code-red"}, {"name": "Emergency Department RSI CPG", "slug": "ed-rsi"}], "sections": [{"id": "s1", "title": "Neck Zones"}, {"id": "s2", "title": "Decision-making Principles"}, {"id": "s3", "title": "Airway Management Plan"}, {"id": "s4", "title": "Urgent intubation NOT required"}, {"id": "s5", "title": "Urgent intubation required; NO airway injury suspected"}, {"id": "s6", "title": "Urgent intubation required; airway injury IS suspected"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"neck-injury.s1\"><h2>Neck Zones<\/h2>\n<figure><button aria-label=\"Enlarge figure: Neck zones I, II and III\" class=\"zoom\" data-cap=\"Neck zones I, II and III\" data-src=\"fig/neck-zones.jpg\" type=\"button\"><img alt=\"Neck zones I, II and III\" loading=\"lazy\" src=\"fig/neck-zones.jpg\"/><\/button><figcaption>Neck zones I, II and III<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"neck-injury.s2\"><h2>Decision-making Principles<\/h2>\n<ul>\n<li>For the purposes of the immediate management of the airway, the distinction between blunt or penetrating trauma is less important.<\/li>\n<li>Actual or impending airway compromise, other injuries or clinical course may preclude multidisciplinary input (primarily Trauma or, in selected cases, Airway Surgeons).<\/li>\n<li>Small, seemingly superficial injuries can cause significant occult injuries.<\/li>\n<li>Injuries of concern include the following:<ul>\n<li><strong>Vascular injuries<\/strong>: May cause compression and distortion, bleeding control may be difficult, airway management may be difficult.<\/li>\n<li><strong>Airway injury<\/strong>: May cause airway disruption, massive surgical emphysema, obstruction and ventilatory failure.<\/li>\n<li><strong>Zone 1 injury<\/strong>: May penetrate the thorax causing subclavian and brachiocephalic injury, lung injury and tension pneumothorax.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>There are 2 questions that guide initial management strategy:<\/h3>\n<p><strong>1. Is immediate/urgent intubation indicated?<\/strong><\/p>\n<p>Injuries that do not require immediate management allow time to gather a comprehensive clinical picture ± imaging, before a bespoke plan can be made with appropriate specialist input. In reality, many patients with neck injuries require immediate or urgent intervention.<\/p>\n<p><strong>2. Is there a suspected injury to the airway?<\/strong><\/p>\n<ul>\n<li>Information may be limited, imaging may be unavailable, and external injuries may be misleading, particularly with penetrating injuries which can cause occult damage distant from the puncture site.<\/li>\n<li>Airway injuries are more common in penetrating trauma.<\/li>\n<li>Blunt trauma may cause serious injuries including laryngeal fractures, tracheal tears, and laryngotracheal separation.<\/li>\n<li>Injury mechanism should be correlated with clinical findings to identify potential airway injuries.<\/li>\n<li>Signs suggestive of laryngotracheal injury:<ul>\n<li>Abrasions, bruising and deformity overlying airway structures<\/li>\n<li>Stridor/ hoarseness/drooling<\/li>\n<li>Haemoptysis<\/li>\n<li>Surgical emphysema/bubbles at wound site<\/li>\n<li>Ventilatory failure<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"neck-injury.s3\"><h2>Airway Management Plan<\/h2>\n<div class=\"flow\">\n<div class=\"flow-q\">Is urgent intubation required?<\/div>\n<div class=\"flow-branches\">\n<div class=\"flow-b\"><span class=\"flow-a no\">No<\/span><div class=\"flow-r\">Urgent intubation NOT required <small>(see below)<\/small><\/div><\/div>\n<div class=\"flow-b\"><span class=\"flow-a yes\">Yes<\/span><div><div class=\"flow-q\">Is airway injury suspected?<\/div>\n<div class=\"flow-branches\">\n<div class=\"flow-b\"><span class=\"flow-a no\">No<\/span><div class=\"flow-r\"><b>Plan A:<\/b> Emergency Department RSI<br/><b>Plan B:<\/b> Front-of-neck access<\/div><\/div>\n<div class=\"flow-b\"><span class=\"flow-a yes\">Yes<\/span><div class=\"flow-r\"><b>Plan A:<\/b> Ambuscope assisted DL/VL (Double technique)<br/><b>Plan B:<\/b> Surgical Tracheostomy<\/div><\/div>\n<\/div><\/div><\/div>\n<\/div>\n<\/div>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"neck-injury.s4\"><h2>Urgent intubation NOT required<\/h2>\n<p>When immediate or urgent intubation is not required, imaging can be performed to characterise the nature of the injury and multidisciplinary expertise can be consulted to create an individualised plan. Advanced techniques such as AFOI, rigid bronchoscopy, awake tracheostomy, use of double lumen tubes and standby VV ECMO can be considered.<\/p>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"neck-injury.s5\"><h2>Urgent intubation required; NO airway injury suspected<\/h2>\n<p><strong>Plan A – Emergency Department RSI<\/strong><br/><strong>Plan B – FONA<\/strong><\/p>\n<ul>\n<li>Refer: <a class=\"xref\" href=\"#ed-rsi\">Emergency Department RSI CPG<\/a><\/li>\n<li>Be aware that external compression of structures may distort the airway<\/li>\n<li>This may be appropriate in patients with:<ul>\n<li><strong>Vascular injuries<\/strong> where airway management is being expedited<\/li>\n<li><strong>Zone 3 neck injuries<\/strong> with concurrent max-fax injuries. Although external anatomy to the face and oral cavity may be grossly distorted, direct laryngoscopy is usually possible following administration of NMBs. The patient is usually best managed in a position of comfort (e.g., sitting up) until induction, with <strong>2x suction<\/strong> available to manage pooled secretions and blood.<\/li>\n<\/ul>\n<\/li>\n<li><strong>LMAs are usually not suitable for these patients<\/strong><\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s6\" id=\"neck-injury.s6\"><h2>Urgent intubation required; airway injury IS suspected<\/h2>\n<h3>Plan A – Ambuscope assisted DL/VL<\/h3>\n<ul>\n<li><strong>Prepare the neck<\/strong> with local anaesthetic &amp; adrenaline before commencement.<\/li>\n<li>Involves an RSI with direct (DL) or videolaryngoscopy (VL) and a second operator with an ambuscope. DL/VL allows evaluation of the hypopharynx and larynx. The ambuscope is advanced to and through the laryngeal inlet under vision. The inside of the trachea may be inspected, and the injury identified and characterised. Thereafter an ETT can be advanced beyond the injury (bevel orientated to face the injury to minimise the risk of creating a false passage or extending the injury).<\/li>\n<li>Use a small ETT (size 6.0 - 7.0).<\/li>\n<li><strong>Positive pressure ventilation (PPV) should be avoided<\/strong> as it may cause massive surgical emphysema. <strong>HFNO<\/strong> may be useful at low flows (20 - 40L/min).<\/li>\n<li>Standard DAS difficult airway guidelines are rarely appropriate in this situation where PPV and surgical cricothyroidotomy may be unsuccessful or worsen the injury.<\/li>\n<li>In preparation for airway soiling have the following prepared:<ul>\n<li><strong>2x Suction<\/strong> – 1 connected to ambuscope; 1 connected to yankauer<\/li>\n<li><strong>2x 20ml syringe<\/strong> each containing <strong>dilute adrenaline<\/strong> (10mcg/ml) + <strong>Tranexamic Acid<\/strong> 500mg for injecting down the ambuscope.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Failure of this technique should be followed by immediate tracheostomy<\/strong><\/li>\n<\/ul>\n<h3>Plan B – Surgical tracheostomy<\/h3>\n<ul>\n<li>Prepare equipment and personnel prior to any attempts at intubation.<\/li>\n<li>FONA via the cricothyroid membrane is often inappropriate or impossible due to distorted anatomy. Advancing bougies or an ETT blindly may lead to the creation of a false passage.<\/li>\n<li>Where time, equipment and expertise allow, <strong>awake surgical tracheostomy<\/strong> may be a preferential Plan A.<\/li>\n<\/ul><\/section>", "source": "Neck Injury CPG 2025.pdf"}, {"slug": "one-lung-ventilation", "title": "One Lung Ventilation", "group": "airway", "version": "2 (July 2025)", "effective": "1 July 2022", "review": "1 July 2028", "hidden": false, "aim": "To ensure Trauma Anaesthetists have a standardised approach to lung isolation and one lung ventilation in major trauma.", "objectives": ["Describe indications and double lumen tube (DLT) sizing.", "Describe technique of lung isolation.", "Describe approach to trouble shooting hypoxaemia on one lung ventilation (OLV)."], "footer": "", "related": [], "sections": [{"id": "s1", "title": "Key Principles"}, {"id": "s2", "title": "Indications for DLT & Lung Isolation"}, {"id": "s3", "title": "Double Lumen Tubes"}, {"id": "s4", "title": "Placing the DLT"}, {"id": "s5", "title": "Checking Isolation"}, {"id": "s6", "title": "Troubleshooting DLTs"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"one-lung-ventilation.s1\"><h2>Key Principles<\/h2>\n<ul>\n<li>Requirement for OLV is extremely rare in acute major trauma patients. Occasionally intra-thoracic access is surgically difficult or overwhelming lung leak from tracheo-bronchial injury necessitates this.<\/li>\n<li>DLT and OLV are more frequent in patients coming for urgent/ semi-elective VATS surgery.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"one-lung-ventilation.s2\"><h2>Indications for DLT &amp; Lung Isolation<\/h2>\n<ul>\n<li>For the acute setting there is very little clinical scenario that cannot be managed by placement of a <strong>LEFT<\/strong> sided DLT. Thereafter the non-injured side may be preferentially ventilated. Selective right main bronchus intubation can be done with a single lumen ETT in extremis.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"one-lung-ventilation.s3\"><h2>Double Lumen Tubes<\/h2>\n<figure><button aria-label=\"Enlarge figure: Double lumen tubes: indications, size and depth\" class=\"zoom\" data-cap=\"Double lumen tubes: indications, size and depth\" data-src=\"fig/olv-dlt.jpg\" type=\"button\"><img alt=\"Double lumen tubes: indications, size and depth\" loading=\"lazy\" src=\"fig/olv-dlt.jpg\"/><\/button><figcaption>Double lumen tubes: indications, size and depth<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<p><strong>Do you need a DLT?<\/strong><\/p>\n<ul>\n<li>Surgical access requires it?<\/li>\n<li>Broncho-pleural fistula?<\/li>\n<li>Pulmonary haemorrhage?<\/li>\n<li>Purulent lung pathology?<\/li>\n<\/ul>\n<p><strong>DLT size?<\/strong><\/p>\n<div class=\"tbl stack\"><table>\n<thead>\n<tr>\n<th>Female<\/th>\n<th>Male<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Female\">&lt;1.5m = 35F<\/td>\n<td data-label=\"Male\">&lt;1.6m = 37F<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Female\">&lt;1.6m = 37F<\/td>\n<td data-label=\"Male\">&lt;1.7m = 39F<\/td>\n<\/tr>\n<tr>\n<td data-label=\"Female\">&gt;1.6m = 39F<\/td>\n<td data-label=\"Male\">&gt;1.7m = 41F<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Depth?<\/strong><\/p>\n<ul>\n<li>1.7-1.8m = 29cm @ incisors<\/li>\n<li>+/- 1cm for every 10cm difference<\/li>\n<li>e.g. 1.6m = 28cm<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"one-lung-ventilation.s4\"><h2>Placing the DLT<\/h2>\n<figure><button aria-label=\"Enlarge figure: DLT insertion sequence\" class=\"zoom\" data-cap=\"DLT insertion sequence\" data-src=\"fig/olv-insertion.jpg\" type=\"button\"><img alt=\"DLT insertion sequence\" loading=\"lazy\" src=\"fig/olv-insertion.jpg\"/><\/button><figcaption>DLT insertion sequence<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<ol>\n<li>Turn the AP curve of the DLT to face laterally and direct the bronchial lumen through the vocal cords; then pause<\/li>\n<li>Seek assistance from the ODP to remove the stylet<\/li>\n<li>Turn DLT to neutral and advance to correct depth in a single smooth movement<\/li>\n<li>Join the DLT via the Y-connector to the anaesthetic circuit<\/li>\n<\/ol>\n<aside class=\"callout\">\n<p>Over correcting by 90<sup>O<\/sup> (tube at 9o’clock position) is usually helpful at this point before advancing to the correct depth. At depth, turn tube back to neutral.<\/p>\n<\/aside>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"one-lung-ventilation.s5\"><h2>Checking Isolation<\/h2>\n<p><strong>Bag ventilate, check that you are in the trachea:<\/strong>\nBilateral chest expansion, Et CO<sub>2<\/sub>, misting? If yes, then with the assistant holding the DLT secure at the correct depth. Next, inflate the tracheal cuff until leak disappears at the mouth (using 10ml syringe). Bag ventilate and auscultate.<\/p>\n<p><strong>Now check side-to side isolation:<\/strong><\/p>\n<ol>\n<li>Clamp tracheal lumen on the Y-connector in a downwards direction, and open venting cap<\/li>\n<li>Inflate bronchial cuff (in 0.5ml increments, max 2-3ml) until step change decrease in leak/no leak felt<\/li>\n<li>Chest expansion/breath sounds heard only on L<\/li>\n<li>Switch the clamp to the bronchial lumen, open cap, close tracheal lumen cap<\/li>\n<li>Chest expansion/breath sounds should now only be evident on the contralateral side<\/li>\n<\/ol>\n<figure><button aria-label=\"Enlarge figure: Checking isolation; bronchoscopic view of the carina\" class=\"zoom\" data-cap=\"Checking isolation; bronchoscopic view of the carina\" data-src=\"fig/olv-photos.jpg\" type=\"button\"><img alt=\"Checking isolation; bronchoscopic view of the carina\" loading=\"lazy\" src=\"fig/olv-photos.jpg\"/><\/button><figcaption>Checking isolation; bronchoscopic view of the carina<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<p><strong>Bronchoscopic check: supine &amp; reconfirm in the lateral position:<\/strong><\/p>\n<ul>\n<li>Pass bronchoscope down tracheal lumen to view bifurcation<\/li>\n<li>Confirm anterior/posterior trachea and left vs. right bronchus<\/li>\n<li>Optimal to see a small rim of blue bronchial cuff at the carina<\/li>\n<li>Take a mental snap shot of this view for a quick assessment of subsequent change in the tube’s position<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s6\" id=\"one-lung-ventilation.s6\"><h2>Troubleshooting DLTs<\/h2>\n<figure><button aria-label=\"Enlarge figure: Troubleshooting DLTs: one lung ventilation and malposition\" class=\"zoom\" data-cap=\"Troubleshooting DLTs: one lung ventilation and malposition\" data-src=\"fig/olv-trouble.jpg\" type=\"button\"><img alt=\"Troubleshooting DLTs: one lung ventilation and malposition\" loading=\"lazy\" src=\"fig/olv-trouble.jpg\"/><\/button><figcaption>Troubleshooting DLTs: one lung ventilation and malposition<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<h3>One Lung Ventilation<\/h3>\n<ul>\n<li>Lung protective: ~ 3 ml/kg on OLV<\/li>\n<li>PEEP 5-8 cmH2O is helpful in most cases<\/li>\n<li>Stay on FiO<sub>2<\/sub> 1.0 until 15-20 min after commencing OLV, then wean to 0.6<\/li>\n<li>Deflate the bronchial cuff when OLV is no longer required<\/li>\n<\/ul>\n<h3>HYPOXAEMIA: SpO<sub>2<\/sub> &lt; 88%<\/h3>\n<p><em>(as a guide, this may vary case-to-case)<\/em><\/p>\n<ol>\n<li><strong>Immediate action<\/strong><ul>\n<li>Hand ventilate with 100% O<sub>2<\/sub>. This allows you to check:<ul>\n<li>The circuit is patent<\/li>\n<li>The compliance – is the upper lobe obstructed?<\/li>\n<\/ul>\n<\/li>\n<li>Suction<\/li>\n<li>Recruitment manoeuvre – helpful after lateral positioning &amp; suction<\/li>\n<\/ul>\n<\/li>\n<li><strong>Ventilated lung (V/Q mismatch)<\/strong><ul>\n<li>Increase FiO<sub>2<\/sub> to 0.6 – 1.0<\/li>\n<li>Increase minute volume<\/li>\n<li>Bronchoscope to check upper lobe orifice is not obstructed<\/li>\n<li>Improve perfusion: fluids, vasopressors<\/li>\n<\/ul>\n<\/li>\n<li><strong>Non-ventilated lung (shunt)<\/strong><ul>\n<li>Bronchoscope to check upper lobe<\/li>\n<li>Intermittently ventilate – discuss with the surgical team<\/li>\n<li>Clamp pulmonary artery<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<h3>Malposition<\/h3>\n<ul>\n<li>Tube down incorrect side i.e. L-sided DLT in RIGHT main bronchus<\/li>\n<li>Bronchial cuff herniation because DLT position is not deep enough<\/li>\n<li>DLT too deep<\/li>\n<\/ul>\n<h3>Ongoing management<\/h3>\n<ul>\n<li>Ventilated lung: Utilise frequent recruitment manoeuvres, adjust PEEP and allow permissive hypercapnia if physiology will allow.<\/li>\n<li>Non-ventilated lung: Passive insufflation of oxygen or CPAP (1-5cmH<sub>2<\/sub>O) may be administered via a Waters circuit from the external oxygen supply of the anaesthetic machine if significant hypoxaemia.<\/li>\n<\/ul><\/section>", "source": "One Lung Ventilation CPG 2025.pdf"}, {"slug": "elderly-trauma", "title": "Elderly Trauma", "group": "populations", "version": "2.0 (reviewed July 2025)", "effective": "1 May 2021", "review": "1 July 2028", "hidden": false, "aim": "To outline the approach to trauma management principles in the elderly patient.", "objectives": ["Describe unique considerations for trauma in elderly patients.", "Describe key management principles for elderly trauma.", "Review specific injury profiles and considerations.", "Highlight considerations in acutely delirious trauma patients."], "footer": "", "related": [{"name": "Rib Fractures CPG", "slug": "rib-fractures"}, {"name": "Spinal Cord Injury CPG", "slug": "spinal-cord-injury"}, {"name": "Anticoagulation Reversal CPG", "slug": null}, {"name": "Analgesia for Trauma CPG", "slug": null}], "sections": [{"id": "s1", "title": "Considerations in Elderly Trauma"}, {"id": "s2", "title": "Specific Physiology & Comorbidity"}, {"id": "s3", "title": "Perioperative Management Key Principles"}, {"id": "s4", "title": "UNSTABLE C-Spine"}, {"id": "s5", "title": "Poly-pharmacy"}, {"id": "s6", "title": "Delirium"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"elderly-trauma.s1\"><h2>Considerations in Elderly Trauma<\/h2>\n<ul>\n<li>Adults &gt; 65 years-old; may also apply to younger, but frail patients.<\/li>\n<li>Patients are at a higher risk of morbidity and mortality.<\/li>\n<li>Ageing, comorbidity and medications affect presentation and physiology.<\/li>\n<\/ul>\n<aside class=\"callout\">\n<p><strong>INJURY MECHANISM:<\/strong><br/><strong>Minor mechanisms cause major trauma to the head, spine, chest and pelvis.<\/strong><\/p>\n<p>Falls from standing constitute the most common cause of trauma and related deaths.<\/p>\n<p><strong>The trauma may be the result of an underlying medical event.<\/strong><\/p>\n<\/aside>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"elderly-trauma.s2\"><h2>Specific Physiology &amp; Comorbidity<\/h2>\n<p><strong>Chest:<\/strong> Trauma is higher mortality/morbidity due to poor functional reserve, increased chest wall rigidity, loss of muscle mass, reduced gas exchange and altered central responses to hypoxia and hypercarbia.<\/p>\n<p><strong>CVS:<\/strong> Standard “abnormal” parameters of shock physiology are not always applicable:<\/p>\n<ul>\n<li><strong>Systolic BP &lt; 110 – suspicious for shock,<\/strong> particularly in a poorly controlled hypertensive.<\/li>\n<li><strong>HR &gt; 90 suspicious for shock,<\/strong> especially if beta-blocked.<\/li>\n<li>Shock is less well tolerated, and hypotension may be exaggerated.<\/li>\n<li>Significant CVS disease in 50-65% of patients.<\/li>\n<\/ul>\n<p><strong>Musculoskeletal:<\/strong> Long lie is common, leading to dehydration, hypothermia and renal failure; check CK. Increased risk of <strong>hypothermia<\/strong>.<\/p>\n<p><strong>Neurological:<\/strong> Cerebral atrophy increases potential space in skull → bleeding may go unnoticed. Repeated assessment and lower threshold for CT head. At risk of delirium.<\/p>\n<p><strong>Practical:<\/strong> Do not lose glasses, dentures or hearing aids! They are difficult to replace and jeopardise return to function, early rehab and delay discharge.<\/p>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"elderly-trauma.s3\"><h2>Perioperative Management Key Principles<\/h2>\n<h3>Pre-op<\/h3>\n<p><strong>Trauma and medical assessment:<\/strong><\/p>\n<ul>\n<li>Review imaging for additional injuries.<\/li>\n<li>Review mobilisation and stability of spine and pelvis.<\/li>\n<li>Assess and optimise any immediate medical issues or comorbidities.<\/li>\n<li>Consider risk assessment tool: NSQIP, P-Possum, SORT, Nottingham hip score.<\/li>\n<\/ul>\n<p><strong>Medications:<\/strong><\/p>\n<ul>\n<li><strong>Has anticoagulation been reversed if indicated?<\/strong> Consider early anticoagulant reversal for patients with known or suspected haemorrhage.<\/li>\n<\/ul>\n<p><strong>Early MDT involvement:<\/strong><\/p>\n<ul>\n<li>RLH has a <strong>TPOPS Service<\/strong> (Trauma &amp; Perioperative Older Persons Service). They routinely see trauma patients &gt;65 years during rounds on Mon/Wed/Fri.<\/li>\n<li>TPOPS are available for urgent input on <strong>Dect Phone 45703<\/strong>.<\/li>\n<li>If unavailable, consider the on-call medical registrar.<\/li>\n<\/ul>\n<p><strong>Treatment escalation plan:<\/strong><\/p>\n<ul>\n<li>Documented decisions for CPR and level of escalation.<\/li>\n<li>Ensure patient and family involvement<\/li>\n<li>If <strong>Anaesthesia + DNACPR<\/strong>, DNACPR is normally reversed for immediately reversible causes. (Discuss at time of consent).<\/li>\n<\/ul>\n<h3>Intra-op<\/h3>\n<p><strong>Type of anaesthesia:<\/strong><\/p>\n<ul>\n<li>Less important than care taken in maintaining homeostatic physiology.<\/li>\n<li><strong>Arm-brain time is prolonged, flush drugs and be patient, in order to avoid overdose.<\/strong><\/li>\n<li>Regional anaesthesia, without GA or deep sedation may enhance recovery/reduce complications.<\/li>\n<li>Consider early regional blocks/catheters, e.g. for rib fractures, lower limb, neck of femur fracture.<\/li>\n<\/ul>\n<p><strong>Monitoring/Drips/Tubes/Practical:<\/strong><\/p>\n<ul>\n<li>Low threshold for arterial line and depth of anaesthesia monitoring.<\/li>\n<li>Monitor temperature and warm actively.<\/li>\n<li>Urinary catheters should be avoided unless necessary (increased risk of UTI, delirium and increased length of stay).<\/li>\n<li>Higher risk for pressure areas: meticulous padding.<\/li>\n<li>Avoid sedative medications, or those that can precipitate delirium e.g. midazolam, clonidine, atropine, high dose ketamine, cyclizine.<\/li>\n<\/ul>\n<h3>Post-op<\/h3>\n<ul>\n<li>Lower threshold for level 2 admission; 12 D trauma unit for complex trauma.<\/li>\n<li>Ensure regular analgesics (pain can often go undertreated), antiemetics, and laxatives are prescribed.<\/li>\n<li>Ensure patients are eating, drinking and moving.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"elderly-trauma.s4\"><h2>UNSTABLE C-Spine<\/h2>\n<p>Hard collar should be changed for soft Miami J/similar once injury confirmed.<\/p>\n<p>Patients unable to tolerate C-spine immobilisation (e.g. dementia) should be managed with a ‘minimal movement’ approach:<\/p>\n<ul>\n<li>Comfort optimisation with proper fitting collar<\/li>\n<li>Assessment and management of contributors to delirium<\/li>\n<li>Assessment of risks/benefits of immobilization and sedation<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"elderly-trauma.s5\"><h2>Poly-pharmacy<\/h2>\n<p>Most routine medications can continue, beware of oral hypoglycaemics and antihypertensives if low BP, or anticipated major bleeding.<\/p>\n<div class=\"tbl kv\"><table>\n<thead>\n<tr>\n<th>Medication<\/th>\n<th>Consideration<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Beta blockers<\/td>\n<td>May obtund/ mask response to injury<\/td>\n<\/tr>\n<tr>\n<td>ACEi/ ARB’s<\/td>\n<td>May worsen shock or reduce effectiveness of therapy<\/td>\n<\/tr>\n<tr>\n<td>Steroids<\/td>\n<td>May require replacement and affect response to trauma<\/td>\n<\/tr>\n<tr>\n<td>Anticholinergics<\/td>\n<td>May cause agitation or confusion (cyclizine, ketamine)<\/td>\n<\/tr>\n<tr>\n<td>Opioids/ BZO’s<\/td>\n<td>May have exaggerated effects – dose with caution<\/td>\n<\/tr>\n<tr>\n<td>Anti-Parkinson<\/td>\n<td>Omission may worsen symptoms<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sid=\"s6\" id=\"elderly-trauma.s6\"><h2>Delirium<\/h2>\n<p>Delirium: clinical condition characterised by acute and fluctuant course of disturbed consciousness and cognitive function. Sleep disturbance or hallucinations may be present. Exists as hypo-/hyper-active or both.<\/p>\n<p>Up to 50% of patients develop delirium after trauma/surgery. 4AT is a screening test that helps detect delirium.<\/p>\n<div class=\"tbl kv\"><table>\n<tbody>\n<tr>\n<td><strong>Major risk factors<\/strong><\/td>\n<td>Older, frailer, cognitive impairment, severe trauma or medical illness, hip fracture, previous delirium.<\/td>\n<\/tr>\n<tr>\n<td><strong>De-escalation<\/strong><\/td>\n<td><strong>Non pharmacological:<\/strong><br/>• Patients are often terrified, provide repeated reorientation.<br/>• Optimise a reassuring and calming environment e.g. side bed, curtains, same language staff or language line.<br/>• Consider inviting relatives to recovery.<br/>• Replace teeth, glasses, hearing aids<br/><strong>Pharmacological:<\/strong><br/>• Only if conservative measures have failed, and patient is a risk to self or staff/can’t comply with treatment. Start small and titrate.<br/>• 1st line: Haloperidol 0.5mg IV / IM (CI: prolonged QT, Parkinson’s, Lewy body dementia)<br/>• 2nd line: Lorazepam 0.5mg IV / IM<\/td>\n<\/tr>\n<tr>\n<td><strong>Causes<\/strong><\/td>\n<td>• Hypoxia &amp; hypercapnia<br/>• Infection: e.g. pneumonia<br/>• Hypotension, anaemia (Hb &lt; 90 g/l)<br/>• Organ ischaemia (e.g. heart, brain, GI tract)<br/>• Pain<br/>• Drugs, constipation, urinary retention<br/>• Hyper/hypothermia<br/>• Dehydration/hunger/hypoglycaemia<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/section>", "source": "Elderly Trauma CPG 2025.pdf"}, {"slug": "pregnant-trauma", "title": "Pregnant Trauma", "group": "populations", "version": "2.0 (reviewed July 2025)", "effective": "1 May 2021", "review": "1 July 2028", "hidden": false, "aim": "To ensure all pregnant trauma patients receive safe and effective anaesthesia and resuscitation.", "objectives": ["Highlight relevant anatomy and imaging considerations in pregnant trauma.", "Describe specific differences relevant to pregnant trauma resuscitation.", "Clarify indications for peri-mortem Caesarean section."], "footer": "", "related": [{"name": "Difficult Airway & OMFS Trauma CPG", "slug": "difficult-airway"}, {"name": "Code Red CPG", "slug": "code-red"}, {"name": "Vascular Access CPG", "slug": "vascular-access"}, {"name": "Emergency Department RSI CPG", "slug": "ed-rsi"}], "sections": [{"id": "s1", "title": "General Information"}, {"id": "s2", "title": "Relevant Anatomy"}, {"id": "s3", "title": "Imaging in Pregnant Trauma"}, {"id": "s4", "title": "Foetal Assessment"}, {"id": "s5", "title": "Pregnant Trauma Resuscitation"}, {"id": "s6", "title": "Peri-mortem Caesarean Section"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"pregnant-trauma.s1\"><h2>General Information<\/h2>\n<ul>\n<li>Pregnancy itself is an independent predictor for mortality after trauma. (1.6x increased risk for death)<\/li>\n<li>Rate of fetal loss approaches 40-50% in life threatening trauma.<\/li>\n<li>Obstetric and neonatal teams may be unfamiliar with the Emergency Department or Theatre environments and current major trauma clinical practice.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"pregnant-trauma.s2\"><h2>Relevant Anatomy<\/h2>\n<div class=\"tbl kv\"><table>\n<thead>\n<tr>\n<th>Gestation<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>&lt;12 weeks<\/strong><\/td>\n<td>Uterus is intra-pelvic organ<\/td>\n<\/tr>\n<tr>\n<td><strong>±20 weeks<\/strong><\/td>\n<td>Fundus is at height of the umbilicus<\/td>\n<\/tr>\n<tr>\n<td><strong>34 – 36 weeks<\/strong><\/td>\n<td>Fundus is at height of costal margin. Bowel is pushed cephalad. Uterus is thin walled and elastic. Inelastic placenta makes it vulnerable to shear forces at utero-placental interface (abruption).<\/td>\n<\/tr>\n<tr>\n<td><strong>&gt;36 weeks<\/strong><\/td>\n<td>Foetal descent into pelvis, head usually presenting. Pelvic fracture may result in foetal skull fracture.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"pregnant-trauma.s3\"><h2>Imaging in Pregnant Trauma<\/h2>\n<h3>Ultrasound<\/h3>\n<ul>\n<li>FAST is appropriate during initial resuscitation but is limited by advancing pregnancy.<\/li>\n<li>Do not delay a CT (if indicated) for a FAST.<\/li>\n<li>FAST is poor at detection of abruption.<\/li>\n<\/ul>\n<h3>Conventional Radiology &amp; CT scans<\/h3>\n<ul>\n<li><strong>Do Not avoid<\/strong> conventional X-rays or CT in pregnant patients.<\/li>\n<li>The dose of ionizing radiation used in trauma evaluation is well below dosage thresholds known to cause harm to the foetus.<\/li>\n<li>Iodinated contrast is safe in pregnancy.<\/li>\n<li>MRI is safe at any stage of pregnancy, but gadolinium should only be used if considered absolutely necessary.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"pregnant-trauma.s4\"><h2>Foetal Assessment<\/h2>\n<ul>\n<li>Assessment of a viable foetus <strong>(&gt;23 weeks)<\/strong> should be initiated immediately following or in parallel with the physical examination of the stabilised mother.<\/li>\n<li>Identification of impending foetal injury, death from utero-placental compromise or trauma-related complications (abruption, pre-term delivery, spontaneous rupture of membranes, foetal injuries, foetal demise) is the aim.<\/li>\n<li>In-utero resuscitation includes <strong>supplemental O<sub>2<\/sub>, IV volume replacement, left lateral positioning.<\/strong><\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"pregnant-trauma.s5\"><h2>Pregnant Trauma Resuscitation<\/h2>\n<aside class=\"callout\">\n<p><strong>IN ALL DECISION MAKING, THE NEEDS OF THE MOTHER HAVE PRIMACY<\/strong><\/p>\n<p><strong>Best treatment for the foetus is optimal resuscitation of the mother &amp; early foetal assessment<\/strong><\/p>\n<\/aside>\n<div class=\"tbl stack\"><table>\n<thead><tr><th><\/th><th>Pregnancy Variation<\/th><th>Resuscitation Adaptation<\/th><\/tr><\/thead>\n<tbody>\n<tr><th class=\"rowh\">Airway<\/th><td data-label=\"Pregnancy Variation\"><ul><li>Rapid desaturation<\/li><li>Increased aspiration risk<\/li><li>Increased vascularity/oedema of airway mucosa<\/li><li>Difficult laryngoscopy<\/li><li>Difficult FONA<\/li><\/ul><\/td><td data-label=\"Resuscitation Adaptation\"><ul><li>Consider HFNO<sub>2<\/sub><\/li><li>Consider video laryngoscope<\/li><li>Place gastric tube orally (epistaxis risk)<\/li><li>Use longitudinal incision for FONA<\/li><\/ul><\/td><\/tr>\n<tr><th class=\"rowh\">Breathing<\/th><td data-label=\"Pregnancy Variation\"><ul><li>Diaphragm elevated ~5cm<\/li><li>Thoracic trauma may risk intra-abdominal injury<\/li><li>Increased O<sub>2<\/sub> consumption<\/li><li>Low EtCO<sub>2<\/sub> is normal<\/li><\/ul><\/td><td data-label=\"Resuscitation Adaptation\"><ul><li>Intercostal drains should be placed higher than normal (3<sup>rd<\/sup>/4<sup>th<\/sup> intercostal space)<\/li><li>Low threshold for concern around thoraco-abdominal injuries<\/li><\/ul><\/td><\/tr>\n<tr><th class=\"rowh\">Circulation<\/th><td data-label=\"Pregnancy Variation\"><ul><li>Large cardiac reserve (increased CO, dilutional anaemia, increased blood volume) will mask bleeding but collapse will be precipitous<\/li><li>Aortocaval compression reduces CO by ~ 30%<\/li><li>Utero-placental perfusion depends on maternal MAP and sensitive to catecholamines<\/li><\/ul><\/td><td data-label=\"Resuscitation Adaptation\"><ul><li>Vital signs are a poor marker of haemodynamic stability<\/li><li>Minimise aortocaval compression with 15-30<sup>O<\/sup> left lateral tilt or left uterine displacement<\/li><li>Place early foetal monitoring (foetal compromise may be the first sign of maternal bleeding)<\/li><\/ul><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"tbl kv\"><table>\n<tbody>\n<tr>\n<td><strong>CPR<\/strong><\/td>\n<td>• Drugs for cardiac arrest as per ALS algorithm – do not adjust doses<br/>• CPR done best in supine position with manual uterine displacement (pull rather than push)<br/>• Resuscitative hysterotomy as soon as possible after onset of maternal cardiac arrest<\/td>\n<\/tr>\n<tr>\n<td><strong>Haematology<\/strong><\/td>\n<td>• Emergency O negative blood<br/>• In pregnancy there is increased fibrinogen and D-Dimers and decreased PT, PTT, and platelets<br/>• Increased propensity to develop coagulopathy which can be precipitated by trauma, abruption, and amniotic fluid embolus<br/>• Use ROTEM to guide resuscitation. Obstetric ROTEM algorithm is available but if unable to locate use regular adult algorithm<\/td>\n<\/tr>\n<tr>\n<td><strong>Antibiotics<\/strong><\/td>\n<td>• If pre-delivery: Cefuroxime 1.5g/Metronidazole 500mg<br/>• If post-delivery: Co-Amoxiclav 1.2g<br/>• Penicillin allergy: Clindamycin 600mg<\/td>\n<\/tr>\n<tr>\n<td><strong>Uterotonics<\/strong><\/td>\n<td>• Oxytocin 2 – 5IU slow IV push (side effects: transient hypotension, tachycardia) followed by infusion 40IU in 500ml saline over 4 hours<br/>• Ergometrine 500mcg IM (side effects: hypertension)<br/>• Hemabate (carboprost) 250mcg IM (side effects: bronchospasm); can be repeated every 15 minutes, max total = 8 doses (2mg)<br/>• Misoprostol 800mcg PV<br/>• Note that uterotonics may not be available in Main Theatres and may need to be sourced from the Obstetric Theatres (6<sup>th<\/sup> floor)<\/td>\n<\/tr>\n<tr>\n<td><strong>Analgesia<\/strong><\/td>\n<td>• Avoid NSAIDs or Codeine<\/td>\n<\/tr>\n<tr>\n<td><strong>Key Staff<\/strong><\/td>\n<td>• <strong>Emergency Call<\/strong>: <strong>2222<\/strong>, declare ‘Maternal Cardiac Arrest’ + location<br/>• <strong>Obstetric consultant: 45635<\/strong><br/>• <strong>Neonatal team: 45666<\/strong> (consultant); <strong>45853<\/strong> (SpR)<br/>• <strong>Labour Ward coordinator: 45636<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sid=\"s6\" id=\"pregnant-trauma.s6\"><h2>Peri-mortem Caesarean Section<\/h2>\n<div class=\"tbl stack\"><table>\n<thead>\n<tr>\n<th>Indications<\/th>\n<th>Contraindications<\/th>\n<th>Important Details<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Indications\">• Gestation &gt; 20 weeks<br/>• No ROSC after 4 minutes of correctly performed CPR<\/td>\n<td data-label=\"Contraindications\">• Gestation &lt; 20 weeks<br/>• Arrest &gt; 30 minutes<br/>• Early ROSC<\/td>\n<td data-label=\"Important Details\">• Do not delay based on lack of access to kit – scalpel is all that is required<br/>• Vertical skin and horizontal uterine incisions are quickest<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/section>", "source": "Pregnant Trauma CPG 2025.pdf"}, {"slug": "drowning-hypothermia", "title": "Drowning and Hypothermia", "group": "populations", "version": "2 (reviewed July 2025)", "effective": "1 July 2022", "review": "1 July 2028", "hidden": false, "aim": "To provide an overview of the in-hospital management of non-fatal drowning patients and of hypothermia.", "objectives": ["To clarify the definitions around drowning.", "To describe the relevant pathophysiology of drowning.", "To highlight core management principles of non-fatal drowning & associated hypothermia."], "footer": "", "related": [{"name": "Anaelgesia for Trauma CPG", "slug": null}, {"name": "Emergency Department RSI CPG", "slug": "ed-rsi"}], "sections": [{"id": "s1", "title": "Terminology"}, {"id": "s2", "title": "Pathophysiology"}, {"id": "s3", "title": "Key Principles of Relevance"}, {"id": "s4", "title": "Drowning Management Principles"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"drowning-hypothermia.s1\"><h2>Terminology<\/h2>\n<aside class=\"callout\">\n<p><strong>Drowning<\/strong> is the process of experiencing respiratory impairment due to submersion or immersion in liquid.<\/p>\n<\/aside>\n<ul>\n<li>The following terms should <strong>not<\/strong> be used to categorise drowning patients and events: near, wet, dry, active, passive, salt-water, freshwater, or secondary.<\/li>\n<li>The distinction between salt water and freshwater drowning is no longer considered clinically relevant.<\/li>\n<li>If the person is rescued and the process of drowning is interrupted, this is termed a <strong>non-fatal drowning<\/strong>.<\/li>\n<li>If the person dies as a result of drowning, this is termed a <strong>fatal drowning<\/strong>.<\/li>\n<li>Any submersion or immersion incident without evidence of respiratory impairment should be considered a <strong>water rescue<\/strong> and not a drowning.<\/li>\n<li><strong>Hypothermia<\/strong> is the pathological state in which the core body temperature falls below <strong>35<sup>o<\/sup>C.<\/strong><\/li>\n<\/ul>\n<div class=\"tbl kv\"><table>\n<thead>\n<tr>\n<th>Grade<\/th>\n<th>Core temperature<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Mild<\/td>\n<td>32 – 35<sup>o<\/sup>C<\/td>\n<\/tr>\n<tr>\n<td>Moderate<\/td>\n<td>28 – 32<sup>o<\/sup>C<\/td>\n<\/tr>\n<tr>\n<td>Severe<\/td>\n<td>20 – 28<sup>o<\/sup>C<\/td>\n<\/tr>\n<tr>\n<td>Profound<\/td>\n<td>&lt; 20<sup>o<\/sup>C<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"drowning-hypothermia.s2\"><h2>Pathophysiology<\/h2>\n<ul>\n<li>Drowning begins with breath-holding which may be followed by a period of laryngospasm secondary to the presence of liquid in the oro-pharynx. This is associated with hypercarbia, hypoxaemia, and acidosis.<\/li>\n<li>Hypercarbia stimulates respiration, leading to active respiratory movements. The laryngeal spasm abates due to hypoxia and the victim inhales liquid.<\/li>\n<li>Fluid aspiration initiates an acute lung injury (ALI). Inhaled toxins including chlorine, pollutants, and particulate material may further contribute to pulmonary injury.<\/li>\n<li>In non-fatal drowning the clinical picture is hypoxaemia secondary to ALI/ARDS.<\/li>\n<li>Hydrostatic pressure of water on the body increases venous return and cardiac output. Loss of this pressure effect when exiting the water causes venous pooling and circulatory collapse. Patients should be extricated in a horizontal position.<\/li>\n<li>Vomiting and aspiration is a frequent complication.<\/li>\n<li>Volume and electrolyte disturbances may further contribute to instability.<\/li>\n<\/ul>\n<aside class=\"callout\">\n<p>Full neurologic recovery rarely happens if &gt; 10 minutes of normothermic submersion or &gt; 40 minutes of hypothermic submersion.<\/p>\n<\/aside>\n<ul>\n<li>Rapid onset hypothermia is protective. However, in the UK temperatures low enough to achieve this even in mid-winter are unlikely.<\/li>\n<li>Water is thermally neutral (± 33<sup>o<\/sup>C). Most patients will drown in water at a temperature lower than this, thus concomitant hypothermia is common in drowning.<\/li>\n<li>Reversal of hypothermia is paramount in initial resuscitation of a drowning patient.<\/li>\n<li>Many ALS interventions are ineffective with low core body temperatures, including pacing, atropine and defibrillation. Follow RESUS guidelines in hypothermia.<\/li>\n<\/ul>\n<figure><button aria-label=\"Enlarge figure: Pathophysiology of drowning: immersion or submersion to ARDS\" class=\"zoom\" data-cap=\"Pathophysiology of drowning: immersion or submersion to ARDS\" data-src=\"fig/drown-patho.jpg\" type=\"button\"><img alt=\"Pathophysiology of drowning: immersion or submersion to ARDS\" loading=\"lazy\" src=\"fig/drown-patho.jpg\"/><\/button><figcaption>Pathophysiology of drowning: immersion or submersion to ARDS<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"drowning-hypothermia.s3\"><h2>Key Principles of Relevance<\/h2>\n<ul>\n<li>There is a <strong>high incidence of associated injuries<\/strong> in victims of drowning. <strong>Head and cervical spine<\/strong> injuries are particularly common in patients rescued from shallow water.<ul>\n<li>Treatment of a toddler drowning (&lt;5 years) should focus on airway/ breathing management (low risk of spinal or associated trauma).<\/li>\n<li>Adults &amp; teenagers have the highest occurrence of spinal injuries (higher mechanisms of injury and increased risk factors).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<aside class=\"callout\">\n<p>Patients who are asymptomatic and have no evidence of respiratory compromise (no CXR changes or hypoxia on ABG) after 6 – 8 hours may be safely discharged home.\n<strong>All symptomatic patients should be admitted for observation.<\/strong><\/p>\n<\/aside>\n<h3>POOR PROGNOSTIC FACTORS:<\/h3>\n<div class=\"tbl stack\"><table>\n<thead>\n<tr>\n<th>Prehospital<\/th>\n<th>Emergency Dept<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Prehospital\">• Immersion &gt; 10 min<br/>• Delay to CPR<br/>• Water temperature<br/>• Cardiac arrest upon<br/>• Identifiable medical precipitants<\/td>\n<td data-label=\"Emergency Dept\">• Asystole<br/>• CPR &gt; 25 minutes<br/>• Dilated pupils &amp; pH &lt;7.0<br/>• Dilated pupils, GCS &lt; 5<br/>• High lactate<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Antiarrhythmics should be withheld for core temperatures of <strong>&lt; 30 °C<\/strong>.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"drowning-hypothermia.s4\"><h2>Drowning Management Principles<\/h2>\n<ul>\n<li>Advanced Trauma Call<\/li>\n<li>Prepare to treat hypothermia: Bair hugger, Inditherm, Fluid Warmer, <strong>ECMO Alert<\/strong><\/li>\n<li>Primary Survey and Imaging as directed by the Trauma Team Leader (TTL)<\/li>\n<\/ul>\n<div class=\"tbl kv\"><table>\n<tbody>\n<tr>\n<td><strong>C-Spine Control<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Low risk of C-spine injury (~0.5%) unless: history of high energy mechanism or other traumatic injuries<\/td>\n<td>Type of water is irrelevant<\/td>\n<\/tr>\n<tr>\n<td><strong>Airway and Breathing<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Early intubation if obtunded, respiratory failure or risk of aspiration<br/>RSI ± MILS<\/td>\n<td>Lung Protective Ventilation<br/>Decompress the stomach via <strong>NG<\/strong> Tube<\/td>\n<\/tr>\n<tr>\n<td><strong>Circulation<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Treat Cardiac Arrest as per ALS/APLS<br/>Arrhythmias are common<br/>Arterial line/CVC context specific<br/>If &lt; 30<sup>o<\/sup>C: max 3x defibrillation attempts and hold cardiac arrest drugs<\/td>\n<td><strong>Active External Re-warming *<\/strong><br/>Warm environment, remove wet clothes, Bair Hugger &amp; blankets, Inditherm mattress<br/><strong>Active Internal Re-warming<\/strong><br/>Warmed IV infusions, RRT, warm cavity irrigation, ECMO<\/td>\n<\/tr>\n<tr>\n<td><strong>Disability<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Neuroprotective measures<br/>Correct Hypothermia to 32-34<sup>o<\/sup>C in arrest<br/>Prevent Hyperthermia<\/td>\n<td>No evidence for routine antibiotics or steroids<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"callout\">\n<p><strong>* In order to reduce ‘core temperature after-drop’ the trunk should be re-warmed BEFORE the extremities.<\/strong><\/p>\n<p><strong>After-drop<\/strong>: Cold, acidaemic blood from vasoconstricted extremities returns to core circulation causing drop in temperature and pH, with simultaneous peripheral vasodilation from re-warming (causing precipitous hypotension).<\/p>\n<\/aside><\/section>", "source": "Drowning and Hypothermia CPG 2025.pdf"}, {"slug": "rib-fractures", "title": "Rib Fractures", "group": "injuries", "version": "2 (reviewed July 2025)", "effective": "1 July 2022", "review": "1 July 2028", "hidden": false, "aim": "To ensure optimal and timely management of rib fracture patients.", "objectives": ["Describe approach to Initial management process", "Describe risk stratification scoring system", "Recommend formal and appropriate regional anaesthetic techniques"], "footer": "", "related": [{"name": "Elderly Trauma CPG", "slug": "elderly-trauma"}, {"name": "Analgesia for Trauma CPG", "slug": null}, {"name": "Ultrasound CPG", "slug": "ultrasound"}], "sections": [{"id": "s1", "title": "Key Principles"}, {"id": "s2", "title": "Initial Management"}, {"id": "s3", "title": "Risk Stratification"}, {"id": "s4", "title": "Regional Anaesthesia Catheters"}, {"id": "s5", "title": "Epidural Analgesia"}, {"id": "s6", "title": "Nerve Catheter"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"rib-fractures.s1\"><h2>Key Principles<\/h2>\n<p>Multimodal opioid sparing analgesia with an appropriate regional anaesthetic is the cornerstone of rib fracture treatment and there is evidence to support its use to reduce pain scores and minimise morbidity from respiratory complications. Good analgesia ensures patient compliance with physiotherapy and appropriate respiratory support. Patients should be risk stratified, cohorted and managed at an appropriate level of care. Surgical fixation may be considered in selected cases and is a multidisciplinary decision coordinated by the trauma surgeons.<\/p>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"rib-fractures.s2\"><h2>Initial Management<\/h2>\n<p><strong>Analgesia + VTE to begin in ED<\/strong><\/p>\n<p><strong>Single shot Serratus Anterior Block<\/strong> (&lt; 6 hours after initial imaging)<\/p>\n<ul>\n<li>Consider in all patients (inc. lateral and posterior fractures)<\/li>\n<li>Monitor observations post block for 30 minutes<\/li>\n<\/ul>\n<h3>Multimodal Analgesia<\/h3>\n<div class=\"tbl kv\"><table>\n<thead>\n<tr>\n<th>Tier<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Tier 1 (regular)<\/strong><\/td>\n<td>Oral paracetamol +/- ibuprofen; PRN oramorph or oxycodone<\/td>\n<\/tr>\n<tr>\n<td><strong>Tier 2<\/strong><\/td>\n<td>Consider PCA (1<sup>st<\/sup> line morphine, 2<sup>nd<\/sup> oxycodone, 3<sup>rd<\/sup> fentanyl)<\/td>\n<\/tr>\n<tr>\n<td><strong>Tier 3<\/strong><\/td>\n<td>Contact pain team/TAG for regional block if STUMBL &gt; 16<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"callout\">\n<p><strong>Analgesia is adequate when:<\/strong><\/p>\n<ul>\n<li>The patient can take deep breaths and cough,<\/li>\n<li>Comfortable mobilising in bed, pain score ≤ 4/10<\/li>\n<\/ul>\n<\/aside>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"rib-fractures.s3\"><h2>Risk Stratification<\/h2>\n<h3>STUMBL SCORE<\/h3>\n<div class=\"tbl kv\"><table>\n<thead>\n<tr>\n<th>Factor<\/th>\n<th>Points<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Age<\/td>\n<td>1 point for each decade<\/td>\n<\/tr>\n<tr>\n<td>Number of rib fractures<\/td>\n<td>3 points per rib fracture<\/td>\n<\/tr>\n<tr>\n<td>Anticoagulation pre injury<\/td>\n<td>Yes, + 4 points<\/td>\n<\/tr>\n<tr>\n<td>Chronic lung disease<\/td>\n<td>Yes, + 5 points<\/td>\n<\/tr>\n<tr>\n<td>Oxygen saturations<\/td>\n<td>&lt; 94% = 2 points<br/>89 – 85% = 4 points<br/>84 – 80% = 6 points<br/>79 – 75% = 8 points<br/>74 – 70% = 10 points<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"bands\">\n<div class=\"band band-low\"><b>Score &lt;10:<\/b> Discharge with TTA analgesia and advice<\/div>\n<div class=\"band band-mid\"><b>Score 11 – 25:<\/b> Admit under trauma; <b>16+ refer to TAG<\/b><\/div>\n<div class=\"band band-high\"><b>Score 26+ :<\/b> ACCU review for admission; <b>80% risk of complications<\/b><\/div>\n<\/div>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"rib-fractures.s4\"><h2>Regional Anaesthesia Catheters<\/h2>\n<p>Patients should be considered for placement of an indwelling LA catheter within 24h of admission.<\/p>\n<ul>\n<li>All patients in pain or with worsening respiratory function despite conventional strategies/PCA<\/li>\n<li>All patients deemed high risk (STUMBL score ≥16)<\/li>\n<li>Patients with a flail segment<\/li>\n<\/ul>\n<h3>CHOICE OF BLOCK:<\/h3>\n<div class=\"tbl kv\"><table>\n<thead>\n<tr>\n<th>Injury<\/th>\n<th>Block<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Unilateral chest wall injuries<\/td>\n<td>Erector Spinae Plane catheter or PVB catheter (depending on skillset)<\/td>\n<\/tr>\n<tr>\n<td>Unilateral chest wall injuries with no access to the patient’s back<\/td>\n<td>Serratus Anterior Plane catheter<\/td>\n<\/tr>\n<tr>\n<td>Bilateral chest wall injuries or extensive (&gt;5) unilateral fractures<\/td>\n<td>Thoracic epidural<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"rib-fractures.s5\"><h2>Epidural Analgesia<\/h2>\n<ul>\n<li>Patient must be accepted to ACCU prior to siting catheter.<\/li>\n<li>Epidurals should usually be placed in awake patients unless there are exceptional circumstances. An MDT discussion between ICU Consultant, Trauma Consultant and TAG Consultant should determine if this is in the patient’s best interest.<\/li>\n<li>These patients are at risk of haemodynamic collapse due to fluid restriction and profound sympathetic block.<\/li>\n<li>It is a minimum safety requirement to have ODP assistance and AAGBI monitoring.<\/li>\n<li>It is prudent to have 2 anaesthetists where possible. One to titrate IV analgesia and pressor and the other to do the procedure.<\/li>\n<li>Site epidural at a midpoint of injury or slightly cephalad.<\/li>\n<li>These patients are in severe pain, the shorter the procedure, the better for the patient, therefore ensure all kit is prepared and assembled prior to positioning.<\/li>\n<li>Fentanyl or Ketamine (titrated at 5-10mg boluses) can be used for positioning.<\/li>\n<li>Give a test dose (5-10 mls of 0.125% bupivacaine or levobupivacaine and wait ten minutes for lack of appreciable response (leg weakness, drop in blood pressure)).<\/li>\n<li>Then load with further 5-10 ml aliquots at ten minute intervals until adequate analgesia.<\/li>\n<li>Run epidural at a rate appropriate to number of levels being covered. i.e. 8-14 ml/hour at maximum levels. Use 0.1% bupivacaine or 0.125% levobupivacaine.<\/li>\n<li>Some patients may still need combination with a PCA.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s6\" id=\"rib-fractures.s6\"><h2>Nerve Catheter<\/h2>\n<p>Use a nerve catheter set you are most familiar with. Below is a diagram of a Pajunk SonoCurl Kit.<\/p>\n<figure><button aria-label=\"Enlarge figure: Pajunk SonoCurl kit: catheter, echogenic Tuohy needle, anchoring device, filter and adapter\" class=\"zoom\" data-cap=\"Pajunk SonoCurl kit: catheter, echogenic Tuohy needle, anchoring device, filter and adapter\" data-src=\"fig/rib-catheter.jpg\" type=\"button\"><img alt=\"Pajunk SonoCurl kit: catheter, echogenic Tuohy needle, anchoring device, filter and adapter\" loading=\"lazy\" src=\"fig/rib-catheter.jpg\"/><\/button><figcaption>Pajunk SonoCurl kit: catheter, echogenic Tuohy needle, anchoring device, filter and adapter<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<details class=\"figtext\"><summary>Diagram labels<\/summary>\n<ul><li>Catheter- they have an internal metal stylet that should be removed after insertion<\/li><li>Echogenic tuohy needle with extension- use a 20ml syringe for loss of resistance to avoid wasting local<\/li><li>Anchoring device- Filter fits on here-it is best to fit prior to placing on dermis<\/li><li>The catheter is designed to curl at the end to avoid migration<\/li><li>Filter<\/li><li>Adapter-make sure catheter is firmly pushed in before clipping shut<\/li><\/ul>\n<\/details>\n<ul>\n<li>These may be done US guided or US assisted to premark skin over the point of the transverse process<\/li>\n<li>Often these patients have disrupted anatomy (haematoma/surgical emphysema) and US images may be substandard<\/li>\n<li>If catheter does not thread you may still be partially on the costotransverse ligament, advance a few MM<\/li>\n<li>Do not thread more than 5cm into the space<\/li>\n<\/ul>\n<aside class=\"callout\">\n<ul>\n<li><strong>Most peripheral nerve blocks (inc. SAP, ESP, rectus sheath) are better managed by intermittent boluses<\/strong>, rather than <strong>with a continuous infusion.<\/strong><\/li>\n<li><strong>Note<\/strong>: pumps available at RLH have programmes that allow delivery of a variation of infusions (continuous, intermittent bolus, background + intermittent bolus).<\/li>\n<li>Be cautious when siting two catheters so as to not exceed maximum dose of LA.<\/li>\n<\/ul>\n<\/aside>\n<h3>Serratus Plane Block<\/h3>\n<ul>\n<li>These fascial plane blocks are ideal for anterior and lateral fractures particularly for immobilised patients with spinal precautions.<\/li>\n<li>All patients with rib fractures should be offered a single shot serratus plane block within 6 hours of admission. This can be done by the ED team if they are appropriately trained to do so.<\/li>\n<li>There are very few contraindications.<\/li>\n<li>An epidural catheter or any other catheter kit may be used.<\/li>\n<\/ul>\n<h3>Erector Spinae Block<\/h3>\n<ul>\n<li>Appropriate for posterior, lateral and anterior fractures.<\/li>\n<li>May have a place where contraindication to other block options exists.<\/li>\n<li>Current evidence suggests it is a relatively safe intervention with low complication rates.<\/li>\n<\/ul><\/section>", "source": "Rib Fractures CPG 2025.pdf"}, {"slug": "spinal-cord-injury", "title": "Spinal Cord Injury", "group": "injuries", "version": "2 (reviewed Mar 2025)", "effective": "1 July 2022", "review": "1 July 2028", "hidden": false, "aim": "To ensure all trauma patients with spinal cord injury receive appropriate early assessment and management.", "objectives": ["To define spinal cord injury terminology and injury syndromes.", "To describe initial management principles for spinal cord injury", "To provide a system for documentation of spinal cord injury"], "footer": "", "related": [{"name": "Emergency Department RSI CPG", "slug": "ed-rsi"}, {"name": "Code Red CPG", "slug": "code-red"}, {"name": "Elderly Trauma CPG", "slug": "elderly-trauma"}], "sections": [{"id": "s1", "title": "Terminology"}, {"id": "s2", "title": "Anatomical and Clinical SCI Syndromes"}, {"id": "s3", "title": "Spinal Shock and Neurogenic Shock"}, {"id": "s4", "title": "Spinal Cord Injury Management Principles"}, {"id": "s5", "title": "Appendix 1: ASIA chart"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"spinal-cord-injury.s1\"><h2>Terminology<\/h2>\n<p>Traumatic spinal cord injury (SCI) occurs when there is a disturbance to normal sensory, motor, or autonomic neurological function following a traumatic injury.<\/p>\n<ul>\n<li>The <strong>sensory level<\/strong> is defined as the most caudal dermatome in which both pinprick and light touch sensation are normal.<\/li>\n<li>The <strong>motor level<\/strong> is defined as the most caudal myotome with intact innervation, below which a motor deficit exists. Because of muscle poly-innervation, the most caudal muscle to have at least grade 3 power is considered to be fully innervated.<\/li>\n<li>The <strong>zone of partial preservation<\/strong> refers to the most caudal dermatome and myotome beyond the motor and sensory level that has some limited preserved function.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"spinal-cord-injury.s2\"><h2>Anatomical and Clinical SCI Syndromes<\/h2>\n<ul>\n<li><strong>Conus medullaris syndrome<\/strong>, or injury of the conus and lumbar nerve roots within the spinal canal. Usually results in areflexic bladder, bowel, and lower extremities.<\/li>\n<\/ul>\n<figure><button aria-label=\"Enlarge figure: Spinal cord injury infographic: types of incomplete spinal cord injuries (apparelyzed.com)\" class=\"zoom\" data-cap=\"Spinal cord injury infographic: types of incomplete spinal cord injuries (apparelyzed.com)\" data-src=\"fig/sci-infographic.jpg\" type=\"button\"><img alt=\"Spinal cord injury infographic: types of incomplete spinal cord injuries (apparelyzed.com)\" loading=\"lazy\" src=\"fig/sci-infographic.jpg\"/><\/button><figcaption>Spinal cord injury infographic: types of incomplete spinal cord injuries (apparelyzed.com)<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<ul>\n<li><strong>Cauda equina syndrome,<\/strong> or injury between the conus and the lumbosacral nerve roots within the spinal canal, also results in areflexic bladder, bowel, and lower limbs.<\/li>\n<li><strong>SCIWORA<\/strong> - Spinal Cord Injury Without Radiographic Abnormalities. Elasticity of the juvenile spine renders the spinal cord vulnerable to injury without vertebral column disruption. More common in children &lt; 8 years old.<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"spinal-cord-injury.s3\"><h2>Spinal Shock and Neurogenic Shock<\/h2>\n<div class=\"tbl stack\"><table>\n<thead>\n<tr>\n<th>Spinal Shock<\/th>\n<th>Neurogenic Shock<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-label=\"Spinal Shock\">• Follows shortly after initial trauma<br/>• May extend <strong>higher<\/strong> than injury<br/>• Manifests as <strong>loss of sensation<\/strong> and <strong>flaccid paralysis<\/strong> below lesion<br/>• Duration: hours – 6 weeks<br/>• May affect <strong>breathing<\/strong> &amp; <strong>autonomic function<\/strong><\/td>\n<td data-label=\"Neurogenic Shock\">• Results from loss of sympathetic tone to CVS<br/>• Manifests as <strong>hypotension, ‘relative’ bradycardia, peripheral vasodilation<\/strong><br/>• Should be diagnosis of exclusion<br/><br/>Tx: Ephedrine boluses + judicious fluids; start Noradrenaline, aim for SBP 100-110 mmHg<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"spinal-cord-injury.s4\"><h2>Spinal Cord Injury Management Principles<\/h2>\n<ul>\n<li>Advanced Trauma Call/ Code Red<\/li>\n<li>Prepare drugs for RSI and Resuscitation<\/li>\n<li>Primary Survey and Imaging as directed by the Trauma Team Leader (TTL)<\/li>\n<\/ul>\n<h3>C-Spine Control<\/h3>\n<ul>\n<li>Ensure padded head rolls + tape &amp; log rolling for all movements<\/li>\n<li>Nurse patients flat, tilt bed 15-20<sup>o<\/sup> head up if tolerated<\/li>\n<li>Early use of padded collar (Miami J)<\/li>\n<\/ul>\n<h3>Airway &amp; Breathing<\/h3>\n<ul>\n<li>Beware of vomiting in CT, consider ondansetron early<\/li>\n<li>Intubation: refer to <a class=\"xref\" href=\"#ed-rsi\">Emergency Department RSI CPG<\/a><\/li>\n<li>Decompress the stomach with an NGT<\/li>\n<li>Avoid Suxamethonium &gt; 72 hours post injury – risk of hyperkalaemia<\/li>\n<\/ul>\n<h3>Circulation<\/h3>\n<ul>\n<li>Hypotension = bleeding until proven otherwise<\/li>\n<li>Bradyarrhythmias (especially during intubation) and other arrhythmias are common<\/li>\n<li>Early arterial line and CVC<\/li>\n<li>Vagal episodes possible on rolling movement<\/li>\n<\/ul>\n<h3>Disability<\/h3>\n<ul>\n<li>ED should document neurology (ASIA chart)<\/li>\n<li>Maintain normothermia, normoglycemia<\/li>\n<li>Imaging as per TTL/Neurosurgeons<\/li>\n<li>Multimodal analgesia<\/li>\n<\/ul>\n<aside class=\"callout\">\n<p><strong>Steroid therapy<\/strong><\/p>\n<ul>\n<li>Not routinely recommended<\/li>\n<li>May be considered by treating neurosurgical consultant<\/li>\n<\/ul>\n<p>Remember about bladder management (Foley catheter), thromboprophylaxis, GIT protection (PPIs, laxatives), skin protection (patients prone to pressure sores)<\/p>\n<\/aside>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"spinal-cord-injury.s5\"><h2>Appendix 1: ASIA chart<\/h2>\n<figure><button aria-label=\"Enlarge figure: International Standards for Neurological Classification of Spinal Cord Injury (ISNCSCI) worksheet, American Spinal Injury Association\" class=\"zoom\" data-cap=\"International Standards for Neurological Classification of Spinal Cord Injury (ISNCSCI) worksheet, American Spinal Injury Association\" data-src=\"fig/sci-asia.jpg\" type=\"button\"><img alt=\"International Standards for Neurological Classification of Spinal Cord Injury (ISNCSCI) worksheet, American Spinal Injury Association\" loading=\"lazy\" src=\"fig/sci-asia.jpg\"/><\/button><figcaption>International Standards for Neurological Classification of Spinal Cord Injury (ISNCSCI) worksheet, American Spinal Injury Association<span>Tap to enlarge<\/span><\/figcaption><\/figure><\/section>", "source": "Spinal Cord Injury CPG 2025.pdf"}, {"slug": "vascular-access", "title": "Vascular Access", "group": "procedures", "version": "2 (reviewed July 2025)", "effective": "1 July 2022", "review": "1 July 2028", "hidden": false, "aim": "To describe the TAG approach to vascular access for resuscitation in trauma patients.", "objectives": ["Describe the key principles of vascular access in Trauma.", "Describe the advanced vascular access options."], "footer": "", "related": [{"name": "Code Red CPG", "slug": "code-red"}, {"name": "REBOA CPG", "slug": null}], "sections": [{"id": "s1", "title": "Key Principles"}, {"id": "s2", "title": "Advanced Vascular Access"}, {"id": "s3", "title": "Rapid Infusion Catheter (RIC)"}, {"id": "s4", "title": "Trauma Line (MAC catheter)"}, {"id": "s5", "title": "Vascular Access Alternatives"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"vascular-access.s1\"><h2>Key Principles<\/h2>\n<ul>\n<li>For general trauma patients requiring contrast CT, an 18G cannula or larger, in the forearm or antecubital fossa is sufficient.<\/li>\n<li>Peripheral wide bore (16G or 14G) access is the first line for initial resuscitation in <strong>Code Red<\/strong> Trauma patients. This may be adequate for entire resuscitation. Consider carefully the risk/benefit of advanced vascular access versus the time delay to CT/Theatre/next phase of care.<\/li>\n<li>Central Trauma line access should be considered early. In patients with no concerns over spinal precautions these may be placed in the internal jugular or subclavian vein. Ultrasound is not mandated but may be useful.<\/li>\n<li>Avoid cannulation at a site distal to an injury that may have caused vascular disruption e.g., proximal humerus fracture. Femoral access should be avoided in patients where abdominal or pelvic injuries are suspected.<\/li>\n<li>Vascular access may have been established during the pre-hospital phase. This may be comprehensive in HEMS patients. These lines should be flushed and aspirated to confirm intravascular placement. <strong>Be wary of line misplacement and have a low threshold for establishing alternative wide bore IV access.<\/strong><\/li>\n<li>Fully sterile placement of lines in extremis is difficult. Aseptic non-touch technique, such as when inserting a cannula, may be a useful temporising alternative.<\/li>\n<li>Pre-hospital and ED placed Trauma lines should be removed following a period of stability after damage control surgery and usually within 24 hours to minimise risk of infection.<\/li>\n<li>Major, non-compressible haemorrhage can occur during craniotomy.<\/li>\n<li>All lines must be capped, secured and cleanly dressed before the patient is delivered to the ACCU.<\/li>\n<li><strong>When inserting any vascular device, regular review of the site must be undertaken for misplacement, especially if the patient is not responding to resuscitation.<\/strong><\/li>\n<li>Femoral sheath access and early Common Femoral Access (CFA) is covered elsewhere: Refer REBOA CPG<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"vascular-access.s2\"><h2>Advanced Vascular Access<\/h2>\n<div class=\"tbl stack\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Prioritise in ED Resus<\/th>\n<th>Delay until Theatre<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td class=\"rowh\"><strong>Advanced Trauma<\/strong><\/td>\n<td data-label=\"Prioritise in ED Resus\">Minimum 1 x 18G<\/td>\n<td data-label=\"Delay until Theatre\">2<sup>nd<\/sup> IV 14G/16G<\/td>\n<\/tr>\n<tr>\n<td class=\"rowh\"><strong>Code Red<\/strong><\/td>\n<td data-label=\"Prioritise in ED Resus\">Trauma Line OR 2 x 14G/16G<\/td>\n<td data-label=\"Delay until Theatre\">20G radial artery catheter<\/td>\n<\/tr>\n<tr>\n<td class=\"rowh\"><strong>Code Black<\/strong><\/td>\n<td data-label=\"Prioritise in ED Resus\">Minimum 1 x 18G<br/>Consider 20G radial artery catheter<\/td>\n<td data-label=\"Delay until Theatre\">Minimum 1 x 14G<br/>Femoral CVC<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"vascular-access.s3\"><h2>Rapid Infusion Catheter (RIC)<\/h2>\n<ul>\n<li><strong>RIC<\/strong> exchange sets are available in two length sizes:<ul>\n<li>7F (5cm)<\/li>\n<li>8.5F (6.4cm)<\/li>\n<\/ul>\n<\/li>\n<li><strong>They can be used to upsize a peripheral cannula (20G or larger).<\/strong><\/li>\n<li>Technique is standard Seldinger: flush the existing cannula, insert guidewire into existing cannula, remove cannula, make a small skin nick at the guidewire entrance into skin, insert catheter/dilator complex over guidewire to hilt, remove guidewire.<\/li>\n<li><strong>Upper limbs/larger veins are preferred<\/strong> (beware elderly, very small/fragile veins).<\/li>\n<li>Monitor limb for signs of extravasation if fluids are being given via the Belmont.<\/li>\n<li>Risk of failure: do not use RIC if the patient has only one IV access.<\/li>\n<\/ul>\n<figure><button aria-label=\"Enlarge figure: Rapid infusion catheter exchange set\" class=\"zoom\" data-cap=\"Rapid infusion catheter exchange set\" data-src=\"fig/vasc-ric.jpg\" type=\"button\"><img alt=\"Rapid infusion catheter exchange set\" loading=\"lazy\" src=\"fig/vasc-ric.jpg\"/><\/button><figcaption>Rapid infusion catheter exchange set<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"vascular-access.s4\"><h2>Trauma Line (MAC catheter)<\/h2>\n<ul>\n<li>Await removal of the scoop stretcher before commencement.<\/li>\n<li>Attempt to perform sterile, however in extremis, omission of cleaning is acceptable.<\/li>\n<li>Trendelenburg position is helpful as is having an assistant hold the ipsilateral wrist and pull the arm towards the foot, ‘squaring’ the shoulder.<\/li>\n<li>During <strong>Code Red<\/strong>, unless specifically precluded, <strong>subclavian access should take place on the left side<\/strong>. This is to remain out of the way of the doctor performing the primary survey, the FAST scan and the airway anaesthetist at the head. The Belmont and blood products are positioned behind the left shoulder and allow easy access to this line.<\/li>\n<li>The MAC Arrow 10cm catheter is currently used by the Trust. It has a brown 9F distal lumen capable of flow rates of up to 500ml/min, and a white 12G proximal lumen, capable of flow rates of 150ml/min. The external diameter is 18F.<\/li>\n<li>Pause to confirm you are in a vein (no pulsatile flow) before inserting the line.<\/li>\n<li>The device is pre-loaded with a 20cm tissue dilator. There should be no resistance on insertion of the guidewire. A small incision is needed at the skin to aid insertion.<\/li>\n<li>The guidewire and dilator are removed as a unit as the line is inserted into the vein, care must be taken to prevent vascular injury by the dilator which protrudes beyond the tip of the line by approximately 5cm. The line should be inserted to the hilt and sutured in place. The blue obturator cap should be placed over the white haemostasis valve to prevent air entrainment.<\/li>\n<li>Confirm placement by aspirating venous blood freely from both lumens. Line position should be checked on any subsequent imaging - the catheter tip should be located in the SVC proximal to the cavo-atrial junction.<\/li>\n<li>An excellent description of the technique including a video can be found here: <a href=\"https://www.statusiatrogenicus.com/2018/11/speed-matters-landmark-guided-left.html\" target=\"_blank\" rel=\"noopener\">https://www.statusiatrogenicus.com/2018/11/speed-matters-landmark-guided-left.html<\/a><\/li>\n<\/ul>\n<figure><button aria-label=\"Enlarge figure: MAC catheter\" class=\"zoom\" data-cap=\"MAC catheter\" data-src=\"fig/vasc-mac.jpg\" type=\"button\"><img alt=\"MAC catheter\" loading=\"lazy\" src=\"fig/vasc-mac.jpg\"/><\/button><figcaption>MAC catheter<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<figure><button aria-label=\"Enlarge figure: Example of hand position and approach to left sided SCV access\" class=\"zoom\" data-cap=\"Example of hand position and approach to left sided SCV access\" data-src=\"fig/vasc-scv.jpg\" type=\"button\"><img alt=\"Example of hand position and approach to left sided SCV access\" loading=\"lazy\" src=\"fig/vasc-scv.jpg\"/><\/button><figcaption>Example of hand position and approach to left sided SCV access<span>Tap to enlarge<\/span><\/figcaption><\/figure>\n<\/section><section class=\"sec\" data-sid=\"s5\" id=\"vascular-access.s5\"><h2>Vascular Access Alternatives<\/h2>\n<div class=\"tbl kv\"><table>\n<tbody>\n<tr>\n<td><strong>Internal jugular Trauma Line<\/strong><\/td>\n<td>This can be considered if subclavian access is not achieved or contraindicated. It should be avoided if coexisting neck/spinal or severe traumatic brain injury is suspected.<\/td>\n<\/tr>\n<tr>\n<td><strong>Intra-Osseous Access (IO)<\/strong><\/td>\n<td>Humeral or tibial IO is acceptable for drug delivery, RSI and initial access. It will not be sufficient for massive transfusion and should be considered a steppingstone to more definitive access.<\/td>\n<\/tr>\n<tr>\n<td><strong>Femoral Cut-down<\/strong><\/td>\n<td>Groin cut down to the femoral vessels and either direct access or indirect Seldinger cannulation (needle through skin into vessel under direct vision) may be an option. Surgical help is usually required.<\/td>\n<\/tr>\n<tr>\n<td><strong>Right Atrial Appendage Access<\/strong><\/td>\n<td>This is best performed by the operating Trauma Surgeon. Access with a foley catheter or Luer extension and is secured with a purse string suture. The fluid giving-set is pushed into the proximal end of the foley and should be secured in place with a suture.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/section>", "source": "Vascular Access CPG 2025.pdf"}, {"slug": "ultrasound", "title": "Ultrasound", "group": "procedures", "version": "2 (reviewed July 2025)", "effective": "1 July 2022", "review": "1 July 2028", "hidden": false, "aim": "To introduce point-of-care ultrasound into clinical practice as an adjunct to patient assessment.", "objectives": ["Describe the principles of focused point-of-care ultrasound in Trauma.", "Describe London’s Air Ambulance point-of-care ultrasound protocol for use by Trauma Anaesthetists."], "footer": "", "related": [{"name": "Code Red CPG", "slug": "code-red"}, {"name": "Vascular access CPG", "slug": "vascular-access"}], "sections": [{"id": "s1", "title": "Introduction"}, {"id": "s2", "title": "Key Principles"}, {"id": "s3", "title": "Anaesthesia Key Principles"}, {"id": "s4", "title": "Limitations"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"ultrasound.s1\"><h2>Introduction<\/h2>\n<p>It has been demonstrated that focused ultrasonography by acute care clinicians can achieve high levels of sensitivity and specificity. However, it is explicit that ultrasound use is an adjunct which augments clinical examination, neither replacing it nor ignoring the cumulative body of other clinical evidence (or lack thereof) for a diagnosis. It should be used to answer specific, focused, and binary questions generated by that examination. POCUS has been shown to lead to a change in polytrauma management decisions or triage in as many as 30% of cases and improves diagnostic accuracy by 70-90%.<\/p>\n<p>This Clinical Practice Guideline describes the London’s Air Ambulance focussed protocol for consideration for use by Trauma Anaesthetists with relevant skills. This guideline does not replace formal ultrasound training or accreditation with relevant professional bodies.<\/p>\n<\/section><section class=\"sec\" data-sid=\"s2\" id=\"ultrasound.s2\"><h2>Key Principles<\/h2>\n<ul>\n<li>The POCUS protocol should be used by clinicians to answer specific diagnostic or therapeutic clinical questions taken in context of the mechanism of injury, the physiological parameters and the clinical findings on examination. Where there is difficulty in differentiating causes of shock or in the completely undifferentiated patient, the full protocol should be deployed unless there is reasonable justification to exclude an element.<\/li>\n<li>Clinicians should not become task-fixated or delay resuscitation to conduct lengthy POCUS examinations.<\/li>\n<li>If it is not possible to achieve a satisfactory image within a reasonable time frame, or if the image is not consistent with the clinical picture, <strong>then trust the clinical picture.<\/strong><\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s3\" id=\"ultrasound.s3\"><h2>Anaesthesia Key Principles<\/h2>\n<p>The following scenarios are envisaged for the use of POCUS for Trauma:<\/p>\n<ul>\n<li><strong>Critically injured trauma patients with a specific diagnostic or pathophysiological question answerable through POCUS.<\/strong><\/li>\n<li><strong>Cardiac arrest.<\/strong><\/li>\n<li><strong>Vascular access.<\/strong><\/li>\n<\/ul>\n<aside class=\"callout\">\n<p><strong>LAA POCUS Protocol:<\/strong> ‘Pump – Pleura – Pouring Blood?’<\/p>\n<\/aside>\n<h3>1. ‘Pump’<\/h3>\n<p>Ultrasound is most sensitive and specific for the evaluation of patients with precordial or transthoracic wounds (sensitivity 93%, specificity 99% for cardiac tamponade). Therefore, a sub-xiphoid view of the heart should be achieved intending to answer the following questions:<\/p>\n<ul>\n<li><strong>Is there a pericardial collection?<\/strong><\/li>\n<li><strong>Is the left ventricle empty or full?<\/strong><\/li>\n<li><strong>Is the left ventricle contracting well or poorly?<\/strong><\/li>\n<li><strong>Is the right ventricle contracting well or poorly?<\/strong><\/li>\n<\/ul>\n<p>This single window allows an opportunity to distinguish between obstructive, hypovolaemic and cardiogenic shock pictures or to identify when more than one discrete aetiology is present.<\/p>\n<h3>2. ‘Pleura’<\/h3>\n<p>Ultrasound has a higher sensitivity in diagnosing a pneumothorax than clinical examination or chest radiography (positive predictive values 80-90%; negative predictive values 70-90%).<\/p>\n<p>Clinicians should perform a two-point examination bilaterally in the most anterior portion of the chest (dependent on patient position) evaluating for presence or absence of lung sliding to answer the question:<\/p>\n<ul>\n<li><strong>Is there a pneumothorax?<\/strong><\/li>\n<\/ul>\n<h3>3. ‘Pouring Blood?’<\/h3>\n<p>Two specific examinations are valuable to identify haemorrhage. A bilateral evaluation in the most basal/ dependent areas of the chest (dependent on patient position) evaluating for presence or absence of a large fluid collection; and the right upper quadrant (RUQ) view of a Trauma FAST Scan evaluating for a fluid collection in Morrison’s pouch or around the liver; in order to answer the following questions:<\/p>\n<ul>\n<li><strong>Is there the presence of a massive haemothorax?<\/strong><\/li>\n<li><strong>Is there the presence of a massive haemoperitoneum?<\/strong><\/li>\n<\/ul>\n<p>Blood is most often found on a Trauma FAST Scan in the RUQ area in patients with multiple intraperitoneal injuries or isolated injury to the liver, spleen, or retroperitoneum. Of the three areas visible in this view (hepato-diaphragmatic, Morrison’s pouch, caudal liver edge and superior para-colic gutter) the caudal liver edge is the area most sensitive for the detection of blood.<\/p>\n<p>Data demonstrates a sensitivity of approximately 70% (range 60-80%) for detection of blood with a specificity of approximately 98-99%. Sensitivity is increased if the patients are hypotensive and have suffered blunt abdominal trauma and approaches 100% in this context.<\/p>\n<p>False-negative results do occur, and this is most frequently in scans performed early in the disease process and interestingly in patients with higher ISS. Therefore, when RUQ scan is negative it is recommended to repeat the examination serially (15 min intervals) where practical as this may reduce error rate by 50%. Thus, in hypotensive patients with a negative study, clinicians should maintain a high index of suspicion for significant abdominal bleeding. It should be noted ultrasound is also poor at detecting injuries to a hollow viscus.<\/p>\n<h3>4. Cardiac Arrest<\/h3>\n<p>As many as 75% of patients in PEA cardiac arrest (medical) are demonstrated to have cardiac activity with ultrasound (pseudo-PEA). Pseudo-PEA has a high correlation with survival compared to true PEA if identified early and treated appropriately. In medical cardiac arrest 94% of patients with cardiac standstill demonstrable on POCUS will not survive to hospital (97.5% positive predictive value for death). After 10 minutes of resuscitation if cardiac standstill remains, there are no survivors, and this benchmark has been recommended as a marker for cessation of resuscitation attempts unless there exist mitigating factors (hypothermia; drug intoxication). In traumatic cardiac arrest Trauma FAST Scan is also a predictor of futility. The absence of pericardial blood or cardiac activity at scan (even with thoracotomy) for blunt or penetrating arrest has been shown to be uniformly fatal.<\/p>\n<p>POCUS may have a role in cardiac arrest and aims to answer questions which may guide resuscitation decisions specifically with respect to the following:<\/p>\n<ul>\n<li><strong>Is there a pericardial effusion?<\/strong> (Consider thoracotomy)<\/li>\n<li><strong>Is there a massive haemoperitoneum?<\/strong> (Early surgery)<\/li>\n<li><strong>Is there cardiac standstill?<\/strong> (Consider futility)<\/li>\n<\/ul>\n<p>Post ROSC:<\/p>\n<ul>\n<li><strong>Is the heart empty or full?<\/strong> (Hypovolaemia)<\/li>\n<li><strong>Is the heart beating well or poorly?<\/strong> (Cardiogenic shock)<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sid=\"s4\" id=\"ultrasound.s4\"><h2>Limitations<\/h2>\n<p>POCUS is used by non-radiologists to answer simple yes/ no questions and to guide treatment decisions. Sensitivity for isolated solid organ injuries can be low and small quantities of blood early in the post-injury phase may be missed. Traumatic aortic pathology cannot be detected by chest or abdominal ultrasound. False negatives will occur; therefore, negative findings should not indicate a final exclusion of diagnoses.<\/p><\/section>", "source": "Ultrasound CPG 2025.pdf"}, {"slug": "tag-skillset", "title": "TAG Skillset", "group": "procedures", "version": "2 (reviewed July 2025)", "effective": "1 July 2022", "review": "1 July 2028", "hidden": false, "aim": "To ensure all Trauma Anaesthesia Group (TAG) members have a standardised skillset.", "objectives": ["Describe the minimum and aspirational skillset of the TAG."], "footer": "", "related": [], "sections": [{"id": "s1", "title": "Core Skills"}, {"id": "s2", "title": "Specialist Clinical Skills"}, {"id": "s3", "title": "Aspirational/ Future-intended Skills"}], "html": "<section class=\"sec\" data-sid=\"s1\" id=\"tag-skillset.s1\"><h2>Core Skills<\/h2>\n<ul>\n<li>Standardised resuscitation of Code Red/ Traumatic Cardiac Arrest<\/li>\n<li>Standardised resuscitation
